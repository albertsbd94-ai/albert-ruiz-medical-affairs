A de propósito general no aprobadas por compliance?", "options": ["Preguntas generales sobre mecanismos de acción ya publicados", "Datos confidenciales e identificables de pacientes o HCPs", "Resúmenes de artículos ya publicados públicamente", "Preguntas sobre metodología estadística general"], "correct": 1, "explain": "Los datos confidenciales e identificables de pacientes o HCPs requieren garantías de privacidad que las herramientas genéricas no aprobadas no ofrecen."}, {"q": "¿Para qué tipo de tarea está especialmente indicado NotebookLM en un flujo de trabajo de Medical Affairs?", "options": ["Generar imágenes médicas de alta resolución", "Consultar un conjunto delimitado de documentos propios manteniendo las respuestas ancladas exclusivamente a esas fuentes", "Sustituir por completo la revisión de un comité ético", "Redactar directamente publicaciones científicas sin ninguna revisión"], "correct": 1, "explain": "NotebookLM está diseñado para trabajar con un corpus de documentos cerrado, reduciendo el riesgo de información no anclada a las fuentes."}, {"q": "¿Qué principio describe mejor el concepto de 'human-in-the-loop' en los flujos de trabajo médicos con IA?", "options": ["La IA debe operar de forma completamente autónoma sin ninguna supervisión", "Mantener supervisión y validación humana experta en los puntos de decisión críticos del flujo de trabajo", "Solo se aplica a tareas administrativas sin relevancia científica", "Es un concepto exclusivo de ingeniería de software, no aplicable a Medical Affairs"], "correct": 1, "explain": "El human-in-the-loop asegura que el juicio médico experto valide las decisiones críticas, incluso al usar la IA como apoyo."}, {"q": "¿Cuál es el propósito de una 'matriz de selección de herramientas' en un Sistema Operativo de IA para Medical Affairs?", "options": ["Elegir aleatoriamente qué herramienta de IA usar cada día", "Asociar el tipo de tarea con la herramienta de IA más adecuada para ejecutarla de forma consistente", "Sustituir la necesidad de un Plan Médico", "Decidir el presupuesto anual del departamento"], "correct": 1, "explain": "La matriz ayuda a estandarizar qué herramienta usar según la naturaleza de la tarea, evitando un uso ineficiente o inapropiado."}, {"q": "Al preparar un informe de congreso con asistencia de IA, ¿cuál es el paso final esencial antes de distribuirlo?", "options": ["Distribuirlo directamente sin revisión para ahorrar tiempo", "Validación científica y de compliance del contenido generado por IA antes de la distribución final", "Traducirlo a todos los idiomas posibles", "Publicarlo automáticamente en redes sociales"], "correct": 1, "explain": "Ningún contenido asistido por IA debe distribuirse sin la correspondiente validación de un experto y de compliance."}, {"q": "¿Qué riesgo es más relevante al usar herramientas de IA de propósito general para investigación de panorama (por ejemplo, Perplexity)?", "options": ["Que sean demasiado lentas para ser útiles", "Que las fuentes citadas siempre deben verificarse contra las fuentes primarias antes de un uso formal", "Que no permiten ningún tipo de búsqueda", "Que solo funcionan en un idioma"], "correct": 1, "explain": "Verificar las fuentes primarias es esencial, ya que las herramientas de IA pueden citar de forma imprecisa o referenciar información desactualizada."}, {"q": "¿Cuál de las siguientes NO es una función apropiada de un agente de IA en un flujo de trabajo médico semiautónomo?", "options": ["Encadenar tareas de investigación y síntesis de documentos con puntos de revisión humana", "Decidir de forma autónoma, sin supervisión, sobre la validez científica de evidencia crítica", "Generar un primer borrador de informe para su posterior revisión", "Estructurar las notas de una reunión en categorías temáticas para facilitar el análisis humano"], "correct": 1, "explain": "Las decisiones científicas críticas siempre requieren validación humana experta; el agente de IA debe apoyar, no decidir de forma autónoma, en estos puntos."}]}, {"num": 12, "title": "Liderazgo en Medical Affairs y Acelerador de Carrera", "objective": "Desarrollar el liderazgo médico, la marca personal y una estrategia de carrera sólida a largo plazo en Medical Affairs.", "lessons": [{"title": "Competencias del líder médico", "text": "Liderar en Medical Affairs no exige, en la mayoría de los casos, un título formal de dirección: exige un conjunto de competencias que se pueden desarrollar y demostrar desde el primer día de un rol de MSL, y que son precisamente las que determinan quién avanza hacia posiciones de mayor responsabilidad dentro de la función. Entender estas competencias con claridad es el primer paso de este módulo final, dedicado a acelerar la trayectoria profesional dentro de Medical Affairs.\n\nLa primera competencia es la capacidad de trabajar eficazmente con stakeholders diversos, tanto internos como externos, construyendo relaciones basadas en confianza genuina, sabiendo navegar perspectivas y prioridades distintas —a veces contrapuestas— entre funciones como comercial, acceso al mercado, asuntos regulatorios y la propia comunidad científica externa. Esta habilidad, ya trabajada en las dimensiones relacionales de módulos anteriores de este curso, se convierte en una competencia de liderazgo cuando se ejerce de forma consciente para alinear a actores distintos alrededor de un objetivo médico compartido.\n\nLa segunda competencia es el pensamiento estratégico y la visión de negocio: los futuros líderes de Medical Affairs necesitan una comprensión cada vez más amplia y transfuncional, tanto de los aspectos médicos como de los aspectos comerciales del desarrollo farmacéutico, con un conocimiento del negocio que resulta cada vez más relevante para sustentar decisiones informadas a lo largo de todo el ciclo de vida de un producto. Esto no significa que un líder médico deba convertirse en comercial, sino que debe entender con suficiente profundidad el contexto de negocio en el que opera para poder integrar la perspectiva médica de forma efectiva en las decisiones estratégicas de la organización.\n\nLa tercera competencia es la influencia sin autoridad formal, que se desarrolla en profundidad en la siguiente lección de este módulo, y que constituye quizá la habilidad más distintiva y más exigida de un liderazgo médico eficaz en una estructura organizativa matricial, donde rara vez existe autoridad jerárquica directa sobre la mayoría de los equipos con los que hay que coordinarse.\n\nLa cuarta competencia es la orientación al desarrollo de otros: los líderes de Medical Affairs más eficaces se conciben a sí mismos como facilitadores del éxito de sus equipos científicos y del resto de colaboradores, en lugar de como figuras de autoridad centradas en su propio protagonismo —un principio de liderazgo de servicio (servant leadership) que la literatura especializada identifica de forma creciente como una ventaja competitiva real para las organizaciones médicas.\n\nDesarrollar estas cuatro competencias no requiere esperar a un ascenso formal: cada interacción con un stakeholder, cada decisión que conecta la actividad diaria con la estrategia más amplia, y cada oportunidad de ayudar a un compañero a crecer profesionalmente es, en sí misma, una oportunidad de practicar y demostrar liderazgo médico, mucho antes de que ese liderazgo se refleje en un título formal.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "THE MSL Journal — Servant Leadership in Medical Affairs: A Competitive Advantage", "url": "https://themsljournal.com/article/servant-leadership-in-medical-affairs-a-competitive-advantage/"}]}, {"title": "Pensamiento estratégico", "text": "El pensamiento estratégico es la capacidad de conectar la actividad diaria, concreta y a menudo operativa de un profesional de Medical Affairs con el panorama más amplio del negocio, del producto y de la organización —una habilidad que distingue a quien simplemente ejecuta tareas de quien anticipa, prioriza y orienta su trabajo hacia lo que realmente importa a medio y largo plazo.\n\nDesarrollar pensamiento estratégico empieza por adquirir un conocimiento genuino del negocio farmacéutico más allá de la propia función médica: entender cómo se financia el desarrollo de un fármaco, qué presión temporal impone la protección de patente sobre las decisiones de un producto, cómo funcionan las decisiones de acceso y reembolso en los mercados relevantes, y qué papel juega cada función de la organización —comercial, acceso al mercado, asuntos regulatorios, farmacovigilancia— en el éxito global del producto. Este conocimiento transfuncional, cada vez más exigido a los líderes de Medical Affairs, permite integrar la perspectiva médica de forma más persuasiva y relevante en las conversaciones estratégicas de la organización.\n\nUn segundo componente del pensamiento estratégico es la capacidad de conectar de forma explícita cada actividad propia con los imperativos estratégicos del Plan Médico trabajados en el Módulo 9: antes de dedicar tiempo a una actividad —una relación con un KOL, la cobertura de un congreso, la exploración de un insight— preguntarse conscientemente cómo contribuye esa actividad concreta a los objetivos médicos de mayor prioridad del ciclo actual, en lugar de operar de forma puramente reactiva ante lo que surge cada día.\n\nUn tercer componente es la capacidad de anticipación: leer señales tempranas del entorno —un cambio en el panorama competitivo, una tendencia emergente en la comunidad científica, un cambio regulatorio en discusión— y pensar con antelación en sus implicaciones para la estrategia médica, en lugar de reaccionar únicamente cuando esas señales se convierten en hechos consumados. Esta capacidad se nutre directamente de las prácticas de escucha médica y de inteligencia científica trabajadas en los Módulos 8 y 10 de este curso.\n\nUn cuarto componente, más avanzado, es la capacidad de tomar decisiones con información incompleta, priorizando entre alternativas razonables cuando no existe una respuesta obviamente correcta —una habilidad que se desarrolla con la práctica deliberada de enfrentar decisiones reales, no solo con formación teórica—.\n\nEl pensamiento estratégico no es un rasgo innato reservado a quienes ocupan posiciones directivas: es una disciplina que se practica y se refina activamente en cada decisión cotidiana, y los profesionales que la desarrollan de forma consciente desde etapas tempranas de su carrera son, de forma consistente, quienes más rápido acceden a posiciones de mayor responsabilidad estratégica dentro de Medical Affairs.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "Medical Affairs Professional Society (MAPS) — Standards & Guidance: Medical Strategic Plan", "url": "https://medicalaffairs.org/standards-guidance-medical-strategic-plan/"}]}, {"title": "Influencia sin autoridad", "text": "La influencia sin autoridad formal es, según la literatura especializada en liderazgo dentro de estructuras matriciales, una de las competencias más determinantes —y más difíciles de desarrollar— para cualquier profesional de Medical Affairs que aspire a un rol de mayor impacto estratégico, precisamente porque la función médica rara vez cuenta con autoridad jerárquica directa sobre los equipos comerciales, de acceso al mercado o de investigación clínica con los que necesita coordinarse constantemente.\n\nEl punto de partida de la influencia sin autoridad es la credibilidad construida a través de la competencia demostrada: nadie sigue de forma sostenida a alguien que no percibe como genuinamente competente en su área, así que la base de toda influencia dentro de Medical Affairs sigue siendo el rigor científico, la fiabilidad de la información compartida, y la coherencia entre lo que se dice y lo que se hace, principios ya trabajados en profundidad a lo largo de todo este curso.\n\nSobre esa base de credibilidad, la influencia efectiva se construye a través de varios mecanismos concretos. El primero es la construcción deliberada de redes de relación: cultivar relaciones de confianza con stakeholders clave de otras funciones antes de necesitar su colaboración en un proyecto concreto, de forma que cuando llega el momento de pedir apoyo o alineamiento, esa relación previa facilita una conversación mucho más receptiva que un primer contacto motivado únicamente por una necesidad puntual. El segundo es la persuasión basada en evidencia y en el interés compartido: presentar argumentos que conecten explícitamente el objetivo propio con los intereses y las prioridades de la otra parte, en lugar de apelar únicamente a la autoridad del propio conocimiento científico, un enfoque de influencia que la literatura describe como particularmente eficaz para generar apoyo genuino a las propias ideas en lugar de cumplimiento superficial.\n\nUn tercer mecanismo es la escucha activa y la adaptación del mensaje: entender primero las preocupaciones, los objetivos y el lenguaje propio de cada función con la que se necesita colaborar —qué le importa a un responsable de acceso al mercado no es necesariamente lo mismo que le importa a un director médico o a un investigador clínico— y adaptar la forma de presentar una misma idea según la audiencia, sin comprometer nunca el contenido científico ni la independencia de Medical Affairs.\n\nUn cuarto mecanismo, más sutil pero muy efectivo según la literatura sobre liderazgo médico, es minimizar deliberadamente la ostentación de autoridad y, en su lugar, liderar mediante la coacción persuasiva y el ejemplo: los líderes que evitan imponer su posición y en cambio generan apoyo genuino a través de la persuasión razonada suelen conseguir un respaldo más sólido y duradero para sus ideas que quienes dependen de la jerarquía formal.\n\nDominar la influencia sin autoridad es, en última instancia, lo que permite que la voz de Medical Affairs —una función sin poder de decisión comercial directa pero con un conocimiento científico indispensable— se escuche, se integre y, con el tiempo, se busque de forma proactiva en las decisiones estratégicas más importantes de la organización.", "sources": [{"label": "SOCRA — Leadership: Influencing Without Authority in Clinical Research", "url": "https://www.socra.org/blog/cra-leadership-influencing-without-authority-clinical-research/"}, {"label": "Fiona Day Consulting — How do you develop your ability to influence without authority as a medical or public health leader?", "url": "https://fionadayconsulting.co.uk/how-do-you-develop-your-ability-to-influence-without-authority-as-a-medical-or-public-health-leader/"}, {"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}]}, {"title": "Comunicación ejecutiva", "text": "Comunicar con eficacia ante una audiencia directiva es una habilidad distinta de la comunicación científica trabajada a lo largo de este curso para interacciones con HCPs: mientras que una conversación científica con un KOL puede permitirse profundidad técnica y un desarrollo progresivo del argumento, una comunicación ante un comité directivo o un equipo de liderazgo senior exige síntesis, claridad inmediata sobre la conclusión, y un uso disciplinado del tiempo limitado de atención de la audiencia.\n\nEl principio central de la comunicación ejecutiva, ya introducido en el Módulo 8 al hablar del informe ejecutivo de congreso, es \"empezar por la conclusión\": una audiencia directiva necesita saber, en los primeros segundos de una presentación o de un documento, cuál es el mensaje principal y qué decisión o acción se espera de ella, antes de conocer todo el desarrollo argumental que sustenta esa conclusión. Este orden invierte la lógica narrativa habitual de la comunicación científica, que tiende a construir progresivamente hacia una conclusión final, y exige una disciplina de síntesis que muchos profesionales técnicamente sólidos no dominan de forma natural.\n\nUn segundo principio es la relevancia estratégica sobre el detalle operativo: una audiencia directiva no necesita conocer cada paso del proceso que llevó a un resultado, sino entender las implicaciones de ese resultado para las decisiones que a ella le corresponde tomar. Esto exige un ejercicio deliberado de traducción: convertir el trabajo técnico y detallado del terreno en un lenguaje de impacto y de decisión, sin perder el rigor de fondo mientras se elimina el ruido de detalle irrelevante para esa audiencia concreta.\n\nUn tercer principio es el uso disciplinado de apoyos visuales: gráficos y esquemas simples que comuniquen de un vistazo lo que un párrafo de texto tardaría en explicar, evitando la sobrecarga de información en una sola diapositiva o página, un error frecuente entre profesionales científicos habituados a la densidad de las publicaciones académicas pero no siempre entrenados en comunicación visual ejecutiva.\n\nUn cuarto principio, especialmente relevante para un profesional de Medical Affairs, es mantener el rigor científico incluso en la síntesis: comunicar de forma ejecutiva no significa simplificar hasta perder la precisión ni ocultar las limitaciones relevantes de una evidencia o de una recomendación —significa seleccionar con criterio qué información es esencial para la decisión que se está apoyando, sin sacrificar nunca la honestidad científica que constituye la base de la credibilidad de toda la función.\n\nPracticar la comunicación ejecutiva de forma deliberada —buscando activamente oportunidades de presentar ante audiencias de liderazgo, pidiendo retroalimentación específica sobre claridad y síntesis, y revisando de forma crítica las propias presentaciones antes de entregarlas— es una de las inversiones de desarrollo profesional con mayor retorno para cualquier MSL que aspire a roles de mayor responsabilidad estratégica.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "Prezent — Congress Communication in Pharma: Complete Guide", "url": "https://www.prezent.ai/blog/congress-communication"}]}, {"title": "Gestión de stakeholders internos", "text": "Un MSL con vocación de liderazgo debe aprender a gestionar con la misma intención estratégica sus relaciones internas dentro de la organización que las relaciones externas con KOLs y DOLs trabajadas a lo largo de este curso. Los stakeholders internos —comercial, acceso al mercado, asuntos regulatorios, investigación clínica, otros MSLs y la propia dirección de Medical Affairs— determinan en gran medida cuánto impacto puede tener el trabajo de un profesional, incluso cuando ese trabajo es de gran calidad técnica.\n\nEl primer paso para gestionar bien estas relaciones es entender los objetivos y las presiones de cada función con la que se interactúa: un equipo comercial se mide por resultados de negocio a corto y medio plazo; un equipo de acceso al mercado necesita evidencia de valor económico y clínico para sustentar decisiones de reembolso; un equipo de investigación clínica prioriza el rigor metodológico y el cumplimiento de plazos de estudio. Entender estas prioridades distintas —sin adoptarlas como propias, dado que Medical Affairs debe mantener su independencia científica— permite anticipar mejor cómo comunicar una misma información de forma relevante para cada audiencia interna.\n\nEl segundo paso es establecer canales de comunicación regulares y no solo reactivos: reuniones periódicas de alineamiento con los equipos con los que se colabora de forma más frecuente, en lugar de contactar únicamente cuando surge una necesidad puntual, construye la relación de confianza que después facilita la colaboración en momentos de mayor presión o de decisiones más complejas.\n\nEl tercer paso, especialmente delicado para Medical Affairs, es mantener límites claros de independencia mientras se colabora activamente: compartir insights y contexto científico relevante con otras funciones sin comprometer nunca la naturaleza no promocional del propio rol, un equilibrio que exige claridad interna sobre qué información puede compartirse, con qué propósito, y a través de qué canales formales, coherente con los principios éticos trabajados en el Módulo 7.\n\nEl cuarto paso es gestionar de forma proactiva los desacuerdos legítimos entre funciones: cuando la perspectiva médica y la perspectiva comercial o de acceso al mercado no coinciden sobre una decisión concreta —algo que ocurre con normalidad en cualquier organización matricial—, un profesional con madurez de liderazgo aborda ese desacuerdo con argumentos basados en evidencia y en el interés a largo plazo del producto y de los pacientes, buscando una resolución constructiva en lugar de evitar la conversación o imponer su posición por la fuerza de la autoridad científica.\n\nGestionar bien estas relaciones internas no es una tarea política ajena al verdadero trabajo médico: es, en la práctica, lo que determina si el conocimiento científico generado por Medical Affairs se traduce en decisiones reales de la organización, o se queda archivado sin influencia efectiva en la estrategia del producto.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Fiona Day Consulting — How do you develop your ability to influence without authority as a medical or public health leader?", "url": "https://fionadayconsulting.co.uk/how-do-you-develop-your-ability-to-influence-without-authority-as-a-medical-or-public-health-leader/"}, {"label": "SOCRA — Leadership: Influencing Without Authority in Clinical Research", "url": "https://www.socra.org/blog/cra-leadership-influencing-without-authority-clinical-research/"}]}, {"title": "Marca personal en Medical Affairs", "text": "La marca personal de un profesional de Medical Affairs es la reputación científica y profesional que se construye, de forma deliberada o involuntaria, a través de cada interacción, cada publicación y cada presencia pública a lo largo de una carrera. En un campo tan basado en la confianza y la credibilidad como Medical Affairs, cultivar esa marca de forma consciente —sin caer nunca en la autopromoción vacía o en un tono que recuerde a la comunicación comercial— es una inversión de carrera con retorno significativo a medio y largo plazo.\n\nEl fundamento de cualquier marca personal sólida en este campo es el mismo que sostiene la credibilidad de toda la función: el rigor científico demostrado de forma consistente a lo largo del tiempo. Ninguna estrategia de comunicación o de visibilidad compensa la falta de sustancia científica real; la marca personal amplifica una reputación ya merecida, no la sustituye.\n\nSobre esa base, la construcción activa de marca personal se apoya en varios elementos concretos. La especialización visible: ser reconocido por un conocimiento profundo en un área terapéutica o en una competencia específica (por ejemplo, excelencia en insights, o dominio particular de metodología estadística) en lugar de presentarse como un generalista indiferenciado, facilita que otros profesionales —tanto dentro de la organización como en la comunidad científica externa— piensen en esa persona de forma natural cuando surge una necesidad relacionada con esa especialidad. La consistencia de presencia profesional: mantener un perfil actualizado y coherente en plataformas profesionales como LinkedIn, que refleje con precisión la experiencia, el rol y los intereses científicos genuinos, sin exagerar ni tergiversar la propia trayectoria. Y las contribuciones visibles al conocimiento colectivo: participar en foros profesionales, contribuir con comentarios sustantivos a discusiones científicas relevantes, o colaborar en iniciativas internas de formación o de mejores prácticas, actividades que construyen reputación de forma orgánica a través de la contribución real, no de la autopromoción directa.\n\nUn error frecuente que debe evitarse con disciplina es confundir marca personal con autopromoción comercial: compartir logros propios de forma desproporcionada, o utilizar el tono y las técnicas de comunicación propias del marketing personal genérico, resulta contraproducente en un campo donde la credibilidad se basa precisamente en la ausencia de intención promocional. La marca personal más eficaz en Medical Affairs se construye de forma indirecta, a través de la calidad sostenida del propio trabajo y de contribuciones genuinas a la comunidad científica y profesional, más que a través de una estrategia de visibilidad autocentrada.\n\nDesarrollar esta marca personal de forma consciente desde etapas tempranas de la carrera —no solo cuando se busca activamente un ascenso o un cambio de rol— es lo que hace que, cuando llega el momento de una oportunidad de mayor responsabilidad, la reputación profesional ya construida hable por sí misma.", "sources": [{"label": "LinkedIn Learning — Establish your personal brand: How to Become a Thought Leader", "url": "https://www.linkedin.com/learning/how-to-become-a-thought-leader-and-advance-your-career/establish-your-personal-brand"}, {"label": "LinkedIn — How to Build a Personal Brand as a Thought Leader", "url": "https://www.linkedin.com/top-content/marketing/personal-brand-building/how-to-build-a-personal-brand-as-a-thought-leader/"}, {"label": "The MSL Academy — Transitioning into the MSL Role Without Industry Experience", "url": "https://www.themslacademy.com/blog/from-bench-to-field-transitioning-into-the-msl-role-without-industry-experience"}]}, {"title": "Liderazgo de pensamiento en LinkedIn", "text": "Ser reconocido como una voz de referencia (thought leader) en un área concreta dentro de LinkedIn exige una estrategia de contenido deliberada, distinta del uso puntual descrito en el Módulo 10 para la relación con DOLs individuales: aquí el foco es la construcción sostenida de una presencia propia reconocible, siempre dentro de los límites de rigor científico y de no promoción que rigen toda la actividad de un profesional de Medical Affairs.\n\nEl primer elemento de una estrategia de thought leadership eficaz es la claridad de enfoque: definir con precisión en qué área concreta se quiere ser reconocido —por ejemplo, un ámbito terapéutico específico, la aplicación de inteligencia artificial en Medical Affairs, o la excelencia en generación de insights— en lugar de intentar comunicar sobre todo de forma dispersa. Esta especialización facilita que la audiencia asocie de forma clara y recordable a esa persona con ese tema concreto.\n\nEl segundo elemento es la consistencia: publicar y participar de forma regular, aunque sea con una frecuencia moderada, construye visibilidad de forma mucho más efectiva que una actividad esporádica e impredecible. El contenido no necesita ser exclusivamente original: comentar de forma sustantiva y con perspectiva propia publicaciones científicas relevantes, resumir de forma accesible un hallazgo importante de un congreso reciente, o compartir una reflexión genuina sobre una tendencia del área terapéutica son formas de contribución que construyen reputación con la misma eficacia que el contenido enteramente original, y con menor exigencia de tiempo.\n\nEl tercer elemento es el formato adaptado a la plataforma: contenido breve, visualmente claro y directamente útil para la audiencia profesional de LinkedIn tiende a generar mayor interacción genuina que textos extensos o excesivamente técnicos; explicar un concepto clínico complejo de forma accesible a través de un breve vídeo o una infografía, por ejemplo, demuestra tanto conocimiento científico como habilidad de comunicación, una combinación particularmente valorada en el sector.\n\nEl cuarto elemento, indispensable para un profesional de Medical Affairs, es el filtro de compliance previo a cualquier publicación: todo contenido compartido debe seguir las políticas internas de comunicación digital de la organización trabajadas en el Módulo 10, evitando cualquier apariencia de promoción de producto, respetando la separación estricta entre opinión científica personal y posicionamiento oficial de la compañía, y aplicando siempre el mismo rigor de verificación de fuentes que en cualquier otra comunicación científica.\n\nConstruir thought leadership en LinkedIn no es un fin en sí mismo, sino una herramienta que, bien ejecutada de forma sostenida, amplifica la marca personal descrita en la lección anterior y abre puertas profesionales —nuevas colaboraciones, invitaciones a participar en iniciativas relevantes, y visibilidad ante quienes toman decisiones de contratación— mucho antes de que esa persona busque activamente una nueva oportunidad.", "sources": [{"label": "HubSpot — How to Become a LinkedIn Thought Leader in 9 Easy Steps", "url": "https://blog.hubspot.com/marketing/linkedin-thought-leadership"}, {"label": "National Search Group — Build a Powerful LinkedIn Thought Leadership Profile", "url": "https://www.nationalsearchgroup.com/build-linkedin-thought-leadership-profile/"}, {"label": "C-Suite Content — LinkedIn Personal Branding: A Complete How-To Guide", "url": "https://csuitecontent.com/an-in-depth-guide-to-linkedin-personal-branding/"}]}, {"title": "Entrevistas para roles de MSL y Medical Advisor", "text": "El proceso de selección para roles de MSL y Medical Advisor sigue, según la experiencia consolidada del sector, una estructura relativamente predecible que puede constar de hasta cuatro etapas: una entrevista telefónica inicial de cribado, una entrevista más profunda con el equipo contratante, en muchos casos pruebas psicométricas de aptitud y estilo de trabajo, y una entrevista final que habitualmente incluye una presentación clínica preparada por el candidato y, con mucha frecuencia, un ejercicio de simulación de una visita a un KOL frente a un panel evaluador.\n\nEl ejercicio de simulación de visita (role play) merece preparación específica: el panel evalúa no solo el conocimiento científico del candidato, sino su capacidad de mantener una conversación informativa, atractiva y profesional que demuestre comprensión genuina del rol de MSL —aplicando exactamente los principios de intercambio científico, escucha activa y preguntas estratégicas trabajados en el Módulo 4 de este curso—, y no una simulación de discurso comercial disfrazado de conversación científica, un error que los evaluadores experimentados detectan con facilidad.\n\nLa preparación de la presentación clínica exige seleccionar un tema que permita demostrar simultáneamente profundidad científica y capacidad de comunicación clara: estructurar la presentación siguiendo los mismos principios de comunicación ejecutiva trabajados en este mismo módulo —empezando por el mensaje central, apoyándose en datos bien seleccionados y visualmente claros, y siendo capaz de responder con solidez a preguntas de seguimiento sobre metodología o limitaciones del estudio elegido, aplicando el pensamiento crítico sobre evidencia trabajado en el Módulo 6—.\n\nDemostrar conocimiento actualizado del sector es otro factor determinante que los reclutadores valoran de forma consistente: mantenerse al día sobre aprobaciones recientes de fármacos, abstracts destacados de congresos relevantes, y ampliaciones de indicación en el área terapéutica de interés permite al candidato hacer referencias concretas y actuales durante la entrevista, demostrando un interés genuino y activo en el campo, más allá del conocimiento teórico adquirido en formación previa.\n\nFinalmente, la fase de preguntas del candidato al entrevistador —habitualmente al cierre de cada etapa del proceso— es también una oportunidad de demostrar criterio profesional: preguntar de forma genuina sobre las oportunidades de progresión de carrera dentro de la organización, sobre cómo se mide el éxito en el rol, o sobre la estructura y prioridades del Plan Médico del producto en cuestión, comunica al entrevistador un nivel de reflexión estratégica que distingue a un candidato preparado de uno que simplemente busca cualquier puesto disponible.\n\nPrepararse con este nivel de detalle para un proceso de selección de Medical Affairs no es un ejercicio aislado: es, en sí mismo, una aplicación práctica de casi todas las competencias trabajadas a lo largo de este curso completo.", "sources": [{"label": "MSL Consultant (LinkedIn) — Medical Science Liaison (MSL) Interview Stages", "url": "https://www.linkedin.com/pulse/medical-science-liaison-msl-interview-stages-msl-consultant"}, {"label": "Jasmine Wynne (LinkedIn) — A step by step guide to the MSL interview process", "url": "https://www.linkedin.com/pulse/step-guide-msl-interview-process-jasmine-wynne"}, {"label": "The MSL Academy — Transitioning into the MSL Role Without Industry Experience", "url": "https://www.themslacademy.com/blog/from-bench-to-field-transitioning-into-the-msl-role-without-industry-experience"}]}, {"title": "Plan de desarrollo profesional", "text": "Un plan de desarrollo profesional es el mapa deliberado que un profesional de Medical Affairs construye para dirigir de forma activa su propio crecimiento de carrera, en lugar de dejar que la progresión profesional dependa exclusivamente de oportunidades que surgen por azar o de decisiones tomadas por otros. Cerrar este módulo, y este curso completo, con la construcción de un plan de desarrollo propio es la forma más directa de convertir todo el contenido trabajado en una hoja de ruta personal y accionable.\n\nEl primer paso de un plan de desarrollo profesional sólido es una autoevaluación honesta frente a las competencias trabajadas a lo largo de este módulo y del curso completo: dominio del intercambio científico y la escucha activa (Módulo 4), calidad y sistematización de la captura de insights (Módulo 5), solidez en el pensamiento crítico sobre evidencia (Módulo 6), contribución a la generación de evidencia (Módulo 7), excelencia en la ejecución de congresos (Módulo 8), comprensión de la planificación estratégica médica (Módulo 9), fluidez en el entorno digital y omnicanal (Módulo 10), uso responsable y productivo de herramientas de inteligencia artificial (Módulo 11), y las competencias de liderazgo trabajadas en este módulo final. Identificar con honestidad en qué áreas se tiene ya un dominio sólido y en cuáles existe una brecha real de desarrollo es la base de cualquier plan efectivo.\n\nEl segundo paso es la definición de objetivos de desarrollo específicos y con un horizonte temporal claro, siguiendo el mismo rigor de objetivos medibles trabajado al hablar de imperativos estratégicos en el Módulo 9: en lugar de un objetivo genérico como \"mejorar mis habilidades de liderazgo\", un objetivo bien formulado podría ser \"liderar el debrief post-congreso de mi equipo territorial en los próximos dos congresos, aplicando la estructura trabajada en el Módulo 8, y solicitar retroalimentación explícita de mi responsable sobre mi capacidad de síntesis ejecutiva\".\n\nEl tercer paso es identificar las vías concretas de desarrollo para cada objetivo: formación estructurada, mentoría de un profesional más senior dentro o fuera de la organización, participación activa en proyectos transfuncionales que permitan practicar la influencia sin autoridad trabajada en este módulo, o la búsqueda deliberada de oportunidades de mayor visibilidad (una presentación ejecutiva, la representación del equipo en un comité interno) que permitan demostrar competencias emergentes ante quienes toman decisiones de progresión de carrera.\n\nEl cuarto paso, y el que da continuidad real al plan, es la revisión periódica: reevaluar cada pocos meses el progreso frente a los objetivos definidos, ajustar el plan según lo aprendido, e incorporar nuevas prioridades de desarrollo a medida que la propia trayectoria profesional avanza y las necesidades de la organización evolucionan.\n\nUn plan de desarrollo profesional bien construido y mantenido de forma activa —no como un documento archivado, sino como una herramienta viva de dirección de la propia carrera— es lo que, en última instancia, transforma el conocimiento adquirido en este curso en una trayectoria profesional sostenida de crecimiento e impacto dentro de Medical Affairs.", "sources": [{"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "The MSL Academy — Transitioning into the MSL Role Without Industry Experience", "url": "https://www.themslacademy.com/blog/from-bench-to-field-transitioning-into-the-msl-role-without-industry-experience"}]}, {"title": "De MSL a Medical Lead", "text": "La trayectoria desde un rol de MSL hacia posiciones de mayor responsabilidad como Medical Advisor, Medical Manager o, con el tiempo, Medical Lead o Director Médico, no es un camino automático que ocurre simplemente por acumular años de experiencia: es una progresión que se construye de forma deliberada, aplicando de forma creciente y visible las competencias de liderazgo trabajadas a lo largo de este módulo, mientras se sigue ejecutando con excelencia el rol actual.\n\nUn patrón que la literatura del sector identifica de forma consistente en profesionales que progresan con éxito desde MSL hacia roles de mayor responsabilidad es la ampliación gradual del alcance de impacto: empezar por ser excelente en el propio territorio y las propias relaciones, y desde ahí buscar de forma proactiva oportunidades de contribuir más allá de esa responsabilidad individual —liderar una iniciativa de mejora de proceso para todo el equipo de campo, coordinar la preparación de un congreso estratégico para el equipo completo, o representar a Medical Affairs en un proyecto transfuncional relevante—. Estas oportunidades no siempre llegan de forma espontánea: con frecuencia hay que buscarlas y proponerlas activamente, comunicando con claridad el interés en asumir mayor responsabilidad.\n\nUn segundo patrón es la visibilidad estratégica ante quienes toman decisiones de progresión: no basta con hacer un trabajo excelente si ese trabajo permanece invisible para la dirección; comunicar los propios resultados y contribuciones de forma efectiva —aplicando los principios de comunicación ejecutiva y de narrativa de impacto trabajados en los Módulos 9 y en este mismo módulo— es lo que permite que el trabajo de calidad se traduzca en reconocimiento real y en consideración para nuevas oportunidades.\n\nUn tercer patrón es la búsqueda activa de mentoría y de modelos de referencia: identificar a profesionales que ya ocupan el tipo de rol al que se aspira, y buscar de forma proactiva su perspectiva sobre qué competencias y qué experiencias fueron más determinantes en su propia progresión, aporta un conocimiento práctico del camino a seguir que ningún curso teórico puede replicar por completo.\n\nUn cuarto patrón, y quizá el más importante para sostener una trayectoria de largo plazo, es mantener siempre el ancla en el propósito original de la función: la progresión de carrera dentro de Medical Affairs tiene más sentido, y es más sostenible emocionalmente, cuando se entiende no como una acumulación de títulos o de autoridad formal, sino como una ampliación progresiva de la capacidad de contribuir a mejores decisiones clínicas y, en última instancia, a mejores resultados de salud para los pacientes —el mismo propósito con el que se abrió este curso completo en su primer módulo, y que debería seguir orientando cada paso de la trayectoria profesional, desde la primera visita de campo hasta la dirección estratégica de una organización médica entera.\n\nEste curso ha recorrido, módulo a módulo, el conocimiento técnico, relacional, estratégico y digital que sostiene esa trayectoria. Aplicarlo con consistencia, honestidad científica y ambición profesional genuina es, a partir de ahora, responsabilidad de cada profesional que lo ha completado.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "THE MSL Journal — Servant Leadership in Medical Affairs: A Competitive Advantage", "url": "https://themsljournal.com/article/servant-leadership-in-medical-affairs-a-competitive-advantage/"}]}], "examples": ["Crear un elevator pitch profesional de 30 segundos que combine propuesta de valor científico, experiencia diferencial y dirección de carrera.", "Prepararse para una entrevista de MSL con ejemplos concretos y aplicados (un insight generado, una relación con un KOL recuperada, un gap de evidencia identificado) en lugar de descripciones genéricas.", "Diseñar un plan de carrera a 3 años con hitos de competencia, formación y experiencia para cada etapa de progresión.", "Escribir una publicación educativa en LinkedIn sobre un tema científico relevante, no promocional, que ofrezca una perspectiva profesional genuina."], "caseTitle": "Un plan de crecimiento de 12 meses de MSL a Medical Advisor/Manager", "caseText": "Eres un MSL con 2 años de experiencia que quiere avanzar hacia un rol de Medical Advisor o Medical Manager. El plan de crecimiento de 12 meses combina cuatro pilares: primero, cerrar los gaps de competencia identificados (por ejemplo, ganar más exposición al diseño de planes de generación de evidencia participando activamente en la construcción del próximo Plan Médico); segundo, ampliar la visibilidad interna presentando insights estratégicos a stakeholders senior; tercero, construir una marca personal externa a través de contenido de liderazgo de pensamiento conforme al compliance en LinkedIn sobre el área terapéutica; cuarto, buscar activamente mentoría de un Medical Manager o Medical Director actual, con revisiones trimestrales de progreso frente a hitos definidos. El plan se documenta con hitos concretos y medibles cada trimestre, no como una aspiración genérica.", "resources": {"framework": "Canvas de Crecimiento de Carrera: Rol actual → Rol objetivo → Gaps de competencia → Acciones de desarrollo → Hitos trimestrales → Mentor/sponsor.", "checklist": ["¿Tengo un plan de desarrollo documentado con hitos trimestrales?", "¿He identificado con precisión mis gaps de competencia frente al rol objetivo?", "¿Estoy construyendo visibilidad interna con ejemplos concretos de impacto?", "¿Tengo un mentor o sponsor activo dentro de la organización?", "¿Es mi marca personal externa coherente con mis objetivos de carrera y conforme al compliance?"], "prompt": "Actúa como un coach de carrera de Medical Affairs. Con mi rol actual [describir] y mi rol objetivo a 12 meses [describir], ayúdame a construir un plan de desarrollo con 4 gaps de competencia prioritarios y 3 acciones trimestrales concretas para cerrarlos.", "template": "Plan de Carrera de 12 Meses: Trimestre → Objetivo de desarrollo → Acción concreta → Evidencia de logro → Revisión del mentor.", "glossary": [{"term": "Influencia sin autoridad", "def": "La capacidad de lograr alineamiento y acción de otros sin una relación jerárquica directa."}, {"term": "Thought leadership", "def": "Posicionarse profesionalmente como una referencia de perspectiva y conocimiento en un campo."}, {"term": "Sponsor", "def": "Una persona senior que promueve activamente el desarrollo y la visibilidad de un profesional dentro de la organización."}, {"term": "Medical Lead", "def": "Un rol de liderazgo médico con responsabilidad estratégica y de equipo."}]}, "quiz": [{"q": "¿Qué caracteriza mejor la 'influencia sin autoridad', una competencia clave en Medical Affairs?", "options": ["Dar órdenes directas a otros departamentos", "Lograr alineamiento y acción de otros equipos sin una relación jerárquica directa, a través de la credibilidad científica y el valor aportado", "Evitar cualquier interacción con otros departamentos", "Depender siempre de la aprobación de un superior"], "correct": 1, "explain": "En estructuras matriciales, Medical Affairs debe influir a través de la credibilidad y el valor, no de la autoridad formal."}, {"q": "¿Qué elemento hace más eficaz una entrevista para un rol de MSL o Medical Advisor?", "options": ["Respuestas genéricas sobre motivación personal", "Ejemplos concretos y aplicados de impacto generado, como insights accionables o gaps de evidencia identificados", "Enfatizar solo el conocimiento teórico sin ejemplos", "Evitar hablar de casos reales por confidencialidad, sin ninguna adaptación"], "correct": 1, "explain": "Los ejemplos concretos y aplicados demuestran competencia real de forma mucho más persuasiva que las afirmaciones genéricas."}, {"q": "¿Qué es la 'comunicación ejecutiva' en el contexto del liderazgo médico?", "options": ["Hablar con el mayor detalle técnico posible en cualquier contexto", "Sintetizar información científica compleja en mensajes claros, priorizados y accionables para audiencias directivas con tiempo limitado", "Evitar comunicarse con la dirección para ahorrar tiempo", "Usar siempre presentaciones de más de 50 diapositivas"], "correct": 1, "explain": "La comunicación ejecutiva exige síntesis y priorización, adaptando la complejidad científica al contexto y al tiempo disponible del directivo."}, {"q": "¿Qué distingue la progresión 'de MSL a Medical Lead'?", "options": ["Solo un cambio de título sin nuevas responsabilidades", "Evolucionar de la excelencia individual en el terreno a la capacidad de liderar equipos, visión estratégica y gestión de stakeholders senior", "Ya no necesitar conocimiento científico", "Reducir por completo el contacto con los KOLs"], "correct": 1, "explain": "La progresión hacia roles de liderazgo exige desarrollar competencias de gestión de equipos y estrategia, más allá de la excelencia individual en el terreno."}, {"q": "¿Qué principio debe guiar el uso de LinkedIn para el liderazgo de pensamiento médico?", "options": ["Compartir cualquier contenido, incluidos mensajes promocionales del producto", "Compartir contenido educativo y una perspectiva profesional genuina, siempre dentro de los límites del compliance", "Usarlo exclusivamente para buscar un nuevo empleo", "Evitar cualquier actividad, ya que no aporta valor profesional"], "correct": 1, "explain": "El liderazgo de pensamiento médico en LinkedIn debe ser educativo, no promocional, y siempre conforme al compliance."}, {"q": "¿Qué papel juega un 'sponsor' en el desarrollo profesional dentro de Medical Affairs?", "options": ["Es lo mismo que un mentor, sin ninguna diferencia", "Una persona senior que promueve activamente la visibilidad y el desarrollo del profesional dentro de la organización", "Un rol puramente administrativo sin relación con el desarrollo de carrera", "Un requisito legal para cualquier ascenso"], "correct": 1, "explain": "Un sponsor aporta promoción activa y visibilidad, complementando el rol más orientado al consejo de un mentor."}, {"q": "¿Qué caracteriza un buen plan de desarrollo profesional en Medical Affairs?", "options": ["Ser una aspiración genérica sin plazos definidos", "Tener gaps de competencia identificados con precisión y un plan de acción concreto con hitos medibles", "No requerir ninguna revisión periódica una vez definido", "Centrarse únicamente en el salario objetivo"], "correct": 1, "explain": "Un plan de desarrollo eficaz es específico, medible y se revisa periódicamente frente a hitos concretos."}, {"q": "¿Qué es el 'pensamiento estratégico' aplicado al rol de un profesional de Medical Affairs?", "options": ["Centrarse exclusivamente en las tareas operativas del día a día sin una visión más amplia", "La capacidad de conectar las decisiones tácticas cotidianas con la estrategia médica y de negocio a largo plazo", "Delegar todas las decisiones estratégicas a otros departamentos", "Evitar cualquier participación en la definición del Plan Médico"], "correct": 1, "explain": "El pensamiento estratégico conecta la acción diaria con las implicaciones y prioridades a largo plazo de la organización."}, {"q": "¿Cuál es un elemento fundamental de una gestión eficaz de los stakeholders internos?", "options": ["Ignorar los intereses particulares de cada stakeholder", "Mapear los intereses, prioridades y estilo de comunicación de los stakeholders clave para construir alianzas efectivas", "Comunicarse con todos los stakeholders exactamente de la misma manera", "Evitar cualquier interacción hasta que sea estrictamente necesario"], "correct": 1, "explain": "La gestión eficaz de stakeholders exige entender y adaptarse a los intereses y al estilo de cada persona."}, {"q": "¿Qué papel juega la marca personal en la carrera de un profesional de Medical Affairs?", "options": ["Ninguna relevancia si el trabajo técnico es bueno", "Construye una reputación profesional consistente basada en el rigor científico y la fiabilidad, abriendo oportunidades internas y externas", "Solo importa para roles de marketing, no de Medical Affairs", "Se basa exclusivamente en el número de seguidores en redes sociales"], "correct": 1, "explain": "La marca personal en Medical Affairs se construye sobre credibilidad científica y fiabilidad demostradas, no sobre métricas de vanidad."}]}];

const AUTH_API = '/api/dmsl-auth.php';
const TOTAL_MODULES = COURSE_DATA.length;
const PASS_THRESHOLD = 70;
const EXCELLENT_THRESHOLD = 90;
const PROTECTED_VIEWS = ['dashboard','curriculum','module','certificate'];

function defaultState(){
  const modules = {};
  COURSE_DATA.forEach(m=>{
    modules[m.num] = { bestScore:null, attempts:0, lessonsViewed:new Array(m.lessons.length).fill(false), quizState:null };
  });
  return { modules, lastModule:null, studentName:'', xp:0 };
}

/* ===== Auth / account state ===== */
let CURRENT_USER = null;      // normalized email of the logged-in user, or null
let AUTH_MODE = 'login';      // 'login' | 'register' | 'verify'
let AUTH_ERROR = '';
let PENDING_EMAIL = null;     // email awaiting OTP verification
let PENDING_VIEW = 'dashboard'; // where to go once login/verification succeeds

let STATE = defaultState();
let VIEW = 'auth';
let CURRENT_MODULE = 1;
let CURRENT_TAB = 'overview';
let QUIZ_ANSWERS = {};
let QUIZ_SUBMITTED = false;
let QUIZ_SCORE = null;
let SIDEBAR_MOBILE_OPEN = false;
let AUTH_BUSY = false;

function normalizeEmail(email){ return String(email||'').trim().toLowerCase(); }
function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

/* Real backend calls — accounts, sessions and progress all live server-side
   now (api/dmsl-auth.php). The session is an HttpOnly cookie the browser
   manages automatically; credentials:'include' sends it on every call. */
async function apiCall(action, body){
  const res = await fetch(AUTH_API + '?action=' + action, {
    method: body === undefined ? 'GET' : 'POST',
    credentials: 'include',
    headers: body === undefined ? {} : {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data;
  try{ data = await res.json(); }catch(e){ data = {}; }
  if(!res.ok && data.ok === undefined) data.ok = false;
  if(!data.error && !res.ok) data.error = 'Algo salió mal. Por favor, inténtalo de nuevo.';
  return data;
}

function stateFromProgress(progress){
  const base = defaultState();
  if(progress && typeof progress === 'object'){
    Object.keys(base.modules).forEach(k=>{
      if(progress.modules && progress.modules[k]) base.modules[k] = Object.assign(base.modules[k], progress.modules[k]);
    });
    base.lastModule = progress.lastModule || null;
    base.studentName = progress.studentName || '';
    base.xp = progress.xp || 0;
  }
  return base;
}

let SAVE_STATE_TIMER = null;
function saveState(){
  if(!CURRENT_USER) return;
  // Debounced so rapid actions (ticking several lessons) don't fire a
  // request each — the server is the source of truth, this is just sync.
  clearTimeout(SAVE_STATE_TIMER);
  SAVE_STATE_TIMER = setTimeout(function(){
    apiCall('save-progress', {progress: STATE}).catch(function(){ /* retried on next save */ });
  }, 400);
}

/* ===== Auth actions ===== */
function requireAuth(view){
  if(CURRENT_USER){ goTo(view); return; }
  PENDING_VIEW = view;
  AUTH_MODE = 'login';
  AUTH_ERROR = '';
  goTo('auth');
}
function switchAuthMode(mode){
  AUTH_MODE = mode;
  AUTH_ERROR = '';
  render();
}
async function doRegister(){
  if(AUTH_BUSY) return;
  const nameEl = document.getElementById('regName');
  const emailEl = document.getElementById('regEmail');
  const passEl = document.getElementById('regPassword');
  const pass2El = document.getElementById('regPassword2');
  const name = nameEl ? nameEl.value : '';
  const email = normalizeEmail(emailEl ? emailEl.value : '');
  const pass = passEl ? passEl.value : '';
  const pass2 = pass2El ? pass2El.value : '';
  AUTH_ERROR = '';
  if(!name.trim()){ AUTH_ERROR='Por favor, introduce tu nombre completo.'; render(); return; }
  if(!isValidEmail(email)){ AUTH_ERROR='Por favor, introduce una dirección de email válida.'; render(); return; }
  if(pass.length<6){ AUTH_ERROR='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(pass!==pass2){ AUTH_ERROR='Las contraseñas no coinciden.'; render(); return; }
  AUTH_BUSY = true; render();
  try{
    const data = await apiCall('register', {name: name.trim(), email, password: pass});
    AUTH_BUSY = false;
    if(!data.ok){ AUTH_ERROR = data.error || 'Algo salió mal. Por favor, inténtalo de nuevo.'; render(); return; }
    PENDING_EMAIL = email;
    AUTH_MODE = 'verify';
    AUTH_ERROR = data.emailSent === false ? (data.warning || '') : '';
    render();
  }catch(e){
    AUTH_BUSY = false;
    AUTH_ERROR = 'No se pudo conectar con el servidor. Comprueba tu conexión e inténtalo de nuevo.';
    render();
  }
}
async function doLogin(){
  if(AUTH_BUSY) return;
  const emailEl = document.getElementById('loginEmail');
  const passEl = document.getElementById('loginPassword');
  const email = normalizeEmail(emailEl ? emailEl.value : '');
  const pass = passEl ? passEl.value : '';
  AUTH_ERROR = '';
  if(!isValidEmail(email)){ AUTH_ERROR='Por favor, introduce una dirección de email válida.'; render(); return; }
  AUTH_BUSY = true; render();
  try{
    const data = await apiCall('login', {email, password: pass});
    AUTH_BUSY = false;
    if(data.needsVerification){
      PENDING_EMAIL = email;
      AUTH_MODE = 'verify';
      AUTH_ERROR = data.error || 'Por favor, verifica tu email — acabamos de enviarte un nuevo código.';
      render();
      return;
    }
    if(!data.ok){ AUTH_ERROR = data.error || 'Email o contraseña incorrectos.'; render(); return; }
    CURRENT_USER = data.email;
    STATE = stateFromProgress(data.progress);
    if(STATE.lastModule) CURRENT_MODULE = STATE.lastModule;
    showToast('¡Bienvenido de nuevo!');
    goTo(PENDING_VIEW || 'dashboard');
  }catch(e){
    AUTH_BUSY = false;
    AUTH_ERROR = 'No se pudo conectar con el servidor. Comprueba tu conexión e inténtalo de nuevo.';
    render();
  }
}
async function doVerify(){
  if(AUTH_BUSY) return;
  const codeEl = document.getElementById('otpInput');
  const code = (codeEl ? codeEl.value : '').trim();
  AUTH_ERROR = '';
  if(!PENDING_EMAIL){ AUTH_ERROR='Algo salió mal. Por favor, regístrate de nuevo.'; AUTH_MODE='register'; render(); return; }
  AUTH_BUSY = true; render();
  try{
    const data = await apiCall('verify', {email: PENDING_EMAIL, code});
    AUTH_BUSY = false;
    if(!data.ok){ AUTH_ERROR = data.error || 'Código de verificación incorrecto.'; render(); return; }
    CURRENT_USER = data.email;
    STATE = stateFromProgress(data.progress);
    showToast('¡Cuenta verificada — bienvenido a la Academia!');
    goTo(PENDING_VIEW || 'dashboard');
  }catch(e){
    AUTH_BUSY = false;
    AUTH_ERROR = 'No se pudo conectar con el servidor. Comprueba tu conexión e inténtalo de nuevo.';
    render();
  }
}
async function resendCode(){
  if(AUTH_BUSY || !PENDING_EMAIL) return;
  AUTH_BUSY = true; render();
  try{
    await apiCall('resend', {email: PENDING_EMAIL});
    AUTH_BUSY = false;
    showToast('Se ha enviado un nuevo código de verificación a tu email.');
    render();
  }catch(e){
    AUTH_BUSY = false;
    showToast('No se pudo enviar el código — por favor, inténtalo de nuevo.');
    render();
  }
}
function logout(){
  apiCall('logout', {}).catch(function(){});
  CURRENT_USER = null;
  STATE = defaultState();
  CURRENT_MODULE = 1;
  VIEW = 'auth';
  AUTH_MODE = 'login';
  AUTH_ERROR = '';
  render();
}

/* ===== Derived metrics ===== */
function moduleStatus(num){
  const m = STATE.modules[num];
  if(!m || m.bestScore===null) return 'not_started';
  if(m.bestScore>=EXCELLENT_THRESHOLD) return 'excellent';
  if(m.bestScore>=PASS_THRESHOLD) return 'completed';
  return 'in_progress';
}
function isModuleCompleted(num){
  const s = STATE.modules[num];
  return s && s.bestScore!==null && s.bestScore>=PASS_THRESHOLD;
}
function completedModulesCount(){
  return COURSE_DATA.filter(m=>isModuleCompleted(m.num)).length;
}
function globalProgressPercent(){
  let sum=0;
  COURSE_DATA.forEach(m=>{
    const s = STATE.modules[m.num];
    sum += (s && s.bestScore!==null) ? Math.min(s.bestScore,100) : 0;
  });
  return Math.round(sum/TOTAL_MODULES);
}
function averageScore(){
  const attempted = COURSE_DATA.filter(m=>STATE.modules[m.num].bestScore!==null);
  if(attempted.length===0) return 0;
  const sum = attempted.reduce((a,m)=>a+STATE.modules[m.num].bestScore,0);
  return Math.round(sum/attempted.length);
}
function rankInfo(){
  const p = globalProgressPercent();
  if(p>=100) return {name:'Líder de Medical Affairs', min:100};
  if(p>=76) return {name:'MSL Estratégico', min:76};
  if(p>=51) return {name:'Socio Médico', min:51};
  if(p>=26) return {name:'Aprendiz de Campo', min:26};
  return {name:'Explorador', min:0};
}
function certificateUnlocked(){ return completedModulesCount()===TOTAL_MODULES; }
function statusLabel(s){
  return {not_started:'No iniciado', in_progress:'En progreso', completed:'Completado', excellent:'Puntuación excelente'}[s];
}

/* ===== XP toast ===== */
function showToast(msg){
  let t = document.getElementById('xpToast');
  if(!t){
    t = document.createElement('div');
    t.id='xpToast'; t.className='xp-toast';
    document.body.appendChild(t);
  }
  t.innerHTML = '<span class="gold">&#9733;</span><span>'+msg+'</span>';
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ===== Navigation ===== */
function goTo(view){
  VIEW = view;
  SIDEBAR_MOBILE_OPEN = false;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function openModule(num){
  CURRENT_MODULE = num;
  CURRENT_TAB = 'overview';
  STATE.lastModule = num;
  saveState();
  QUIZ_ANSWERS = {};
  QUIZ_SUBMITTED = false;
  QUIZ_SCORE = null;
  VIEW = 'module';
  SIDEBAR_MOBILE_OPEN = false;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function setTab(tab){
  CURRENT_TAB = tab;
  render();
}
function getModule(num){ return COURSE_DATA.find(m=>m.num===num); }
function toggleSidebarMobile(){ SIDEBAR_MOBILE_OPEN = !SIDEBAR_MOBILE_OPEN; render(); }

function toggleLesson(idx){
  const el = document.getElementById('lesson-'+idx);
  if(el){ el.classList.toggle('open'); }
  const m = STATE.modules[CURRENT_MODULE];
  if(m && !m.lessonsViewed[idx]){
    m.lessonsViewed[idx] = true;
    saveState();
    const dot = document.getElementById('lessoncheck-'+idx);
    if(dot){ dot.classList.add('done'); dot.innerHTML='&#10003;'; }
  }
}
function toggleLessonDone(event, idx){
  if(event){ event.stopPropagation(); }
  const m = STATE.modules[CURRENT_MODULE];
  if(!m) return;
  m.lessonsViewed[idx] = !m.lessonsViewed[idx];
  saveState();
  const dot = document.getElementById('lessoncheck-'+idx);
  if(dot){
    if(m.lessonsViewed[idx]){ dot.classList.add('done'); dot.innerHTML='&#10003;'; }
    else { dot.classList.remove('done'); dot.innerHTML=''; }
  }
}

/* ===== Quiz logic ===== */
function selectOption(qIdx, optIdx){
  if(QUIZ_SUBMITTED) return;
  QUIZ_ANSWERS[qIdx] = optIdx;
  render();
}
function submitQuiz(){
  const mod = getModule(CURRENT_MODULE);
  const total = mod.quiz.length;
  const answeredCount = Object.keys(QUIZ_ANSWERS).length;
  if(answeredCount < total){
    showToast('Por favor, responde las '+total+' preguntas antes de enviar.');
    return;
  }
  let correct=0;
  mod.quiz.forEach((q,i)=>{ if(QUIZ_ANSWERS[i]===q.correct) correct++; });
  const score = Math.round((correct/total)*100);
  QUIZ_SUBMITTED = true;
  QUIZ_SCORE = score;
  const s = STATE.modules[mod.num];
  s.attempts += 1;
  const prevBest = s.bestScore;
  const passed = score>=PASS_THRESHOLD;
  if(s.bestScore===null || score>s.bestScore){ s.bestScore = score; }
  if(passed && (prevBest===null || prevBest<PASS_THRESHOLD)){
    STATE.xp += 100;
    showToast('+100 XP &mdash; ¡Módulo '+mod.num+' completado!');
  } else if(score>EXCELLENT_THRESHOLD-1 && (prevBest===null || prevBest<EXCELLENT_THRESHOLD)){
    STATE.xp += 50;
    showToast('+50 XP &mdash; ¡Insignia de puntuación excelente desbloqueada!');
  } else {
    STATE.xp += 10;
  }
  saveState();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function retakeQuiz(){
  QUIZ_ANSWERS = {};
  QUIZ_SUBMITTED = false;
  QUIZ_SCORE = null;
  render();
}

function resetProgress(){
  if(!confirm('Esto borrará permanentemente todo tu progreso en el curso. ¿Continuar?')) return;
  STATE = defaultState();
  saveState();
  CURRENT_MODULE = 1;
  VIEW = 'dashboard';
  render();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadCertificate(){
  if(!STATE.studentName || STATE.studentName.trim().length<2){
    showToast('Por favor, introduce primero tu nombre completo.');
    return;
  }
  const html = certificateHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Certificado_Digital_Medical_Science_Liaison.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Certificado descargado correctamente.');
}

/* ===== Copy prompt (AI Prompt Template blocks) ===== */
function copyPrompt(btn, text){
  const finish = ()=>{
    const original = btn.getAttribute('data-label') || 'Copiar';
    btn.textContent = 'Copiado';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(finish);
  } else {
    finish();
  }
}

    ['lessons','Lecciones'],
    ['cases','Casos Prácticos'],
    ['quiz','Examen'],
    ['resources','Recursos']
  ];
  return `
  <div class="module-header">
    <div>
      <div class="mod-index">MÓDULO ${m.num} / ${TOTAL_MODULES}</div>
      <h2>${m.title}</h2>
      <p class="objective">${m.objective}</p>
    </div>
    <div style="text-align:right;">
      <span class="badge badge-${status}">${statusLabel(status)}</span>
      ${s.bestScore!==null?`<div class="mod-score" style="margin-top:8px;">Mejor puntuación: ${s.bestScore}%</div>`:''}
    </div>
  </div>
  <div class="tabs">
    ${tabs.map(t=>`<button class="tab-btn ${CURRENT_TAB===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}
  </div>
  <div class="tab-panel active">
    ${CURRENT_TAB==='overview'?renderOverviewTab(m):''}
    ${CURRENT_TAB==='lessons'?renderLessonsTab(m):''}
    ${CURRENT_TAB==='cases'?renderCasesTab(m):''}
    ${CURRENT_TAB==='quiz'?renderQuizTab(m):''}
    ${CURRENT_TAB==='resources'?renderResourcesTab(m):''}
  </div>
  <div style="margin-top:34px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <button class="btn btn-outline" ${m.num<=1?'disabled':''} onclick="openModule(${m.num-1})">&larr; Módulo Anterior</button>
    <button class="btn btn-outline" ${m.num>=TOTAL_MODULES?'disabled':''} onclick="openModule(${m.num+1})">Siguiente Módulo &rarr;</button>
  </div>
  `;
}

function renderOverviewTab(m){
  const viewedCount = STATE.modules[m.num].lessonsViewed.filter(Boolean).length;
  return `
  <div class="grid grid-2">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px;">Objetivo del Módulo</h3>
      <p style="font-size:13.5px;color:var(--muted);">${m.objective}</p>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px;">Tu Progreso en este Módulo</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:8px;">${viewedCount}/${m.lessons.length} lecciones abiertas &middot; ${STATE.modules[m.num].attempts} intento(s) de examen</p>
      <div class="progressbar"><div style="width:${Math.round((viewedCount/m.lessons.length)*100)}%"></div></div>
    </div>
  </div>
  <div class="block">
    <h3 style="font-size:15px;margin-bottom:14px;">Lo que dominarás</h3>
    <div class="grid grid-2">
      ${m.lessons.slice(0,8).map(l=>`<div class="example-item"><div class="dot"></div><p><strong style="color:var(--fg);">${l.title}.</strong></p></div>`).join('')}
    </div>
  </div>
  <div class="block" style="text-align:center;">
    <button class="btn btn-primary" onclick="setTab('lessons')">Empezar Lecciones &rarr;</button>
  </div>
  `;
}

function renderLessonsTab(m){
  return `
  <div>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Haz clic en una lección para leerla, o en el círculo para marcarla como completada &mdash; vuelve a hacer clic en el círculo para deshacerlo.</p>
    ${m.lessons.map((l,idx)=>{
      const done = STATE.modules[m.num].lessonsViewed[idx];
      return `<div class="lesson-item" id="lesson-${idx}">
        <div class="lesson-head" onclick="toggleLesson(${idx})">
          <div class="lesson-head-left">
            <div class="lesson-check ${done?'done':''}" id="lessoncheck-${idx}" title="Marcar como completada / no completada" onclick="toggleLessonDone(event, ${idx})">${done?'&#10003;':''}</div>
            <div><div class="lesson-num">LECCIÓN ${idx+1}</div><div class="lesson-title">${l.title}</div></div>
          </div>
          <div class="chevron">&#9660;</div>
        </div>
        <div class="lesson-body"><div class="lesson-body-inner">${renderLessonText(l.text)}${renderLessonSources(l.sources)}</div></div>
      </div>`;
    }).join('')}
  </div>
  `;
}

function renderLessonText(text){
  return String(text||'').split(/\n\n+/).map(p=>`<p>${p}</p>`).join('');
}

function renderLessonSources(sources){
  if(!sources || !sources.length) return '';
  return `<div class="lesson-sources">
    <h5>Lecturas Adicionales y Fuentes</h5>
    <ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a></li>`).join('')}</ol>
  </div>`;
}

function renderCasesTab(m){
  return `
  <h3 style="font-size:15px;margin-bottom:14px;">Ejemplos Prácticos</h3>
  ${m.examples.map(e=>`<div class="example-item"><div class="dot"></div><p>${e}</p></div>`).join('')}
  <div class="case-box">
    <div class="case-label">Caso Práctico Aplicado</div>
    <h4>${m.caseTitle}</h4>
    <p>${m.caseText}</p>
  </div>
  `;
}

function renderQuizTab(m){
  const s = STATE.modules[m.num];
  if(QUIZ_SUBMITTED){
    return renderQuizResult(m);
  }
  const answeredCount = Object.keys(QUIZ_ANSWERS).length;
  return `
  <div class="quiz-intro">
    <div>
      <h3 style="font-size:16px;">Examen del Módulo ${m.num} &mdash; 10 Preguntas</h3>
      <p style="font-size:13px;color:var(--muted);margin-top:4px;">Nota de aprobado: ${PASS_THRESHOLD}%. Respondidas: ${answeredCount}/10.</p>
    </div>
    <div class="best">Mejor puntuación hasta ahora<br><b>${s.bestScore!==null? s.bestScore+'%' : '&mdash;'}</b></div>
  </div>
  <div class="block">
    ${m.quiz.map((q,i)=>renderQuizQuestion(q,i,false)).join('')}
  </div>
  <div class="quiz-actions">
    <span style="font-size:12.5px;color:var(--muted);">Puedes repetir este examen tantas veces como necesites. Tu mejor puntuación siempre se guarda.</span>
    <button class="btn btn-primary" onclick="submitQuiz()">Enviar Examen</button>
  </div>
  `;
}

function renderQuizQuestion(q, i, answered){
  const selected = QUIZ_ANSWERS[i];
  const letters = ['A','B','C','D'];
  return `
  <div class="quiz-q ${QUIZ_SUBMITTED?'answered':''}">
    <div class="qnum">PREGUNTA ${i+1} / 10</div>
    <div class="qtext">${q.q}</div>
    ${q.options.map((opt,oi)=>{
      let cls='option';
      if(QUIZ_SUBMITTED){
        if(oi===q.correct) cls+=' correct';
        else if(oi===selected) cls+=' incorrect';
      } else if(selected===oi){ cls+=' selected'; }
      return `<div class="${cls}" onclick="selectOption(${i},${oi})">
        <div class="letter">${letters[oi]}</div><div>${opt}</div>
      </div>`;
    }).join('')}
    ${QUIZ_SUBMITTED? `<div class="feedback-box ${selected===q.correct?'ok':'ko'}">
      <strong>${selected===q.correct?'Correcto. ':'Incorrecto. '}</strong>${q.explain}
    </div>` : ''}
  </div>`;
}

function renderQuizResult(m){
  const score = QUIZ_SCORE;
  const passed = score>=PASS_THRESHOLD;
  const excellent = score>=EXCELLENT_THRESHOLD;
  let msg = '';
  if(excellent) msg = 'Rendimiento excepcional. Demuestras un dominio de nivel senior del contenido de este módulo.';
  else if(passed) msg = 'Bien hecho. Has alcanzado el nivel de dominio requerido para este módulo.';
  else msg = 'Todavía no aprobado. Repasa las lecciones y repite el examen &mdash; necesitas un '+PASS_THRESHOLD+'% para completar este módulo.';
  return `
  <div class="quiz-result">
    <div class="score">${score}%</div>
    <div class="msg">${msg}</div>
    ${passed? `<div class="pass">&#10003; Módulo ${excellent?'Completado con Excelencia':'Completado'}</div>` : ''}
  </div>
  <div class="block">
    ${m.quiz.map((q,i)=>renderQuizQuestion(q,i,true)).join('')}
  </div>
  <div class="quiz-actions">
    <button class="btn btn-outline" onclick="retakeQuiz()">Repetir Examen</button>
    ${passed? `<button class="btn btn-primary" onclick="openModule(${Math.min(m.num+1,TOTAL_MODULES)})">${m.num<TOTAL_MODULES? 'Continuar al Siguiente Módulo &rarr;' : 'Ir al Certificado &rarr;'}</button>` : ''}
  </div>
  `;
}

function renderResourcesTab(m){
  const r = m.resources;
  const promptEscaped = escapeHtml(r.prompt).replace(/`/g,'&#96;');
  return `
  <div class="grid grid-2">
    <div class="res-card">
      <h4>&#128218; Marco Central</h4>
      <p>${r.framework}</p>
    </div>
    <div class="res-card">
      <h4>&#9989; Checklist Práctica</h4>
      <ul>${r.checklist.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
    <div class="res-card" style="grid-column:1/-1;">
      <h4>&#129302; Plantilla de Prompt de IA</h4>
      <div class="promptwrap">
        <div class="prompttop">
          <span class="plabel">Prompt de IA</span>
          <button class="copybtn" data-label="Copiar" onclick="copyPrompt(this, this.closest('.promptwrap').querySelector('.prompt').textContent)">Copiar</button>
        </div>
        <pre class="prompt">${promptEscaped}</pre>
      </div>
    </div>
    <div class="res-card" style="grid-column:1/-1;">
      <h4>&#128203; Plantilla de Trabajo</h4>
      <p>${r.template}</p>
    </div>
  </div>
  <div class="res-card block">
    <h4>&#128213; Mini-Glosario</h4>
    ${r.glossary.map(g=>`<div class="glossary-term"><b>${g.term}</b><span>${g.def}</span></div>`).join('')}
  </div>
  `;
}
</script>
<script>
function renderCertificatePage(){
  const done = completedModulesCount();
  const unlocked = certificateUnlocked();
  if(!unlocked){
    return `
    <div class="section-title">Certificado de Finalización</div>
    <div class="section-sub">Completa los 12 módulos con al menos un ${PASS_THRESHOLD}% para desbloquear tu certificado.</div>
    <div class="cert-locked">
      <div class="lock-icon">&#128274;</div>
      <h3 style="font-size:18px;margin-bottom:8px;">Certificado Bloqueado</h3>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Has completado ${done}/${TOTAL_MODULES} módulos. Termina los módulos restantes para desbloquear tu certificado.</p>
      <div class="progressbar" style="max-width:360px;margin:0 auto 20px;"><div style="width:${Math.round((done/TOTAL_MODULES)*100)}%"></div></div>
      <button class="btn btn-primary" onclick="goTo('curriculum')">Ir al Plan de Estudios</button>
    </div>`;
  }
  const score = averageScore();
  const date = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  return `
  <div class="section-title">Certificado de Finalización</div>
  <div class="cert-unlocked-banner">
    <h3>&#127881; Certificado Desbloqueado</h3>
    <p style="color:rgba(255,255,255,.85);font-size:14px;margin-top:6px;">Enhorabuena &mdash; has completado los ${TOTAL_MODULES} módulos del Curso Online Digital Medical Science Liaison.</p>
  </div>
  <div class="cert-form">
    <label>Nombre completo (tal como debe aparecer en el certificado)</label>
    <input type="text" placeholder="p. ej. Dra. Ana García" value="${escapeHtml(STATE.studentName||'')}" oninput="updateStudentName(this.value)">
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="generateCertificate()">Vista Previa del Certificado</button>
      <button class="btn btn-gold" onclick="downloadCertificate()">Descargar Certificado</button>
    </div>
  </div>
  <div class="cert-preview" id="certPreview">
    <img src="${LOGO_ON_LIGHT}" alt="Digital MSL" style="width:64px;height:64px;margin-bottom:12px;">
    <div class="cert-eyebrow">Certificado de Finalización</div>
    <h2>Curso Online Digital Medical Science Liaison</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:14px;">Se certifica que</p>
    <div class="cert-name">${escapeHtml(STATE.studentName || 'Tu Nombre Aquí')}</div>
    <p class="cert-course">ha completado con éxito el curso online avanzado <strong>Curso Online Digital Medical Science Liaison &mdash; Curso Avanzado para la Excelencia en MSL y Medical Affairs</strong></p>
    <div class="cert-meta">
      <div><div class="num">12/12</div><div class="label">Módulos Completados</div></div>
      <div><div class="num">${score}%</div><div class="label">Puntuación Media Final</div></div>
      <div><div class="num">${date}</div><div class="label">Fecha</div></div>
    </div>
    <div class="cert-sign">Emitido por<br><strong style="color:var(--primary);font-style:normal;">Curso Online Digital Medical Science Liaison</strong></div>
  </div>
  `;
}
</script>

<script>
/* ===== Boot ===== */
(function init(){
  // The marketing pitch lives on /dmsl-course-es.html now — arriving here
  // goes straight to log in / create account, not a duplicate landing.
  VIEW = 'auth';
  AUTH_MODE = 'login';
  render();
  // Real session check — an HttpOnly cookie, not localStorage. Runs after
  // the first paint so the page isn't blocked on a network round-trip.
  apiCall('me').then(function(data){
    if(data && data.ok && data.authenticated){
      CURRENT_USER = data.email;
      STATE = stateFromProgress(data.progress);
      if(STATE.lastModule){ CURRENT_MODULE = STATE.lastModule; }
      render();
    }
  }).catch(function(){ /* not logged in / offline — stay on hero */ });
})();
</script>
</body>
</html>
