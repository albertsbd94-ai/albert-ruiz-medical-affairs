stimate, often associated with a larger sample size."}, {"q": "In the hierarchy of evidence, which design typically offers the strongest causal evidence?", "options": ["Case series", "Expert opinion", "Randomized controlled trial", "Case-control study"], "correct": 2, "explain": "The randomized controlled trial minimizes confounding bias by randomly assigning the intervention, making it stronger for establishing causality."}, {"q": "What does Number Needed to Treat (NNT) represent?", "options": ["The number of patients excluded from the study", "The number of patients who need to be treated to achieve one additional beneficial outcome versus the comparator", "The number of years of follow-up in the study", "The number of participating centers in the trial"], "correct": 1, "explain": "NNT translates the relative effect into a practical magnitude: how many patients need to be treated for one additional benefit."}, {"q": "What is the main limitation of observational studies compared to randomized controlled trials?", "options": ["They are always more expensive to conduct", "Greater risk of confounding factors, since the intervention is not randomly assigned", "They cannot include more than 100 patients", "They cannot be published in scientific journals"], "correct": 1, "explain": "Without randomizing the intervention, observational studies are more susceptible to uncontrolled confounding variables."}, {"q": "What does a hazard ratio of 0.70 measure in a survival study?", "options": ["That treatment reduces the event's occurrence rate by 70% versus the comparator, at every moment", "That the rate of event occurrence in the treated group is, on average, 30% lower than in the comparator group over the follow-up period", "That 70% of patients were cured", "That there was a 70% dropout rate in the study"], "correct": 1, "explain": "An HR of 0.70 indicates the event rate in the treated group is 30% lower relative to the comparator, not an absolute reduction in case count."}, {"q": "Why is it relevant to distinguish the primary endpoint from secondary endpoints when interpreting a study?", "options": ["It has no practical relevance at all", "Because the study is designed and statistically powered mainly to answer the primary endpoint; secondary ones are exploratory and shouldn't be used for definitive conclusions", "Because secondary endpoints are always more important", "Because primary endpoints are never published"], "correct": 1, "explain": "The study's statistical power is calculated around the primary endpoint; secondary endpoints are hypothesis-generating, not confirmatory."}, {"q": "In a meta-analysis forest plot, what does it mean when an individual study's line crosses the 'no effect' vertical line?", "options": ["That the study is invalid", "That, on its own, that individual study did not reach statistical significance for the effect evaluated", "That the study has a typographical error", "That the study must be removed from the meta-analysis"], "correct": 1, "explain": "When the confidence interval crosses the no-effect value (1 for RR/OR/HR, 0 for differences), the individual result is not statistically significant."}, {"q": "What is Real-World Evidence (RWE) and what does it add compared to clinical trials?", "options": ["It's the same as a clinical trial under a different name", "Evidence generated under real clinical practice conditions, providing information on effectiveness and broader populations than the strict criteria of trials", "It's evidence obtained exclusively from social media", "It has no scientific value at all"], "correct": 1, "explain": "RWE complements the efficacy shown in controlled trials with effectiveness data from everyday clinical practice."}, {"q": "Which of these is a relevant bias to consider when evaluating a body of evidence?", "options": ["Publication bias, where studies with positive results are more likely to be published than negative ones", "Font-size bias in the article", "Bias from the journal cover color", "Bias from the number of authors on the study"], "correct": 0, "explain": "Publication bias can distort the overall perception of available evidence on an intervention."}]}, {"num": 7, "title": "Clinical Research, RWE & Evidence Generation", "objective": "Understand how Medical Affairs actively contributes to scientific evidence generation beyond regulatory clinical development.", "lessons": [{"title": "Phases of clinical research", "text": "Phase I (safety/dose), Phase II (preliminary efficacy), Phase III (confirmatory, pivotal for registration), Phase IV (post-marketing, where Medical Affairs plays its greatest role)."}, {"title": "IIS", "text": "Investigator-Initiated Study: a study designed and led by an external investigator, with support (financial and/or product) from the company, but with scientific and methodological independence from the investigator."}, {"title": "Observational studies", "text": "Designs with no sponsor-assigned intervention, useful for exploring effectiveness, usage patterns and disease evolution in real-world practice."}, {"title": "Registries", "text": "Structured databases of patients with a specific condition or treatment, followed longitudinally, useful for generating long-term evidence in large populations."}, {"title": "Real-world evidence", "text": "Evidence derived from real-world data sources (medical records, registries, administrative databases) that complements controlled clinical trials."}, {"title": "Evidence gaps", "text": "Relevant clinical questions with no solid answer in the available evidence, identified systematically from field insights and literature review."}, {"title": "Evidence generation plan", "text": "A strategic document that prioritizes which evidence gaps will be addressed, with what type of study, on what timeline and with what resources, aligned with the Medical Plan."}, {"title": "The MSL's role in research", "text": "Identifying potential investigators, assessing the strategic fit and methodological quality of IIS proposals, and facilitating (without directing) the process while preserving the investigator's independence."}, {"title": "Collaborating with investigators", "text": "A scientific partnership grounded in respect for methodological independence, transparency about the support provided, and strict compliance with value-transfer regulations."}, {"title": "Good scientific and ethical practice", "text": "A strict separation between the scientific evaluation of an IIS and any commercial consideration; transparent documentation; avoiding any conditioning of support on prescribing behavior."}], "examples": ["Identify an evidence gap: absence of effectiveness data for a treatment in patients with multiple comorbidities, detected through recurring field insights.", "Propose a well-formulated research question using the PICO framework (Population, Intervention, Comparator, Outcome).", "Assess whether a study idea is viable: scientific relevance, fit with prioritized evidence gaps, methodological feasibility, and absence of conflict with ongoing studies.", "Differentiate an IIS (led independently by the investigator, with company support) from a sponsored study (designed and controlled by the company)."], "caseTitle": "Evaluating an IIS proposal on vaccine effectiveness in adults over 75", "caseText": "An investigator proposes a study on vaccine effectiveness in adults over 75. The correct evaluation separates three dimensions: first, scientific quality of the idea (clear research question, methodologically sound design, recruitment feasibility); second, strategic fit (does it address a prioritized evidence gap in the Medical Plan? does it add value beyond what is already known?); third, process compliance (evaluation by an independent IIS committee, no link to commercial decisions, transparent and documented value transfer). Only if all three dimensions are positive should the study be recommended to proceed, always preserving the investigator's methodological independence.", "resources": {"framework": "Evidence Generation Priority Matrix: Clinical relevance of the gap x Study feasibility, to prioritize evidence-generation initiatives.", "checklist": ["Is the evidence gap documented with field insights or a literature review?", "Does the study proposal use a clear PICO framework?", "Has the investigator's methodological independence been assessed?", "Is the support disconnected from any commercial objective?", "Is there an independent committee evaluation process?"], "prompt": "Act as an Evidence Generation Director. Evaluate this study proposal [paste summary] across three dimensions: scientific quality, strategic fit with priority evidence gaps, and methodological feasibility. Provide a structured recommendation.", "template": "Evidence Gap Log: Identified gap → Source (insight/literature) → Clinical relevance → Recommended study type → Priority → Status.", "glossary": [{"term": "IIS", "def": "Investigator-Initiated Study, a study independently led by an external investigator."}, {"term": "Registry", "def": "A longitudinal database of patients with a specific condition or treatment."}, {"term": "Evidence generation plan", "def": "A strategic plan prioritizing what evidence to generate, how and when."}, {"term": "PICO", "def": "A framework for formulating research questions: Population, Intervention, Comparator, Outcome."}]}, "quiz": [{"q": "What is the essential feature that distinguishes an IIS from a company-sponsored study?", "options": ["An IIS never receives company funding", "An IIS is designed and led with scientific and methodological independence by the external investigator, even if it receives company support", "An IIS can only take place in Phase III", "An IIS does not require ethical approval"], "correct": 1, "explain": "The investigator's methodological independence is the key element that distinguishes an IIS from a sponsored study."}, {"q": "An investigator proposes a study that addresses no prioritized evidence gap and adds no relevant new knowledge. What is the most appropriate recommendation?", "options": ["Approve it automatically because the investigator is an important KOL", "Do not recommend it proceed, transparently explaining the scientific and strategic evaluation criteria used", "Approve it on condition the investigator increases their prescribing", "Ignore the proposal without responding"], "correct": 1, "explain": "The evaluation must be based on objective scientific and strategic criteria, communicated transparently to the investigator."}, {"q": "What role should the MSL play in evaluating an IIS?", "options": ["Design the study on the investigator's behalf", "Identify potential investigators and assess strategic and methodological fit, without directing or conditioning the investigator's independence", "Unilaterally decide on the study's approval", "Negotiate commercial discounts in exchange for the proposal"], "correct": 1, "explain": "The MSL facilitates the process while preserving the investigator's independence; formal decisions go through independent committees."}, {"q": "What is an 'evidence gap'?", "options": ["An error in the CRM database", "A relevant clinical question with no solid answer in the available scientific evidence", "The price difference between two treatments", "A recruitment failure in a clinical trial"], "correct": 1, "explain": "An evidence gap identifies relevant gaps in scientific knowledge for clinical practice."}, {"q": "What is a fundamental ethical good practice in relationships with external investigators?", "options": ["Conditioning study support on the investigator's prescription volume", "Keeping the study's scientific evaluation completely separate from any commercial consideration, with transparency in value transfer", "Always choosing the investigator who prescribes the most, with no scientific evaluation", "Avoiding documentation of the support provided to simplify the process"], "correct": 1, "explain": "Separating scientific evaluation from commercial considerations is a fundamental ethical pillar in relationships with investigators."}, {"q": "What do patient registries contribute to evidence generation?", "options": ["They are only useful for internal administrative purposes", "Longitudinal data on patients with a specific condition or treatment, useful for long-term evidence in large populations", "They completely replace Phase III clinical trials", "They are only useful in rare diseases"], "correct": 1, "explain": "Registries provide longitudinal follow-up in large, real populations, complementing other types of evidence."}, {"q": "What is the main purpose of an Evidence Generation Plan?", "options": ["Listing every study published in the literature", "Prioritizing which evidence gaps will be addressed, with what type of study, timeline and resources, aligned with the Medical Plan", "Replacing the product's marketing plan", "Setting the reimbursement price of the product"], "correct": 1, "explain": "The Evidence Generation Plan is the strategic roadmap for closing prioritized evidence gaps."}, {"q": "In the PICO framework for formulating a research question, what does the 'O' represent?", "options": ["Sponsoring organization", "Outcome, the result or endpoint of interest to measure", "Commercial objective of the study", "Responsible regulatory office"], "correct": 1, "explain": "PICO: Population, Intervention, Comparator, Outcome (the result of interest)."}, {"q": "What is the main difference between an observational study and a patient registry?", "options": ["There is no difference, they are synonyms", "An observational study usually has a research objective bounded in time; a registry is a continuous, longitudinal data infrastructure", "Registries never include safety data", "Observational studies are always randomized"], "correct": 1, "explain": "A registry is a continuous data-collection infrastructure, while an observational study usually has a defined design and time period."}, {"q": "Why is it important for Medical Affairs to identify evidence gaps from field insights and not only from the literature?", "options": ["Because the literature is never reliable", "Because field insights capture real needs and barriers of clinical practice that may not yet be reflected in publications", "Because field insights are cheaper to obtain", "Because scientific literature is forbidden in Medical Affairs"], "correct": 1, "explain": "Field insights provide a real-practice perspective that complements, and sometimes anticipates, what published literature reflects."}]}, {"num": 8, "title": "Congress Excellence", "objective": "Learn to prepare, execute and capitalize on scientific congresses from a Medical Affairs perspective, maximizing the scientific value obtained.", "lessons": [{"title": "Medical objectives of a congress", "text": "Define in advance what is being sought: updating the scientific landscape, strengthening relationships with priority KOLs, capturing insights, or identifying evidence-generation opportunities."}, {"title": "Pre-congress preparation", "text": "Review the scientific agenda, prioritize relevant sessions and posters, schedule meetings with priority KOLs, and prepare specific questions for each one."}, {"title": "KOL meetings", "text": "Structured meetings with a clear objective, prepared questions and protected time; they should be planned in advance, not improvised in a hallway."}, {"title": "Session tracking", "text": "A structured system for capturing the data and key messages presented in relevant sessions, distinguishing facts from personal interpretation."}, {"title": "Poster walks", "text": "A systematic, prioritized walkthrough of posters relevant to the therapeutic area, capturing key data and, when possible, a brief conversation with the author."}, {"title": "Ethical competitor intelligence", "text": "Gathering publicly presented information about competitors at the congress, with no inappropriate collection method or misuse of confidential information."}, {"title": "Insight capture", "text": "Applying the same documentation rigor for insights (observation-interpretation-implication) throughout all congress interactions."}, {"title": "Internal debrief", "text": "A structured post-congress session with the team to consolidate learnings, insights and relevant data before the context is lost."}, {"title": "Executive report", "text": "A brief, high-value document for leadership containing the most relevant findings and recommendations from the congress, not an exhaustive summary of everything seen."}, {"title": "Post-congress follow-up", "text": "Executing the commitments made with KOLs and feeding the identified insights and evidence gaps into the Medical Plan and the evidence generation plan."}], "examples": ["Build a congress agenda with blocks for: priority plenary sessions, scheduled poster walks, KOL meetings, and documentation time.", "Prioritize sessions based on relevance to the therapeutic area and the presence of data that could close identified evidence gaps.", "Prepare questions for KOL meetings aligned with each KOL's engagement plan, avoiding generic questions.", "Write a one-page executive report: 3 key findings, 2 strategic insights, 1 prioritized action recommendation."], "caseTitle": "Congress plan around new COVID, flu and RSV data", "caseText": "You attend a national congress presenting new data on COVID, flu and RSV. In the pre-congress plan, sessions with comparative co-administration data are prioritized, and meetings are scheduled with 5 key KOLs in adult immunization. During the congress, structured session tracking is carried out in the prioritized sessions, and poster walks are done in the respiratory disease area, capturing insights on perceived combined disease burden. In the post-congress plan, an internal debrief is held within the following 48 hours, a one-page executive report is written with the 3 most relevant findings, and the evidence gaps identified (co-administration effectiveness in adults over 75) are fed into next year's evidence generation plan.", "resources": {"framework": "Congress Excellence Cycle: Pre (objectives and agenda) → During (tracking and insights) → Post (debrief, report and follow-up).", "checklist": ["Did I define clear medical objectives before the congress?", "Did I prioritize sessions and KOLs by strategic impact?", "Did I document insights with the same rigor as in the field?", "Did I hold the internal debrief within 48-72 hours?", "Did I feed the identified evidence gaps into the Medical Plan?"], "prompt": "Act as a Medical Affairs Lead. Using this preliminary congress agenda [paste agenda] and these medical objectives [paste objectives], help me prioritize the 8 highest strategic-value sessions and 3 KOL meetings.", "template": "Congress Executive Report (1 page): Congress objective → 3 key findings → 2 strategic insights → Evidence gaps detected → Prioritized action recommendation.", "glossary": [{"term": "Session tracking", "def": "Structured capture of data and key messages from scientific sessions."}, {"term": "Poster walk", "def": "A systematic walkthrough of relevant posters at a congress."}, {"term": "Debrief", "def": "A structured session to consolidate learnings after an event."}, {"term": "Ethical competitor intelligence", "def": "Gathering public information about competitors while respecting ethical and compliance boundaries."}]}, "quiz": [{"q": "What is the correct first step in preparing for a congress from Medical Affairs?", "options": ["Book the hotel closest to the venue", "Define clear medical objectives for the congress before reviewing the scientific agenda", "Wait until arriving at the congress to decide which sessions to attend", "Delegate all planning to the commercial team"], "correct": 1, "explain": "Without clear medical objectives, prioritizing sessions and meetings lacks strategic criteria."}, {"q": "What characterizes a well-planned KOL meeting at a congress?", "options": ["Being an improvised hallway conversation", "Having a clear objective, prepared questions and protected time, planned in advance", "Requiring no prior preparation at all", "Being limited to handing out promotional material"], "correct": 1, "explain": "The highest-value meetings are planned with an objective and specific questions, not improvised."}, {"q": "What is correct regarding 'competitor intelligence' at a congress?", "options": ["Using any means to obtain confidential competitor information", "Gathering only publicly presented information, with no inappropriate collection methods", "Asking an HCP to share confidential competitor data", "Paying no attention at all to competitor data"], "correct": 1, "explain": "Ethical competitive intelligence is limited to public information, respecting compliance at all times."}, {"q": "When should the internal debrief after a congress take place?", "options": ["A month later, when there's time available", "Within the following 48-72 hours, to consolidate learnings before the context is lost", "It's never necessary if notes were taken during the congress", "Only if the congress was international"], "correct": 1, "explain": "An early debrief prevents the loss of nuance and context that fades over time."}, {"q": "What should be prioritized in a post-congress executive report?", "options": ["An exhaustive summary of absolutely every session attended", "The most relevant findings and insights with action recommendations, in a brief, high-value format", "Only the names of the KOLs spoken to", "Photos from the congress social event"], "correct": 1, "explain": "The value of the executive report lies in strategic synthesis, not descriptive exhaustiveness."}, {"q": "During a poster walk, what is the most valuable practice besides reading the poster?", "options": ["Photographing every poster without reading them", "When possible, having a brief conversation with the author to explore nuances not shown on the poster", "Avoiding any interaction with authors", "Dismissing posters from unfamiliar investigators"], "correct": 1, "explain": "A direct conversation with the author can reveal nuances, limitations or context not visible on the printed poster."}, {"q": "What should happen to the evidence gaps identified during a congress?", "options": ["Remain only in the MSL's personal notes", "Be formally fed into the Medical Plan and the evidence generation plan for strategic follow-up", "Be shared only on personal social media", "Be discarded if unrelated to the main product"], "correct": 1, "explain": "Identified evidence gaps must be integrated into formal medical planning processes to generate real impact."}, {"q": "What distinguishes 'session tracking' from simply attending a session?", "options": ["There is no difference at all", "It involves structured capture of data and key messages, distinguishing facts from personal interpretation", "It consists of recording the session on video without authorization", "It only counts how many people attended"], "correct": 1, "explain": "Structured session tracking allows for rigorous later analysis, separating objective data from interpretation."}, {"q": "What is an appropriate medical objective for a congress?", "options": ["Getting as many photos as possible with KOLs", "Strengthening relationships with priority KOLs and capturing insights on evidence gaps in the therapeutic area", "Handing out as much promotional material as possible", "Avoiding any interaction and just observing from a distance"], "correct": 1, "explain": "Congress medical objectives focus on strategic relationships, knowledge capture and evidence, not on volume of superficial contacts."}, {"q": "What should post-congress follow-up with a KOL include?", "options": ["Nothing, the relationship ends when the event finishes", "Executing the commitments made during the congress, such as sending promised information or coordinating next scientific steps", "Sending a commercial discount as a thank-you", "Immediately requesting a letter of recommendation"], "correct": 1, "explain": "Follow-up sustains the longitudinal relationship by honoring the scientific commitments made during the event."}]}, {"num": 9, "title": "Medical Strategy & Medical Plan", "objective": "Understand how a solid medical strategy is built and translated into an executable, measurable Medical Plan.", "lessons": [{"title": "What a Medical Plan is", "text": "An annual strategic document that translates the medical strategy for a product/therapeutic area into concrete, measurable objectives, initiatives, resources and KPIs."}, {"title": "Strategic imperatives", "text": "High-level medical priorities derived from analysis of the scientific and competitive landscape and unmet needs, which guide every initiative in the plan."}, {"title": "Evidence gaps", "text": "A central element of the Medical Plan: prioritized evidence gaps drive much of the evidence-generation and medical education initiatives in the plan."}, {"title": "Stakeholder strategy", "text": "Mapping and a differentiated relationship plan for the various medical stakeholder groups: KOLs, scientific societies, payers, investigators and patient associations."}, {"title": "Medical education plan", "text": "A scientific training plan aimed at HCPs, aligned with identified evidence gaps and educational needs, not with sales objectives."}, {"title": "Publication plan", "text": "Strategic and ethical planning of scientific publications derived from the company's studies, following good authorship and transparency practices (GPP)."}, {"title": "Congress plan", "text": "Strategic selection of the year's priority congresses, aligned with medical objectives and the evidence-generation calendar."}, {"title": "Omnichannel medical plan", "text": "Integrating in-person and digital channels to maximize the reach and relevance of scientific content for each HCP segment."}, {"title": "Medical KPIs", "text": "Quantitative and qualitative indicators that allow tracking progress and the real impact of the Medical Plan's initiatives."}, {"title": "Medical impact narrative", "text": "A coherent, evidence-based story that connects medical initiatives with the value generated for patients, the healthcare system and the organization."}], "examples": ["Build an objective tree: Strategic imperative → Medical objective → Initiatives → KPIs, ensuring vertical coherence.", "Define specific, measurable, time-bound medical objectives, rather than generic aspirations like 'improve KOL relationships.'", "Create medical initiatives aligned with real evidence, avoiding activities with no clear connection to an evidence gap or identified need.", "Design balanced qualitative KPIs (insight quality, KOL perception) and quantitative KPIs (studies generated, publications, evidence gaps closed)."], "caseTitle": "Medical Plan for a vaccine in older adults", "caseText": "You must create the Medical Plan for a vaccine for older adults. Three medical objectives are defined: (1) close the evidence gap on effectiveness in patients with multiple comorbidities, (2) strengthen relationships with 15 priority KOLs in immunization, (3) improve knowledge of immunosenescence among primary care physicians. Five initiatives are designed: an observational study in the target population, a quarterly scientific exchange program with priority KOLs, an omnichannel educational content plan, a publication plan derived from the study, and a presence plan across 3 strategic congresses. Eight KPIs are established: number of patients included in the study, number of quality KOL interactions, engagement with digital educational content, number of actionable insights captured, publications accepted, among others, combining quantitative and qualitative metrics.", "resources": {"framework": "Medical Plan Canvas: Strategic Imperatives → Objectives → Initiatives → Resources → KPIs → Timeline.", "checklist": ["Is every initiative connected to a clear medical objective?", "Are prioritized evidence gaps reflected in the plan?", "Is there a differentiated stakeholder strategy by actor type?", "Do the KPIs combine quantitative and qualitative measures?", "Does the publication plan follow good authorship practices (GPP)?"], "prompt": "Act as a Medical Director. Based on these evidence gaps and insights [paste information], help me build an objective tree with 3 medical objectives, 5 aligned initiatives and 8 balanced KPIs (quantitative and qualitative) for the annual Medical Plan.", "template": "Medical Plan One-Pager: Strategic Imperative → Medical objective → Key initiatives → Stakeholders → KPIs → Timeline → Budget.", "glossary": [{"term": "Medical Plan", "def": "An annual strategic document that translates medical strategy into measurable objectives and initiatives."}, {"term": "Strategic imperative", "def": "A high-level medical priority guiding the plan."}, {"term": "GPP", "def": "Good Publication Practice, ethical good practices for scientific publishing."}, {"term": "Objective tree", "def": "A hierarchical structure connecting priorities, objectives, initiatives and KPIs."}]}, "quiz": [{"q": "What is the main function of a Medical Plan?", "options": ["Setting the product's sale price", "Translating medical strategy into concrete, measurable objectives, initiatives, resources and KPIs", "Replacing the commercial marketing plan", "Documenting only the team's travel budget"], "correct": 1, "explain": "The Medical Plan is the operational document that turns medical strategy into measurable action."}, {"q": "What are 'strategic imperatives' in a Medical Plan?", "options": ["The plan's final KPIs", "High-level medical priorities derived from landscape analysis that guide all initiatives", "The budget allocated to the medical team", "The list of KOLs to visit"], "correct": 1, "explain": "Strategic imperatives are the highest-level priorities that give coherence to the entire plan."}, {"q": "Why should evidence gaps be a central element of the Medical Plan?", "options": ["Because they drive much of the evidence-generation and medical education initiatives that add real value", "Because they are optional and only included if budget allows", "Because only the legal department requires them", "Because they have no relation to medical strategy"], "correct": 0, "explain": "Prioritized evidence gaps are the rational basis for many of the plan's medical initiatives."}, {"q": "What distinguishes a well-designed 'medical education plan' from a poorly designed one?", "options": ["That it is aligned with evidence gaps and real educational needs, not with sales objectives", "That it includes as many events as possible, regardless of content", "That it is decided exclusively by the commercial team", "That it has no impact measurement at all"], "correct": 0, "explain": "Medical education must respond to real scientific needs, remaining disconnected from commercial objectives."}, {"q": "What are 'Good Publication Practices' (GPP)?", "options": ["Graphic design rules for presentations", "Ethical good practices governing authorship, transparency and process for scientific publications derived from company studies", "Internal budget-approval rules", "Regulations exclusive to international congresses"], "correct": 1, "explain": "GPP ensures integrity and transparency in the scientific publication process."}, {"q": "In an 'objective tree' for the Medical Plan, what is the correct logical order?", "options": ["KPIs → Initiatives → Objectives → Strategic imperatives", "Strategic imperatives → Medical objectives → Initiatives → KPIs", "Initiatives → Strategic imperatives → KPIs → Objectives", "There is no logical order, all elements are independent"], "correct": 1, "explain": "The objective tree starts from high-level priorities and cascades down to concrete tracking metrics."}, {"q": "Which of these is an example of a qualitative medical KPI?", "options": ["Number of units sold", "Quality and actionability of insights generated by the medical team", "Number of active sales representatives", "Negotiated reimbursement price"], "correct": 1, "explain": "Qualitative KPIs capture dimensions of quality and strategic value, not just commercial volume or figures."}, {"q": "What role does 'stakeholder strategy' play within the Medical Plan?", "options": ["None, it's a standalone document unrelated to the plan", "It maps and defines a differentiated relationship plan for KOLs, scientific societies, payers, investigators and patient associations", "It only applies to relationships with financial investors", "It replaces the publication plan"], "correct": 1, "explain": "Stakeholder strategy ensures the relationship with each relevant type of medical actor is planned in a differentiated way."}, {"q": "Why should an 'omnichannel medical plan' be integrated into the overall Medical Plan?", "options": ["Because it is a mandatory legal requirement in every country", "Because it maximizes the reach and relevance of scientific content by combining in-person and digital channels according to HCP segment", "Because it completely replaces in-person visits", "Because it automatically reduces the medical budget"], "correct": 1, "explain": "The omnichannel approach optimizes the reach of scientific content, adapting to each HCP segment's preferences."}, {"q": "What is the 'medical impact narrative'?", "options": ["A quarterly financial report", "A coherent, evidence-based story connecting medical initiatives with the value generated for patients and the healthcare system", "The script for a commercial presentation", "A purely legal document"], "correct": 1, "explain": "The medical impact narrative articulates the real value generated by the medical function, beyond just listing activities."}]}, {"num": 10, "title": "Omnichannel Medical & Digital Opinion Leaders", "objective": "Master the new digital environment of Medical Affairs, integrating in-person and digital channels coherently and grounded in scientific value.", "lessons": [{"title": "What omnichannel medical is", "text": "A strategy that integrates all scientific interaction channels (in-person, email, webinar, professional networks) into one coherent, personalized experience for the HCP, rather than independent silos."}, {"title": "Difference between multichannel and omnichannel", "text": "Multichannel uses several channels independently and without coordination; omnichannel integrates them with a unified view of the HCP journey, avoiding duplicated or contradictory messages."}, {"title": "DOLs", "text": "Digital Opinion Leaders: professionals with relevant scientific influence exercised through digital channels, requiring specific mapping and engagement complementary to traditional KOLs."}, {"title": "Digital medical education", "text": "Scientific educational content distributed in digital format (webinars, microlearning, educational platforms), with the same rigor and non-promotional objectives as in-person education."}, {"title": "Scientific content journeys", "text": "A planned sequence of scientific content adapted to the HCP's progressive level of knowledge and interest, avoiding indiscriminate, non-personalized information delivery."}, {"title": "LinkedIn for Medical Affairs", "text": "A relevant professional channel for medical thought leadership, always respecting compliance boundaries: educational, non-promotional content, with clear disclosure of conflicts of interest."}, {"title": "Medical listening", "text": "Systematic, ethical monitoring of public scientific conversations (congresses, publications, professional networks) to identify trends, perceptions and emerging evidence gaps."}, {"title": "Digital metrics", "text": "Digital scientific engagement indicators (open rate, interaction time, content depth) that should be interpreted as a proxy for scientific interest, not as commercial conversion."}, {"title": "Digital compliance", "text": "Applying the same compliance rules from the in-person environment to the digital one: traceability, non-promotion, transparency, and control of shared information."}, {"title": "Content personalization", "text": "Adapting scientific content to the profile, specialty and identified evidence gaps of each HCP segment, rather than sending generic mass communication."}], "examples": ["Create an omnichannel journey for HCPs: introductory digital content → invitation to an in-depth webinar → MSL follow-up for in-person scientific exchange.", "Map DOLs in a disease area: identify professionals with high activity and influence in digital publications, webinars and professional scientific networks.", "Design non-promotional educational content: an infographic on the pathophysiology of a condition, with no brand mention or sales message.", "Measure digital scientific engagement: interpret a high content-depth rate as a sign of genuine scientific interest, not purchase intent."], "caseTitle": "Omnichannel strategy on immunosenescence", "caseText": "Design a medical omnichannel strategy to improve knowledge of immunosenescence among healthcare professionals. The journey starts with introductory digital content (an infographic on the aging of the immune system) distributed through segmented professional channels; HCPs showing greater interest (measured by content depth) receive an invitation to a specialized webinar with a KOL; after the webinar, the MSL personally follows up with the most territorially relevant HCPs to deepen in-person scientific exchange. In parallel, relevant DOLs in immunosenescence are identified and mapped to amplify the scientific reach of the content, and medical listening is set up on related digital conversations to detect emerging barriers or questions.", "resources": {"framework": "Omnichannel Journey Map: Digital awareness → Deepening → Personalized interaction (MSL) → Longitudinal relationship.", "checklist": ["Is content segmented according to the HCP's profile and interest?", "Are channels integrated rather than duplicating messages in an uncoordinated way?", "Has the presence of relevant DOLs in the therapeutic area been mapped?", "Does the content comply with regulations (non-promotional, traceable)?", "Are digital metrics interpreted as scientific interest rather than commercial intent?"], "prompt": "Act as an omnichannel medical specialist. Design a 4-stage scientific content journey for HCPs on [clinical topic], integrating a digital channel and MSL follow-up, respecting compliance and avoiding promotional content.", "template": "Omnichannel Content Plan: HCP segment → Scientific objective → Channel → Content type → Next journey step → Success metric.", "glossary": [{"term": "Omnichannel medical", "def": "Coherent integration of in-person and digital channels in the HCP's scientific experience."}, {"term": "DOL", "def": "Digital Opinion Leader, scientific influence exercised mainly through digital channels."}, {"term": "Medical listening", "def": "Ethical monitoring of public scientific conversations to detect trends and insights."}, {"term": "Scientific content journey", "def": "A planned sequence of content adapted to the HCP's progressive interest."}]}, "quiz": [{"q": "What is the key difference between a multichannel and an omnichannel strategy?", "options": ["There is no real difference", "Omnichannel integrates channels into a coherent, personalized HCP experience; multichannel uses them independently and without coordination", "Multichannel is more advanced than omnichannel", "Omnichannel completely excludes the in-person channel"], "correct": 1, "explain": "Coherent, personalized integration is what distinguishes a true omnichannel strategy from mere multichannel presence."}, {"q": "What is a DOL (Digital Opinion Leader)?", "options": ["An employee of the company's digital department", "A professional with relevant scientific influence exercised mainly through digital channels", "A bot that generates automated content", "A type of CRM software"], "correct": 1, "explain": "The DOL is a scientific digital-influence profile, complementary to the traditional offline KOL."}, {"q": "An HCP shows a high open rate and deep engagement with digital scientific content on a clinical topic. How should this metric be correctly interpreted?", "options": ["As a direct signal of immediate purchase intent", "As a proxy for genuine scientific interest that can guide the next step of the journey, not as commercial conversion", "As a measurement error that should be ignored", "As proof that the HCP is ready to receive a commercial offer"], "correct": 1, "explain": "Digital metrics in the medical environment should be interpreted as indicators of scientific interest, not as sales signals."}, {"q": "What digital compliance principle is essential in Medical Affairs?", "options": ["Compliance only applies to the in-person environment, not digital", "The same traceability, non-promotion and transparency rules from the in-person environment must also apply to the digital environment", "Digital compliance is the sole responsibility of the IT department", "There is no need to document digital interactions"], "correct": 1, "explain": "Compliance must be consistent across channels; the digital environment does not exempt the same requirements as the in-person one."}, {"q": "What is a correct example of non-promotional digital educational content?", "options": ["An infographic on the pathophysiology of a condition, with no brand mention or sales message", "An email with a discount on the product", "A video favorably comparing the product against competitors", "A social media post asking for more prescribing"], "correct": 0, "explain": "Medical educational content should focus on science and pathophysiology, disconnected from any commercial or brand message."}, {"q": "What is 'medical listening'?", "options": ["Actively listening to the commercial team in internal meetings", "Systematic, ethical monitoring of public scientific conversations to identify trends, perceptions and emerging evidence gaps", "Recording private HCP conversations without their knowledge", "A mandatory type of physician survey"], "correct": 1, "explain": "Medical listening relies on public sources and seeks to detect relevant scientific signals ethically."}, {"q": "Why is content personalization important in an omnichannel medical strategy?", "options": ["Because it increases the volume of indiscriminate mass mailings", "Because it adapts content to the profile, specialty and evidence gaps of each HCP segment, increasing its real scientific relevance", "Because it allows compliance to be avoided", "Because it reduces the need for a Medical Plan"], "correct": 1, "explain": "Personalization based on real HCP needs is what gives content value and relevance, versus generic mass delivery."}, {"q": "What role does LinkedIn play in a well-executed Medical Affairs strategy?", "options": ["A channel for posting direct product sales messages", "A channel for scientific thought leadership with educational, non-promotional, transparent content on conflicts of interest", "It has no appropriate use in Medical Affairs", "A channel exclusively for posting job openings"], "correct": 1, "explain": "LinkedIn can be a valuable channel for medical thought leadership, always within strict non-promotional compliance limits."}, {"q": "In a 4-stage scientific content journey, what should happen after identifying an HCP with high interest in the initial digital content?", "options": ["Send them a commercial offer immediately", "Offer them a next step of greater scientific depth, such as a specialized webinar or MSL follow-up", "Stop contacting them to avoid being intrusive", "Remove them from the database"], "correct": 1, "explain": "The journey should progress toward greater scientific depth and personalization, not toward a commercial offer."}, {"q": "What is a risk of not mapping DOLs for a specific condition?", "options": ["None, DOLs have no real relevance", "Missing high-influence digital scientific actors who may not overlap with traditional offline KOL mapping", "That the congress budget is reduced", "That sales automatically increase"], "correct": 1, "explain": "Ignoring DOL mapping can leave relevant digital scientific influencers off the radar."}]}, {"num": 11, "title": "AI for Medical Affairs", "objective": "Use artificial intelligence strategically, ethically and practically to enhance Medical Affairs excellence, without compromising compliance or scientific rigor.", "lessons": [{"title": "What AI can bring to Medical Affairs", "text": "Accelerating preparation for interactions, synthesizing extensive scientific literature, structuring insights, generating report drafts, and supporting strategic thinking, always under expert human supervision."}, {"title": "ChatGPT for strategic thinking", "text": "Useful for exploring analytical frameworks, generating critical questions, and structuring strategy drafts, always validated with expert medical judgment and real evidence."}, {"title": "Claude for long documents and artifacts", "text": "Especially powerful for analyzing lengthy documents (protocols, congress reports), synthesizing complex information, and generating interactive training or reporting artifacts."}, {"title": "Perplexity for landscape research", "text": "A useful tool for initial exploration of the scientific and competitive landscape with source citations, which must always be validated against primary sources before formal use."}, {"title": "NotebookLM for document analysis", "text": "Allows querying a bounded set of your own documents (protocols, internal reports) while keeping answers anchored to those specific sources."}, {"title": "Consensus, Elicit and Scite for evidence", "text": "Tools specialized in searching and synthesizing scientific literature, analyzing citation trends, and supporting evidence reviews more efficiently."}, {"title": "Canva AI for medical infographics", "text": "Support for quickly generating educational visual drafts, which must always go through scientific and compliance validation before external use."}, {"title": "AI agents for medical workflows", "text": "Systems that chain several tasks (research, synthesis, report drafting) semi-autonomously, requiring human supervision at critical decision points."}, {"title": "Risks, compliance and privacy", "text": "AI should not be used with confidential patient or HCP data without adequate safeguards; all AI-generated output must be scientifically validated before any external use."}, {"title": "How to build an AI Medical Affairs Operating System", "text": "Combining specific tools for each task (research, synthesis, drafting, analysis) within a consistent, documented workflow with human validation checkpoints."}], "examples": ["Prompt to prepare a KOL visit: summarize the KOL's recent publications, identify potential areas of interest, and generate personalized exploratory questions.", "Prompt to analyze a paper: extract design, population, primary endpoint, effect magnitude, limitations and potential clinical relevance in a structured format.", "Prompt to generate a congress report: synthesize notes from sessions and poster walks into a one-page executive report with prioritized findings and insights.", "Prompt to create a medical infographic in Canva: generate an educational visual draft on a mechanism of action, for later review and validation by Medical Excellence.", "Prompt for role-play with a skeptical KOL: simulate a conversation with realistic scientific objections to practice managing scientific exchange before a real visit."], "caseTitle": "An AI workflow for preparing an advisory board", "caseText": "Build an AI-powered workflow to prepare an advisory board from scratch. Phase 1 (Objectives): use AI to structure a draft of scientific objectives for the advisory board based on prioritized evidence gaps, later validated by the medical team. Phase 2 (Agenda): generate a draft agenda with structured discussion blocks by clinical topic. Phase 3 (Briefing): synthesize the most recent relevant literature for each participant into a personalized briefing. Phase 4 (Questions): generate high-level discussion questions for each thematic block. Phase 5 (Post-meeting analysis): use AI to structure the meeting's notes and transcripts into categorized insights. Phase 6 (Final report): generate a draft executive report from the structured insights, with final scientific and compliance validation before distribution.", "resources": {"framework": "AI Medical Affairs Operating System: Research → Synthesis → Drafting → Human Validation → Distribution.", "checklist": ["Has confidential patient or HCP data been kept out of unapproved AI tools?", "Has every AI output been scientifically validated by a human expert?", "Has the absence of hallucinations or invented citations been verified?", "Does the AI use comply with the company's internal compliance policy?", "Is AI use documented as support, not as a substitute for medical judgment?"], "prompt": "Act as an advisory board preparation assistant in Medical Affairs. Based on these evidence gaps [paste list] and these participants [paste profiles], generate: 3 scientific objectives for the advisory board, a structured agenda in blocks, and 2 high-level discussion questions per block.", "template": "AI Workflow Canvas: Task → Recommended AI tool → Required input → Expected output → Human validation checkpoint → Risk to control.", "glossary": [{"term": "Hallucination", "def": "The generation by an AI model of incorrect or invented information presented as if it were factual."}, {"term": "Human-in-the-loop", "def": "The principle of maintaining expert human oversight and validation at critical points of an AI-powered workflow."}, {"term": "Tool selection matrix", "def": "A decision tool that maps task type to the most suitable AI for executing it."}, {"term": "AI Operating System", "def": "An integrated, documented set of AI tools applied consistently to a medical workflow."}]}, "quiz": [{"q": "What is the most important principle when using generative AI to prepare scientific content in Medical Affairs?", "options": ["Always use the AI's output unmodified, to save time", "Every AI-generated output must be scientifically validated by a human expert before any use, especially external use", "Avoid any use of AI on principle", "Use AI only for administrative tasks, never scientific ones"], "correct": 1, "explain": "Expert human validation is the critical, non-negotiable checkpoint in any AI-powered workflow in Medical Affairs."}, {"q": "What is a 'hallucination' in the context of AI models?", "options": ["An internet connection error", "The generation of incorrect or invented information presented as if it were factual", "A type of statistical bias in clinical trials", "A model safety feature"], "correct": 1, "explain": "Hallucinations are a real risk that demands careful verification of any citation or data generated by AI before use."}, {"q": "What is an appropriate, low-risk use of AI when preparing a KOL visit?", "options": ["Summarizing the KOL's recent publications and generating personalized exploratory questions, later validated by the MSL", "Automatically generating the sales pitch to use with the KOL", "Inventing clinical data if it isn't available", "Sharing confidential information from the KOL's medical history with the AI"], "correct": 0, "explain": "Synthesizing public information to prepare questions is an appropriate use; the other examples are risky or inappropriate."}, {"q": "What type of information should NOT be entered into general-purpose AI tools not approved by compliance?", "options": ["General questions about published mechanisms of action", "Confidential, identifiable data about patients or HCPs", "Summaries of already publicly published articles", "Questions about general statistical methodology"], "correct": 1, "explain": "Confidential, identifiable patient or HCP data requires privacy safeguards that unapproved general-purpose tools do not provide."}, {"q": "What type of task is NotebookLM especially suited for in a Medical Affairs workflow?", "options": ["Generating high-resolution medical images", "Querying a bounded set of your own documents while keeping answers anchored to those specific sources", "Completely replacing an ethics committee review", "Directly drafting scientific publications with no review"], "correct": 1, "explain": "NotebookLM is designed to work with a closed document corpus, reducing the risk of information not anchored to sources."}, {"q": "Which principle best describes the concept of 'human-in-the-loop' in medical AI workflows?", "options": ["AI must operate completely autonomously with no oversight", "Maintaining expert human oversight and validation at the workflow's critical decision points", "It only applies to administrative tasks with no scientific relevance", "It's a concept exclusive to software engineering, not applicable to Medical Affairs"], "correct": 1, "explain": "Human-in-the-loop ensures expert medical judgment validates critical decisions, even when using AI as support."}, {"q": "What is the purpose of a 'tool selection matrix' in an AI Medical Affairs Operating System?", "options": ["Randomly choosing which AI tool to use each day", "Mapping task type to the most suitable AI tool for executing it consistently", "Replacing the need for a Medical Plan", "Deciding the department's annual budget"], "correct": 1, "explain": "The matrix helps standardize which tool to use based on the nature of the task, avoiding inefficient or inappropriate use."}, {"q": "When preparing a congress report with AI assistance, what is the essential final step before distributing it?", "options": ["Distribute it directly with no review to save time", "Scientific and compliance validation of the AI-generated content before final distribution", "Translate it into every possible language", "Automatically publish it on social media"], "correct": 1, "explain": "No AI-assisted content should be distributed without the corresponding expert and compliance validation."}, {"q": "What risk is most relevant when using general-purpose AI tools for landscape research (e.g. Perplexity)?", "options": ["That they are too slow to be useful", "That cited sources must always be verified against primary sources before formal use", "That they don't allow any kind of search", "That they only work in one language"], "correct": 1, "explain": "Verifying primary sources is essential, since AI tools can cite imprecisely or reference outdated information."}, {"q": "Which of the following is NOT an appropriate function of an AI agent in a semi-autonomous medical workflow?", "options": ["Chaining research and document-synthesis tasks with human review checkpoints", "Autonomously deciding, with no oversight, on the scientific validity of critical evidence", "Generating an initial report draft for later review", "Structuring meeting notes into thematic categories to facilitate human analysis"], "correct": 1, "explain": "Critical scientific decisions always require expert human validation; the AI agent should support, not autonomously decide, at these points."}]}, {"num": 12, "title": "Medical Affairs Leadership & Career Accelerator", "objective": "Develop medical leadership, professional brand and a solid long-term career strategy in Medical Affairs.", "lessons": [{"title": "Competencies of the medical leader", "text": "A combination of scientific rigor, strategic thinking, emotional intelligence and the ability to influence without formal authority across cross-functional teams."}, {"title": "Strategic thinking", "text": "The ability to connect day-to-day tactical decisions with long-term medical and business strategy, anticipating implications beyond one's own role."}, {"title": "Influence without authority", "text": "An essential skill in Medical Affairs: achieving alignment and action from other teams (Commercial, Market Access, R&D) with no direct hierarchical relationship, through credibility and value delivered."}, {"title": "Executive communication", "text": "The ability to synthesize complex scientific information into clear, prioritized, actionable messages for time-constrained executive audiences."}, {"title": "Managing internal stakeholders", "text": "Mapping the interests, priorities and communication style of key internal stakeholders to build effective alliances and anticipate resistance."}, {"title": "Personal brand in Medical Affairs", "text": "Consistently building a professional reputation based on scientific rigor, reliability and real value delivered, both internally and externally."}, {"title": "LinkedIn thought leadership", "text": "Strategic, compliant use of LinkedIn to share professional perspective and educational content, building visibility as a reference in the medical field."}, {"title": "Interviewing for MSL and Medical Advisor roles", "text": "Structured preparation to demonstrate key competencies: critical scientific thinking, compliance orientation, communication, and concrete examples of impact generated."}, {"title": "Professional development plan", "text": "Defining short-, medium- and long-term career objectives, with identified competency gaps and a concrete action plan to close them."}, {"title": "From MSL to Medical Lead", "text": "A progression path requiring evolution from individual field excellence to team leadership capability, strategic vision and senior stakeholder management."}], "examples": ["Create a 30-second professional elevator pitch combining scientific value proposition, differential experience and career direction.", "Prepare for an MSL interview with concrete applied examples (an insight generated, a KOL relationship recovered, an evidence gap identified) rather than generic descriptions.", "Design a 3-year career plan with competency, training and experience milestones for each stage of progression.", "Write an educational LinkedIn post on a relevant scientific topic, non-promotional, offering genuine professional perspective."], "caseTitle": "A 12-month growth plan from MSL to Medical Advisor/Manager", "caseText": "You are an MSL with 2 years of experience wanting to move into a Medical Advisor or Medical Manager role. The 12-month growth plan combines four pillars: first, closing identified competency gaps (for example, gaining more exposure to designing evidence generation plans by actively participating in building the next Medical Plan); second, expanding internal visibility by presenting strategic insights to senior stakeholders; third, building an external personal brand through compliant thought-leadership content on LinkedIn about the therapeutic area; fourth, actively seeking mentorship from a current Medical Manager or Medical Director, with quarterly progress reviews against defined milestones. The plan is documented with concrete, measurable milestones each quarter, not as a generic aspiration.", "resources": {"framework": "Career Growth Canvas: Current role → Target role → Competency gaps → Development actions → Quarterly milestones → Mentor/sponsor.", "checklist": ["Do I have a documented development plan with quarterly milestones?", "Have I precisely identified my competency gaps versus the target role?", "Am I building internal visibility with concrete impact examples?", "Do I have an active mentor or sponsor within the organization?", "Is my external personal brand consistent with my career goals and compliant?"], "prompt": "Act as a Medical Affairs career coach. With my current role [describe] and my 12-month target role [describe], help me build a development plan with 4 priority competency gaps and 3 concrete quarterly actions to close them.", "template": "12-Month Career Plan: Quarter → Development objective → Concrete action → Evidence of achievement → Mentor review.", "glossary": [{"term": "Influence without authority", "def": "The ability to achieve alignment and action from others without a direct hierarchical relationship."}, {"term": "Thought leadership", "def": "Positioning oneself professionally as a reference of perspective and knowledge in a field."}, {"term": "Sponsor", "def": "A senior person who actively promotes a professional's development and visibility within the organization."}, {"term": "Medical Lead", "def": "A medical leadership role with strategic and team responsibility."}]}, "quiz": [{"q": "What best characterizes 'influence without authority,' a key competency in Medical Affairs?", "options": ["Giving direct orders to other departments", "Achieving alignment and action from other teams with no direct hierarchical relationship, through scientific credibility and delivered value", "Avoiding any interaction with other departments", "Always depending on a superior's approval"], "correct": 1, "explain": "In matrixed structures, Medical Affairs must influence through credibility and value, not formal authority."}, {"q": "What element makes an interview for an MSL or Medical Advisor role more effective?", "options": ["Generic answers about personal motivation", "Concrete, applied examples of impact generated, such as actionable insights or identified evidence gaps", "Emphasizing only theoretical knowledge with no examples", "Avoiding discussing real cases due to confidentiality, with no adaptation at all"], "correct": 1, "explain": "Concrete, applied examples demonstrate real competence far more persuasively than generic statements."}, {"q": "What is 'executive communication' in the context of medical leadership?", "options": ["Speaking with as much technical detail as possible in any context", "Synthesizing complex scientific information into clear, prioritized, actionable messages for time-constrained executive audiences", "Avoiding communication with leadership to save time", "Always using presentations with more than 50 slides"], "correct": 1, "explain": "Executive communication requires synthesis and prioritization, adapting scientific complexity to the executive's context and available time."}, {"q": "What distinguishes the progression 'from MSL to Medical Lead'?", "options": ["Just a title change with no new responsibilities", "Evolving from individual field excellence to team leadership capability, strategic vision and senior stakeholder management", "No longer needing scientific knowledge", "Completely reducing contact with KOLs"], "correct": 1, "explain": "Progression into leadership roles requires developing team management and strategic competencies, beyond individual field excellence."}, {"q": "What principle should guide the use of LinkedIn for medical thought leadership?", "options": ["Sharing any content, including promotional product messages", "Sharing educational content and genuine professional perspective, always within compliance limits", "Using it exclusively to look for a new job", "Avoiding any activity, since it adds no professional value"], "correct": 1, "explain": "Medical thought leadership on LinkedIn must be educational, non-promotional, and always compliant."}, {"q": "What role does a 'sponsor' play in professional development within Medical Affairs?", "options": ["It's the same as a mentor, with no difference", "A senior person who actively promotes the professional's visibility and development within the organization", "A purely administrative role unrelated to career development", "A legal requirement for any promotion"], "correct": 1, "explain": "A sponsor provides active promotion and visibility, complementing the more advice-oriented role of a mentor."}, {"q": "What characterizes a good professional development plan in Medical Affairs?", "options": ["Being a generic aspiration with no defined timelines", "Having precisely identified competency gaps and a concrete action plan with measurable milestones", "Requiring no periodic review once defined", "Focusing solely on the target salary"], "correct": 1, "explain": "An effective development plan is specific, measurable, and periodically reviewed against concrete milestones."}, {"q": "What is 'strategic thinking' as applied to a Medical Affairs professional's role?", "options": ["Focusing exclusively on day-to-day operational tasks with no bigger-picture view", "The ability to connect everyday tactical decisions with long-term medical and business strategy", "Delegating all strategic decisions to other departments", "Avoiding any participation in defining the Medical Plan"], "correct": 1, "explain": "Strategic thinking connects daily action with the organization's long-term implications and priorities."}, {"q": "What is a fundamental element of effectively managing internal stakeholders?", "options": ["Ignoring each stakeholder's particular interests", "Mapping the interests, priorities and communication style of key stakeholders to build effective alliances", "Communicating with every stakeholder in exactly the same way", "Avoiding any interaction until strictly necessary"], "correct": 1, "explain": "Effective stakeholder management requires understanding and adapting to each person's interests and style."}, {"q": "What role does personal brand play in a Medical Affairs professional's career?", "options": ["No relevance at all if the technical work is good", "It builds a consistent professional reputation based on scientific rigor and reliability, opening internal and external opportunities", "It only matters for marketing roles, not Medical Affairs", "It is based exclusively on the number of social media followers"], "correct": 1, "explain": "Personal brand in Medical Affairs is built on demonstrated scientific credibility and reliability, not vanity metrics."}]}];
