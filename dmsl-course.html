<style>
:root{
  --primary:#7A00E6;
  --primary-dark:#5E12A1;
  --accent:#AB30E8;
  --fg:#1F242E;
  --muted:#737373;
  --border:#E6E1EB;
  --surface:#F0EAF7;
  --bg:#FFFFFF;
  --grad:linear-gradient(135deg,#7A00E6 0%,#5E12A1 100%);
  --grad-soft:linear-gradient(135deg,#AB30E8 0%,#7A00E6 100%);
  --shadow:0 10px 30px rgba(94,18,161,.12);
  --shadow-sm:0 4px 14px rgba(94,18,161,.08);
  --radius:16px;
  --radius-sm:10px;
  --success:#16a34a;
  --success-bg:#f1f9f3;
  --success-border:#cfe9d6;
  --danger:#c23b53;
  --danger-bg:#fdf3f4;
  --danger-border:#f4d4d9;
  --font-title:'Poppins',system-ui,-apple-system,sans-serif;
  --font-body:'Poppins',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  color:var(--fg);
  background:var(--bg);
  line-height:1.6;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{font-family:var(--font-title);color:var(--fg);font-weight:700;letter-spacing:-.01em;line-height:1.15;}
.num, .metric{font-weight:800;font-variant-numeric:tabular-nums;}
a{color:var(--primary);text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
ul{list-style:none;}
::selection{background:var(--surface);color:var(--primary-dark);}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d8cfe6;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{min-height:100vh;display:flex;flex-direction:column;}

/* Header */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--grad);
  color:var(--bg);
  padding:0 24px;
  height:66px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.topbar-logo-img{width:100%;height:100%;object-fit:contain;display:block;}
.hero-logo{position:relative;z-index:1;width:64px;height:64px;margin-bottom:18px;display:block;}
.topbar-title{font-family:var(--font-title);font-weight:700;font-size:15px;color:#fff;line-height:1.2;}
.topbar-title small{display:block;font-weight:500;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.02em;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.topbar-progress{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.14);
  padding:6px 14px;border-radius:999px;
  font-size:12px;font-weight:700;color:#fff;
}
.topbar-progress .bar{width:70px;height:6px;border-radius:6px;background:rgba(255,255,255,0.25);overflow:hidden;}
.topbar-progress .bar>div{height:100%;background:#fff;border-radius:6px;transition:width .5s ease;}
.nav-btn{
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.85);transition:.2s;
}
.nav-btn:hover{background:rgba(255,255,255,0.14);color:#fff;}
.nav-btn.active{background:rgba(255,255,255,0.22);color:#fff;}
.hamburger{display:none;color:#fff;font-size:22px;padding:6px;}

/* Layout */
.layout{flex:1;display:flex;width:100%;max-width:1440px;margin:0 auto;min-height:0;}
.sidebar{
  width:280px;flex:none;background:var(--bg);
  border-right:1px solid var(--border);
  padding:22px 14px 40px;
  position:sticky;top:66px;align-self:flex-start;
  height:calc(100vh - 66px);overflow-y:auto;
}
.sidebar-head{padding:4px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.sidenav-kic{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px;}
.sidenav-title{font-weight:700;font-size:14px;color:var(--primary-dark);line-height:1.25;display:block;}
.sidebar-section-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:700;margin:18px 8px 8px;
}
.sidebar-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:12px;margin-bottom:4px;
  cursor:pointer;transition:.15s;
}
.sidebar-item:hover{background:var(--surface);}
.sidebar-item.active{background:var(--grad-soft);box-shadow:var(--shadow-sm);}
.sidebar-item.active .sidebar-item-title{color:#fff;}
.sidebar-item.active .sidebar-item-num{background:rgba(255,255,255,.28);color:#fff;}
.sidebar-item-num{
  width:26px;height:26px;border-radius:8px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary);flex:none;
}
.sidebar-item-title{font-size:13px;font-weight:600;color:var(--fg);flex:1;line-height:1.3;}
.sidebar-item-status{width:9px;height:9px;border-radius:50%;flex:none;}
.status-not_started{background:#CBD5E1;}
.status-in_progress{background:var(--accent);}
.status-completed{background:var(--success);}
.status-excellent{background:var(--primary);box-shadow:0 0 0 3px rgba(122,0,230,.18);}

/* Progress ring */
.sidenav-progress{text-align:center;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.progress-ring{position:relative;width:88px;height:88px;margin:0 auto 8px;}
.progress-ring svg{width:88px;height:88px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:7;}
.ring-fg{fill:none;stroke:var(--primary);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .55s cubic-bezier(0.34,1.2,0.5,1);}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:var(--primary);}
.progress-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}

.main{flex:1;min-width:0;padding:34px;}
@media (max-width:980px){
  .sidebar{display:none;}
  .sidebar.mobile-open{
    display:block;position:fixed;top:66px;left:0;right:0;bottom:0;
    width:100%;height:calc(100vh - 66px);z-index:90;box-shadow:var(--shadow);
  }
  .hamburger{display:block;}
  .main{padding:18px;}
}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:999px;font-weight:600;font-size:14px;
  transition:.18s ease;white-space:nowrap;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{opacity:.92;transform:translateY(-1px);}
.btn-gold{background:var(--grad-soft);color:#fff;box-shadow:var(--shadow-sm);}
.btn-gold:hover{opacity:.92;transform:translateY(-1px);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--primary);background:var(--surface);}
.btn-onhero{background:rgba(255,255,255,0.12) !important;color:#fff !important;border-color:rgba(255,255,255,0.35) !important;}
.btn-onhero:hover{background:rgba(255,255,255,0.2) !important;}
.btn-ghost{color:var(--primary);background:var(--surface);}
.btn-ghost:hover{background:#e5d9f5;}
.btn-danger{color:var(--danger);background:var(--danger-bg);}
.btn-danger:hover{background:#fbdfe4;}
.btn-sm{padding:8px 16px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}

/* ===== Hero ===== */
.hero{
  background:var(--grad);
  color:#fff;border-radius:24px;padding:80px 56px 72px;position:relative;overflow:hidden;
  animation:fadeIn .5s ease;
}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;background:radial-gradient(circle,rgba(171,48,232,.55),transparent 70%);border-radius:50%;}
.hero-eyebrow{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);
  padding:6px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.05em;
  color:#fff;margin-bottom:20px;
}
.hero h1{position:relative;z-index:1;font-size:clamp(34px,5vw,58px);color:#fff;line-height:1.05;max-width:820px;}
.hero .subtitle{position:relative;z-index:1;font-size:clamp(17px,2vw,21px);color:#fff;opacity:.95;font-weight:600;margin-top:14px;max-width:720px;}
.hero p.desc{position:relative;z-index:1;margin-top:18px;max-width:680px;opacity:.9;font-size:15px;}
.hero-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:38px;max-width:920px;}
.hero-stat{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:14px;padding:16px 18px;}
.hero-stat .num{font-size:26px;color:#fff;display:block;}
.hero-stat .label{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;}
.hero-actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:14px;margin-top:38px;}
@media (max-width:640px){.hero{padding:44px 26px;}}

/* ===== Section headers ===== */
.section-title{font-size:25px;margin-bottom:4px;}
.section-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
.block{margin-top:44px;}

/* ===== Cards ===== */
.card{
  background:var(--bg);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:.2s;
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.dash-card{display:flex;flex-direction:column;gap:6px;}
.dash-card .icon{width:42px;height:42px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px;}
.dash-card .num{font-size:30px;color:var(--primary);}
.dash-card .label{font-size:13px;color:var(--muted);font-weight:600;}

.progressbar{height:9px;border-radius:8px;background:var(--surface);overflow:hidden;}
.progressbar>div{height:100%;border-radius:8px;background:var(--grad-soft);transition:width .6s ease;}

.rank-banner{
  background:var(--grad);color:#fff;
  border-radius:var(--radius);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.rank-banner .rank-name{font-size:20px;color:#fff;}
.rank-pill{background:rgba(255,255,255,0.2);color:#fff;padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;}

/* Module cards (curriculum) */
.mod-card{cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;}
.mod-card .mod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.mod-card .mod-index{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.04em;}
.mod-card h3{font-size:16px;line-height:1.3;}
.mod-card p{font-size:13px;color:var(--muted);}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
.badge-not_started{background:#EEF0F2;color:#6b7280;}
.badge-in_progress{background:#F3E4FC;color:var(--accent);}
.badge-completed{background:var(--success-bg);color:var(--success);}
.badge-excellent{background:#EBDBFC;color:var(--primary-dark);}
.mod-card .mod-score{font-size:12px;font-weight:700;color:var(--primary);margin-top:4px;}

/* ===== Module detail ===== */
.module-header{
  background:var(--bg);border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow-sm);border:1px solid var(--border);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;
}
.module-header h2{font-size:24px;}
.module-header .objective{font-size:14px;color:var(--muted);margin-top:8px;max-width:640px;}
.tabs{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{
  padding:11px 18px;font-size:13.5px;font-weight:600;color:var(--muted);
  border-bottom:2.5px solid transparent;white-space:nowrap;
}
.tab-btn.active{color:var(--primary);border-color:var(--primary);}
.tab-panel{display:none;animation:fadeIn .35s ease;padding-top:26px;}
.tab-panel.active{display:block;}

/* Lessons accordion */
.lesson-item{background:var(--bg);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.lesson-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer;gap:12px;}
.lesson-head:hover{background:var(--surface);}
.lesson-head-left{display:flex;align-items:center;gap:12px;}
.lesson-check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:.2s;cursor:pointer;
}
.lesson-check:hover{border-color:var(--primary);background:var(--surface);}
.lesson-check.done{background:var(--success);border-color:var(--success);}
.lesson-title{font-size:14px;font-weight:600;color:var(--fg);}
.lesson-num{font-size:11px;color:var(--accent);font-weight:700;}
.chevron{transition:.25s;color:var(--muted);font-size:13px;}
.lesson-item.open .chevron{transform:rotate(180deg);}
.lesson-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.lesson-item.open .lesson-body{max-height:400px;}
.lesson-body-inner{padding:0 18px 18px 52px;font-size:13.5px;color:var(--fg);}

/* Practical cases */
.example-item{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;
  display:flex;gap:12px;align-items:flex-start;
}
.example-item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
.example-item p{font-size:13.5px;color:var(--fg);}
.case-box{
  background:var(--grad);color:#fff;border-radius:18px;padding:26px 28px;margin-top:22px;
}
.case-box .case-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;margin-bottom:8px;}
.case-box h4{color:#fff;font-size:17px;margin-bottom:10px;}
.case-box p{font-size:14px;color:rgba(255,255,255,.9);}

/* Resources */
.res-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.res-card h4{font-size:14px;color:var(--primary-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.res-card p, .res-card li{font-size:13.5px;color:var(--fg);}
.res-card ul{margin-top:6px;}
.res-card li{padding:4px 0;padding-left:18px;position:relative;}
.res-card li:before{content:"✓";position:absolute;left:0;color:var(--success);font-weight:700;}
.glossary-term{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.glossary-term:last-child{border:none;}
.glossary-term b{color:var(--primary-dark);min-width:150px;flex:none;}

/* AI Prompt block — dark code style with copy button */
.promptwrap{margin-top:14px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #2a2142;}
.prompttop{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#120d24;padding:11px 14px 11px 18px;}
.plabel{color:#c79bff;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.copybtn{background:var(--grad-soft);color:#fff;border:none;border-radius:999px;padding:7px 16px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:opacity .15s,background .2s;white-space:nowrap;flex:0 0 auto;}
.copybtn:hover{opacity:.9;}
.copybtn.copied{background:var(--success);}
.prompt{background:#1b1430;color:#e8e2f5;margin:0;padding:18px 20px;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.62;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}

/* ===== Quiz ===== */
.quiz-intro{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:var(--shadow-sm);}
.quiz-intro .best{font-size:13px;color:var(--muted);}
.quiz-intro .best b{color:var(--primary);font-size:16px;}
.quiz-q{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.quiz-q .qnum{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:6px;}
.quiz-q .qtext{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:16px;line-height:1.45;}
.option{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;
  margin-bottom:9px;cursor:pointer;transition:.15s;font-size:13.5px;
}
.option:hover{border-color:var(--primary);background:var(--surface);}
.option.selected{border-color:var(--primary);background:var(--surface);}
.option .letter{
  width:24px;height:24px;border-radius:8px;background:var(--surface);color:var(--muted);font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.option.selected .letter{background:var(--grad-soft);color:#fff;}
.quiz-q.answered .option{cursor:default;pointer-events:none;}
.quiz-q.answered .option.correct{border-color:var(--success-border);background:var(--success-bg);}
.quiz-q.answered .option.correct .letter{background:var(--success);color:#fff;}
.quiz-q.answered .option.incorrect{border-color:var(--danger-border);background:var(--danger-bg);}
.quiz-q.answered .option.incorrect .letter{background:var(--danger);color:#fff;}
.feedback-box{margin-top:12px;padding:12px 16px;border-radius:12px;font-size:13px;display:none;}
.quiz-q.answered .feedback-box{display:block;animation:fadeIn .3s ease;}
.feedback-box.ok{background:var(--success-bg);color:#166534;border-left:4px solid var(--success);}
.feedback-box.ko{background:var(--danger-bg);color:#8f2b3f;border-left:4px solid var(--danger);}
.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:14px;}
.quiz-result{
  background:var(--grad);color:#fff;border-radius:20px;padding:34px;text-align:center;margin-bottom:20px;
  animation:fadeIn .4s ease;box-shadow:var(--shadow);
}
.quiz-result .score{font-size:52px;color:#fff;}
.quiz-result .msg{font-size:15px;color:rgba(255,255,255,.9);margin-top:6px;max-width:480px;margin-left:auto;margin-right:auto;}
.quiz-result .pass{color:#fff;background:rgba(255,255,255,.18);padding:6px 16px;border-radius:999px;font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin-top:16px;display:inline-block;}
.xp-toast{
  position:fixed;bottom:26px;right:26px;background:var(--grad);color:#fff;padding:14px 22px;border-radius:14px;
  box-shadow:var(--shadow);font-size:13px;font-weight:600;z-index:999;display:flex;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;transition:.35s ease;
}
.xp-toast.show{transform:translateY(0);opacity:1;}
.xp-toast .gold{color:#fce38a;font-size:16px;}

/* ===== Certificate ===== */
.cert-locked{
  background:var(--bg);border:1.5px dashed var(--border);border-radius:20px;padding:48px;text-align:center;
}
.cert-locked .lock-icon{font-size:38px;margin-bottom:14px;}
.cert-unlocked-banner{
  background:var(--grad);color:#fff;border-radius:20px;padding:30px;text-align:center;margin-bottom:24px;box-shadow:var(--shadow);
}
.cert-unlocked-banner h3{color:#fff;font-size:22px;}
.cert-form{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:520px;margin:0 auto;box-shadow:var(--shadow-sm);}
.cert-form label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;}
.cert-form input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:18px;font-family:inherit;
}
.cert-form input:focus{outline:none;border-color:var(--primary);}
.cert-preview{
  border-radius:22px;padding:44px 36px;text-align:center;background:var(--bg);
  position:relative;max-width:720px;margin:26px auto 0;box-shadow:var(--shadow);
}
.cert-preview:before{content:"";position:absolute;inset:0;border-radius:22px;padding:3px;background:var(--grad-soft);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.cert-preview .cert-eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.cert-preview h2{font-size:26px;margin-top:10px;color:var(--primary-dark);}
.cert-preview .cert-name{font-size:30px;color:var(--fg);margin:18px 0;font-family:var(--font-title);border-bottom:2px solid var(--surface);display:inline-block;padding-bottom:8px;}
.cert-preview .cert-course{font-size:15px;color:var(--fg);max-width:520px;margin:0 auto;}
.cert-meta{display:flex;justify-content:center;gap:36px;margin-top:26px;flex-wrap:wrap;}
.cert-meta div{text-align:center;}
.cert-meta .num{font-size:20px;color:var(--primary);}
.cert-meta .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.cert-sign{margin-top:34px;font-size:13px;color:var(--muted);font-style:italic;}

.footer-note{text-align:center;color:var(--muted);font-size:12px;padding:40px 20px 10px;}

/* ===== Auth screens ===== */
.user-chip{font-size:12px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.auth-card{background:var(--bg);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow);animation:fadeIn .4s ease;}
.auth-tabs{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;margin-bottom:26px;}
.auth-tab{flex:1;padding:10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);text-align:center;transition:.2s;}
.auth-tab.active{background:var(--grad);color:#fff;box-shadow:var(--shadow-sm);}
.auth-card label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;margin-top:14px;}
.auth-card input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;}
.auth-card input:focus{outline:none;border-color:var(--primary);}
.auth-error{background:var(--danger-bg);border-left:4px solid var(--danger);color:#8f2b3f;padding:10px 14px;border-radius:10px;font-size:13px;margin:10px 0 0;}
.demo-note{font-size:11.5px;color:var(--muted);margin-top:24px;text-align:center;line-height:1.5;}
.otp-inbox{background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px;padding:16px 18px;margin:18px 0 6px;}
.otp-inbox-label{font-size:12px;font-weight:700;color:var(--primary-dark);margin-bottom:6px;}
.otp-code{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:800;letter-spacing:.3em;color:var(--primary);text-align:center;background:#fff;border-radius:12px;padding:12px;margin-top:6px;border:1px solid var(--border);}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (max-width:640px){
  .quiz-result .score{font-size:38px;}
  .cert-preview{padding:28px 18px;}
  .cert-preview .cert-name{font-size:22px;}
}
.hidden{display:none !important;}
</style>

<script>
const COURSE_DATA = [{"num": 1, "title": "Medical Affairs Foundations & Strategic Role", "objective": "Understand the strategic role of Medical Affairs within the modern pharmaceutical industry, and its function as an independent unit connecting science, clinical practice and business strategy without promotional bias.", "lessons": [{"title": "What Medical Affairs is and why it exists", "text": "An independent function from Commercial that generates, interprets and communicates scientific evidence to ensure appropriate use of a medicine. It exists to provide an objective bridge between clinical data and real-world practice, separate from any sales objective."}, {"title": "Differences between Medical, Commercial, Market Access and R&D", "text": "R&D generates the pivotal data; Medical Affairs translates it, expands it with real-world evidence and communicates it in a non-promotional way; Market Access turns it into a value and pricing argument for payers; Commercial drives commercial use of the product within the label. All four share a business objective but with distinct mandates, audiences and compliance boundaries."}, {"title": "The evolution of Medical Affairs: from scientific support to strategic partner", "text": "Historically reactive (answering unsolicited medical questions), today it is proactive: it co-designs the Target Product Profile, defines the evidence generation plan and leads relationships with high-impact KOLs from early development stages."}, {"title": "Medical value across the product lifecycle", "text": "Pre-launch: shaping the scientific environment and building disease awareness. Launch: education and scientific exchange on new evidence. Post-launch: generating RWE and managing the product lifecycle. Loss of exclusivity: sustaining differential clinical value versus generics/biosimilars."}, {"title": "Patient centricity and health value", "text": "Medical Affairs translates trial results into tangible impact for the patient and the healthcare system (fewer hospitalizations, quality of life, disease burden), not only into product attributes."}, {"title": "Medical Affairs as a translator between science, clinical practice and strategy", "text": "It converts complex statistical findings into practical, actionable implications for clinicians, access decision-makers and internal teams, preserving scientific rigor without oversimplifying."}, {"title": "The role of Medical Excellence", "text": "A function that standardizes processes, controls the quality of insights, ensures compliance in interactions, and designs ongoing scientific training for the medical field team."}, {"title": "How the impact of Medical Affairs is measured", "text": "Qualitative KPIs: quality and actionability of insights, KOL perception and satisfaction, depth of scientific exchange. Quantitative KPIs: number of meaningful interactions, studies generated, publications supported, evidence gaps closed."}], "examples": ["Differentiate a medical action (exploring a specialist's perception of an endpoint) from a promotional action (persuading someone to prescribe a product).", "Design a medical value proposition for a vaccine, a biologic or an oncology treatment, based on unmet need, differential evidence and clinically relevant outcomes.", "Explain to a commercial team, in an alignment session, what Medical can and cannot do: it can share unsolicited evidence within compliance and explore clinical practice; it cannot negotiate commercial terms or take part in sales messaging."], "caseTitle": "Launching a vaccine for older adults", "caseText": "A company is launching a new vaccine for older adults. Before launch, Medical Affairs must map the immunosenescence landscape, identify relevant KOLs and scientific societies, and build disease awareness about the burden of the condition. During launch, it must execute scientific exchange on the mechanism of action and pivotal data, train the field team, and set up a system to capture insights on vaccination barriers. After launch, it must generate RWE on real-world effectiveness, support publications, and feed the following year's Medical Plan with the evidence gaps identified in the field.", "resources": {"framework": "Medical Value Framework (Pre-launch / Peri-launch / Post-launch) — maps what Medical Affairs contributes at each stage of the product lifecycle.", "checklist": ["Does the activity respond to an unsolicited or organically arising scientific need?", "Is it disconnected from any sales objective?", "Does it generate or translate real-world evidence?", "Is it traceable and documentable within the compliance system?", "Does it add value for the patient or the healthcare system, not just the product?"], "prompt": "Act as a Director of Medical Affairs. Given this product and lifecycle stage [describe], define 3 strategic medical priorities and the differential value Medical Affairs must bring versus Commercial and Market Access.", "template": "Medical Value Canvas: Lifecycle stage → Medical objective → Key stakeholder → Available evidence → Evidence gap → Medical activity → Impact KPI.", "glossary": [{"term": "Medical Affairs", "def": "A non-promotional scientific function that generates and communicates evidence."}, {"term": "Scientific Exchange", "def": "A two-way scientific dialogue with a healthcare professional."}, {"term": "Non-promotional", "def": "An activity with no sales intent or message."}, {"term": "Cross-functional alignment", "def": "Coordination between Medical, Commercial, Market Access and R&D while respecting distinct mandates."}]}, "quiz": [{"q": "A sales representative asks the MSL to 'convince' a skeptical physician to prescribe the product using clinical data. What is the correct MSL response?", "options": ["Agree, since the data is real and objective", "Explain that Medical can share scientific evidence in a non-directed way, but cannot have a persuasion objective aimed at sales", "Delegate the conversation to the Medical Manager without explaining why", "Join the representative on the visit to reinforce the commercial message"], "correct": 1, "explain": "Medical Affairs' mandate is scientific and non-promotional; sharing evidence is fine, but the objective can never be to persuade someone to sell."}, {"q": "Which of the following most precisely describes the difference between Market Access and Medical Affairs?", "options": ["Market Access runs clinical trials and Medical Affairs publishes them", "Market Access negotiates value and price with payers; Medical Affairs generates and communicates scientific evidence without negotiating commercial terms", "Both have the same mandate but a different boss", "Medical Affairs only works with patients and Market Access only with physicians"], "correct": 1, "explain": "Market Access translates evidence into an access and pricing argument; Medical Affairs generates and communicates the evidence independently."}, {"q": "A company is about to launch an oncology drug. Which activity is most typical of the pre-launch phase for Medical Affairs?", "options": ["Negotiating the reimbursement price", "Mapping the scientific landscape, identifying evidence gaps and building disease awareness", "Training the sales force on commercial objection handling", "Publishing the post-marketing RWE study"], "correct": 1, "explain": "Pre-launch focuses on scientific shaping: mapping evidence, KOLs and gaps before the product is available."}, {"q": "What is the best way to measure the qualitative impact of Medical Affairs?", "options": ["The number of visits made by the commercial team", "Sales volume", "The quality and actionability of the insights generated, together with the depth of scientific exchange", "The number of emails sent to HCPs"], "correct": 2, "explain": "Qualitative impact focuses on the quality of scientific exchange and the strategic usefulness of insights, not on commercial metrics."}, {"q": "A Medical Manager must explain to a Market Access team why Medical Affairs cannot take part in price negotiations. What is the strongest argument?", "options": ["Because Medical Affairs has no training in health economics", "Because mixing the independent scientific function with commercial negotiation compromises the objectivity of the evidence generated", "Because it isn't their department, full stop", "Because the law explicitly forbids it in every country"], "correct": 1, "explain": "The separation protects the scientific credibility of Medical Affairs in the eyes of HCPs, payers and regulators."}, {"q": "What best represents the evolution of Medical Affairs in recent years?", "options": ["It has reduced its activity to focus only on pharmacovigilance", "It has moved from a reactive support function to a strategic partner that co-designs evidence and strategy from early stages", "It has absorbed the functions of Market Access", "It has become a purely administrative function"], "correct": 1, "explain": "The global trend is toward greater early strategic involvement, not toward a reduced role."}, {"q": "Which of these activities is NOT typical of Medical Excellence?", "options": ["Standardizing insight documentation processes", "Designing ongoing scientific training for the medical team", "Negotiating commercial bonuses for the sales team", "Ensuring compliance in interactions with HCPs"], "correct": 2, "explain": "Medical Excellence focuses on quality, process and medical compliance, not on commercial compensation."}, {"q": "During the loss-of-exclusivity phase of a product, what is the main focus of Medical Affairs?", "options": ["Stop all medical activity because the product is no longer a priority", "Sustain the original product's differential clinical value against generics/biosimilars using accumulated real-world evidence", "Start aggressive price negotiations", "Shift the entire budget to Commercial"], "correct": 1, "explain": "Medical Affairs should reinforce the accumulated differential clinical value (long-term safety, subpopulations, RWE) against cheaper alternatives."}, {"q": "A Director of Medical Affairs wants to demonstrate the scientific ROI of their team to senior leadership. Which combination of KPIs is most appropriate?", "options": ["Only the number of visits made", "Only quarterly sales growth", "Actionable insights generated, evidence gaps closed, quality of KOL relationships, and studies/publications supported", "Only commercial team satisfaction"], "correct": 2, "explain": "The value of Medical Affairs is demonstrated with scientific and relationship metrics, not direct commercial ones."}, {"q": "Which principle best summarizes 'patient centricity' as applied by Medical Affairs?", "options": ["Always prioritizing the lowest price for the patient", "Translating clinical results into real, measurable impact for the patient and the healthcare system, beyond the product's attributes", "Focusing exclusively on prescriber satisfaction", "Avoiding any discussion of adverse events with patients"], "correct": 1, "explain": "Patient centricity means connecting evidence to outcomes that genuinely matter to the patient and the system, not just to the product."}]}, {"num": 2, "title": "The Modern MSL Role", "objective": "Master the responsibilities, competencies and mindset of the modern MSL as a strategic medical partner in their territory.", "lessons": [{"title": "What a Medical Science Liaison actually does", "text": "Executes two-way scientific exchange with opinion leaders, captures medical insights, supports external research, and translates medical strategy into field action, always within compliance."}, {"title": "Difference between MSL, Medical Advisor and Medical Manager", "text": "The MSL operates in the field with HCPs; the Medical Advisor works internally, providing scientific support to marketing, market access and compliance; the Medical Manager leads the MSL team and connects territory strategy with the national Medical Plan."}, {"title": "Field medical excellence", "text": "A quality standard for field execution: rigorous preparation for every interaction, consistent CRM documentation, follow-up on commitments, and measuring the value generated, not just visit volume."}, {"title": "Territory ownership", "text": "The MSL manages their territory as if it were a small scientific business: mapping stakeholders, prioritizing by impact, setting quarterly medical objectives, and reporting results with strategic judgment."}, {"title": "Scientific exchange", "text": "The core of MSL activity: a two-way conversation where evidence is shared and real clinical practice, barriers and HCP perception are explored."}, {"title": "Internal cross-functional collaboration", "text": "The MSL is the link between the field and headquarters: feeding Market Access with access-related insights, Clinical Operations with potential investigators, and central Medical Affairs with evidence gaps."}, {"title": "Time management and prioritization", "text": "Applying criteria such as scientific impact, research potential and stakeholder strategic relevance to decide where to invest the MSL's limited time."}, {"title": "The MSL as strategic medical partner", "text": "A high-performing MSL is not a data messenger: they are a trusted scientific advisor who anticipates needs and connects science to real clinical decisions."}], "examples": ["Plan a working week as an MSL: blocks for scientific preparation, prioritized visits, CRM documentation, and dedicated time for insight analysis.", "Define medical objectives per territory (e.g. close 3 evidence gaps on a patient subgroup, establish 2 new relationships with rising stars).", "Prioritize KOL visits based on scientific impact (publications, leadership in scientific societies, influence on guidelines) rather than prescription volume alone."], "caseTitle": "Prioritizing 40 potential KOLs in vaccines", "caseText": "You are a vaccines MSL with 40 potential KOLs in your territory. To prioritize the 10 key KOLs, cross three axes: scientific impact (publications, role in clinical guidelines, congress presentations), institutional impact (leadership in departments, vaccination committees) and relational/digital impact (influence in scientific societies, presence in professional networks). The 10 selected KOLs should cover a diverse mix of profiles: some established KOLs for scientific validation, some 'rising stars' for long-term relationship building, and some clinical champions with high real-world patient volume for practice-based insights.", "resources": {"framework": "Territory Impact Matrix — crosses scientific impact against relationship potential to prioritize where the MSL invests time.", "checklist": ["Have I defined quarterly medical objectives per territory?", "Does my agenda reflect impact priorities and not just geographic convenience?", "Do I document every interaction with enough quality to generate an insight?", "Am I actively collaborating with Market Access and Clinical Operations?", "Do I review monthly the balance between new relationships and deepened relationships?"], "prompt": "Act as a Medical Manager. Using this list of HCPs and their attributes [paste data], help me build a territory prioritization matrix based on scientific, institutional and relational impact criteria.", "template": "Weekly MSL Planner: Day → Interaction objective → Stakeholder → Scientific preparation required → Expected insight → Post-visit follow-up.", "glossary": [{"term": "MSL", "def": "Medical Science Liaison, a non-promotional scientific field role."}, {"term": "Territory ownership", "def": "Strategic, proactive management of a territory as a scientific business unit."}, {"term": "Field medical excellence", "def": "A quality and consistency standard for field execution."}, {"term": "Strategic medical partner", "def": "An MSL who anticipates scientific needs and adds value beyond the individual transaction."}]}, "quiz": [{"q": "A new MSL spends most of their time visiting the most geographically convenient physicians rather than the highest-impact ones. What is the main problem?", "options": ["There is no problem — geographic efficiency matters most", "They are prioritizing convenience over impact, which reduces the strategic value of their territory", "They should visit only the most famous KOLs, regardless of anything else", "They should stop visiting altogether and focus only on email"], "correct": 1, "explain": "Territory ownership requires prioritizing by impact and strategic potential, not by logistical convenience."}, {"q": "What is the key difference between an MSL and a Medical Advisor?", "options": ["The Medical Advisor earns more money", "The MSL operates in the field with external HCPs; the Medical Advisor provides internal scientific support to other functions", "There is no real difference, they are synonyms", "The Medical Advisor only works in oncology"], "correct": 1, "explain": "The MSL is a field-facing function; the Medical Advisor is an internal, cross-functional scientific support role."}, {"q": "During a visit, an HCP shares a relevant observation about adverse events not described in the literature. What should the MSL do immediately afterward?", "options": ["Ignore it because it's not part of their visit script", "Document it precisely in the appropriate system and trigger the pharmacovigilance process if applicable", "Promise the HCP that the product will be withdrawn from the market", "Mention it informally without recording it"], "correct": 1, "explain": "Any safety signal must be formally documented and follow the pharmacovigilance process, not remain merely an informal insight."}, {"q": "What best characterizes 'field medical excellence'?", "options": ["Maximizing the absolute number of monthly visits", "Rigorous preparation, consistent documentation and measuring the value generated in each interaction, not just volume", "Visiting the same 5 KOLs every time", "Avoiding CRM use to save time"], "correct": 1, "explain": "Field excellence is measured by quality and consistency, not by raw activity volume."}, {"q": "An MSL notices that several HCPs in their territory mention the same access barrier. What is the most strategic action?", "options": ["Resolve it themselves by negotiating with the hospital", "Document the pattern as an insight and share it with Market Access and central Medical Affairs for analysis and action", "Do nothing, since it isn't their role", "Communicate it only to the commercial team"], "correct": 1, "explain": "The MSL is the link between field and headquarters: their role is to identify and channel the pattern to whoever can act on it."}, {"q": "Which of these is a well-formulated territory medical objective?", "options": ["'Visit more physicians than last quarter'", "'Close 3 evidence gaps on a patient subgroup and establish 2 new relationships with rising stars'", "'Be the friendliest MSL in the region'", "'Send as many emails as possible'"], "correct": 1, "explain": "A good medical objective is specific and tied to evidence and strategic relationships, not to activity volume."}, {"q": "What role does the Medical Manager play in relation to the MSL team?", "options": ["Only oversees travel expenses", "Leads the MSL team and connects territory strategy with the national Medical Plan", "Replaces MSLs on the most important visits", "Has no direct relationship with medical strategy"], "correct": 1, "explain": "The Medical Manager aligns the territorial execution of MSLs with overall medical strategy."}, {"q": "An MSL with a packed schedule must choose between a meeting with an established KOL or a 'rising star' with high future publication potential. Which criterion best reflects advanced territory ownership?", "options": ["Always choose the most well-known KOL", "Evaluate mid-term strategic impact, not just current relevance, and consider diversifying the relationship portfolio", "Choose at random to save decision time", "Cancel both meetings and focus on administrative tasks"], "correct": 1, "explain": "Strategic territory management balances established relationships with investment in high future-potential ones."}, {"q": "Which statement best describes the 'MSL as strategic medical partner'?", "options": ["Simply someone who delivers technical information on request", "A trusted scientific advisor who anticipates needs and connects science to real clinical decisions", "An administrative role supporting sales", "A temporary position before moving into sales"], "correct": 1, "explain": "The strategic level of the MSL role implies anticipation and added value, not just reactive response."}, {"q": "What practice improves time management for a high-performing MSL?", "options": ["Improvising the agenda every morning with no criteria", "Applying scientific impact, research potential and strategic relevance criteria to decide where to invest limited time", "Accepting every meeting proposed without any filter", "Delegating all planning to the commercial team"], "correct": 1, "explain": "Impact-based prioritization is the key to effective management of an MSL's limited time."}]}, {"num": 3, "title": "KOL Mapping, Segmentation & Engagement", "objective": "Learn to identify, segment, prioritize and build sustainable scientific relationships with KOLs and DOLs.", "lessons": [{"title": "What a KOL is", "text": "A healthcare professional with recognized influence over clinical practice, research or health policy in their therapeutic area, beyond the volume of patients they treat."}, {"title": "What a DOL is", "text": "Digital Opinion Leader: a professional whose scientific influence is exercised mainly through digital channels (professional networks, webinars, online publications), complementary to or distinct from the traditional KOL."}, {"title": "Differences between KOL, rising star, clinical champion and scientific influencer", "text": "Established KOL: recognized, established influence. Rising star: high future potential, still building their reputation. Clinical champion: high volume of real-world practice, strong local influence. Scientific influencer: influence amplified through digital channels."}, {"title": "Segmentation criteria", "text": "Combining scientific impact (publications, guidelines), institutional impact (positions, committees), relational impact (network of influence) and digital impact (online presence and reach)."}, {"title": "Advanced KOL mapping", "text": "A systematic process of identifying and classifying all relevant actors in a therapeutic area within the territory, updated periodically rather than based solely on historical prescriber lists."}, {"title": "KOL engagement plan", "text": "A living document per KOL that defines the relationship objective, contact cadence, appropriate type of scientific exchange, and expected mutual value over 12 months."}, {"title": "Share of scientific voice", "text": "The proportion of a company's scientific presence and influence versus competitors within the scientific conversation of a therapeutic area, measured by quality of interaction, not spend volume."}, {"title": "Longitudinal, value-based relationships", "text": "Building long-term trust through consistent scientific value, not through one-off transactions tied to events or launches."}], "examples": ["Build a KOL prioritization matrix crossing scientific impact against relational/institutional impact to decide time-investment quadrants.", "Differentiate scientific influence (high-impact publications), clinical influence (volume and quality of practice), digital influence (reach on professional networks) and institutional influence (positions and committees).", "Design an engagement strategy for a skeptical KOL: rebuild trust through objective evidence and active listening before proposing any collaboration."], "caseTitle": "Rebuilding trust with a high-impact KOL", "caseText": "A KOL with high scientific impact has a poor relationship with the company, possibly due to a previous negative experience (perceived commercial pressure or a broken commitment). The ethical strategy involves: first, an honest diagnosis of the source of distrust through an exploratory conversation with no hidden agenda; second, offering genuine, verifiable scientific value (access to relevant evidence, an invitation to a no-strings-attached scientific exchange); third, scrupulously honoring any commitment made, however small; fourth, allowing time — trust is rebuilt through demonstrated consistency across multiple contacts, not through a single gesture.", "resources": {"framework": "KOL Segmentation Matrix (Scientific Impact x Relational Impact) with 4 investment-strategy quadrants.", "checklist": ["Is the KOL map updated at least annually?", "Does it include rising stars and not only established KOLs?", "Does it consider the digital dimension (DOLs)?", "Does each priority KOL have a documented engagement plan?", "Do I measure the mutual value generated, not just the number of contacts?"], "prompt": "Act as a KOL mapping specialist. Based on this list of professionals and their attributes [paste data], classify them as established KOL, rising star, clinical champion or scientific influencer, and suggest a differentiated engagement strategy for each category.", "template": "KOL Engagement Plan: Name → Category → 12-month relationship objective → Contact cadence → Type of scientific exchange → Expected mutual value → Relationship risks.", "glossary": [{"term": "KOL", "def": "Key Opinion Leader, a professional with recognized influence in their field."}, {"term": "DOL", "def": "Digital Opinion Leader, influence exercised through digital channels."}, {"term": "Rising star", "def": "A professional with high future influence potential not yet consolidated."}, {"term": "Share of scientific voice", "def": "The relative weight of a company's scientific presence versus competitors."}]}, "quiz": [{"q": "What is the most precise definition of a KOL?", "options": ["Any physician who prescribes the product heavily", "A healthcare professional with recognized influence over clinical practice, research or health policy, beyond prescription volume", "A physician who works at a university hospital", "Any professional with an active LinkedIn profile"], "correct": 1, "explain": "A KOL is defined by real influence over practice or health policy, not simply by prescription volume."}, {"q": "A 'clinical champion' differs from an established KOL mainly in that...", "options": ["They have no influence at all", "Their influence comes mainly from a high volume of real-world clinical practice and local leadership, rather than internationally high-impact publications", "They only exist in the digital sphere", "They are always younger than the established KOL"], "correct": 1, "explain": "The clinical champion brings influence based on practical experience and local leadership, complementary to that of the academic KOL."}, {"q": "What dimension does the concept of DOL add to traditional KOL mapping?", "options": ["None, it's the same concept with a different name", "Scientific influence exercised through digital channels, which may not match traditional offline influence", "It only applies to professionals under 30", "It refers exclusively to automated bots"], "correct": 1, "explain": "The DOL concept extends mapping to digital influence, which can reveal relevant actors not visible in classic mapping."}, {"q": "In a KOL prioritization matrix, a professional with high scientific impact but a low current relationship with the company should...", "options": ["Be dismissed due to lack of relationship", "Be considered a mid-term time-investment priority to build a valuable relationship", "Only be contacted by the commercial team", "Be ignored until they reach out to the company themselves"], "correct": 1, "explain": "High impact combined with low relationship is precisely the highest-opportunity quadrant for relational investment."}, {"q": "What does 'share of scientific voice' correctly measure?", "options": ["The number of sales representatives in the territory", "The proportion of a company's quality scientific presence and influence versus competitors within the scientific conversation of the therapeutic area", "The marketing budget invested", "The number of medical visits made per month"], "correct": 1, "explain": "It focuses on the quality and influence of the scientific conversation, not on commercial inputs or spend."}, {"q": "A skeptical KOL refuses to meet because they felt commercial pressure from the company in the past. What is the recommended first ethical action?", "options": ["Keep insisting until they agree", "Hold an exploratory conversation with no hidden agenda to genuinely understand the source of the distrust", "Offer a financial incentive to restore the relationship", "Stop trying to contact them altogether"], "correct": 1, "explain": "Rebuilding trust starts with genuinely understanding the root of the problem, not with pressure or incentives."}, {"q": "What is a key component of a well-designed KOL engagement plan?", "options": ["Only the date of the next commercial visit", "A 12-month relationship objective, contact cadence, type of scientific exchange and expected mutual value", "The allowed gift budget", "The list of the KOL's competitors"], "correct": 1, "explain": "The engagement plan must be a strategic document with objectives and mutual value, not just contact logistics."}, {"q": "Why is it a mistake to base KOL mapping solely on historical prescription volume?", "options": ["It isn't a mistake, it's the correct method", "Because it ignores key dimensions such as scientific, institutional and digital impact, excluding high future-influence actors", "Because prescription has no relationship to influence at all", "Because only young KOLs prescribe heavily"], "correct": 1, "explain": "Robust mapping must consider multiple axes of influence, not just historical prescription volume."}, {"q": "What characterizes a 'longitudinal, value-based relationship' with a KOL?", "options": ["Intensive contact only around congresses and launches", "Consistent scientific value delivered over time, building trust beyond one-off events", "A single formal annual contact", "A relationship managed exclusively by the commercial team"], "correct": 1, "explain": "A value-based relationship is built through sustained consistency, not transactional spikes."}, {"q": "What type of engagement strategy should a 'rising star' identified in KOL mapping receive?", "options": ["None, until they become established on their own", "Early relationship investment and joint development, anticipating their future consolidation as a reference", "Only standard commercial contact", "Exclusion from mapping until they publish in high-impact journals"], "correct": 1, "explain": "Identifying and developing rising stars early is key to a sustainable long-term KOL strategy."}]}, {"num": 4, "title": "Scientific Exchange & High-Impact Conversations", "objective": "Master high-value scientific conversations with healthcare professionals, grounded in genuine exploration rather than argumentation.", "lessons": [{"title": "What scientific exchange is", "text": "A two-way dialogue in which both parties share and explore scientific knowledge, distinct from one-directional information transmission."}, {"title": "Difference between informing, persuading, exploring and co-creating", "text": "Informing transmits data; persuading seeks to change a decision (commercial territory, not medical); exploring probes perception and real practice; co-creating jointly builds knowledge or evidence projects."}, {"title": "Exploratory questions", "text": "Open-ended questions that seek to understand the HCP's real clinical practice and their reasons, without steering toward a particular answer."}, {"title": "Reflective questions", "text": "Questions that invite the HCP to think out loud about the implications of evidence for their own practice, generating insight for both them and the MSL."}, {"title": "Strategic questions", "text": "Questions designed to connect the conversation with institutional priorities or unmet needs of the HCP, revealing opportunities for scientific collaboration."}, {"title": "Active listening", "text": "The ability to pick up on tone, doubts and what is left unsaid, in order to identify real barriers and not just surface-level objections."}, {"title": "Handling scientific objections", "text": "Responding to methodological or applicability concerns with rigor and honesty, acknowledging real limitations of the evidence rather than minimizing them."}, {"title": "Medical closing and follow-up", "text": "Closing the interaction with a clear, traceable commitment (sending information, connecting to a study, following up at the next contact), not a sales close."}], "examples": ["Questions to explore vaccination barriers: 'What doubts do your patients usually raise about this vaccine?' instead of 'Why don't you vaccinate more?'", "Questions to discuss evidence in clinical practice: 'How does this trial patient profile compare with the patients you typically see?'", "How to respond to a KOL who questions an endpoint: acknowledge the methodological limitation, contextualize its clinical relevance, and ask which endpoint they would consider more representative of their practice."], "caseTitle": "A department head doubts the clinical value of new evidence", "caseText": "A department head doubts the clinical value of a new piece of evidence, beyond its statistical significance. Rather than insisting on the study's talking points, the MSL designs a conversation built on questions: 'What would make this result clinically relevant for your patients?', 'What differences do you see between the study population and your own?', 'What additional evidence would you need to feel confident applying it?' This exploratory approach reveals the real barriers (for example, concern about unrepresented comorbidities) and generates an actionable insight for the evidence generation plan, instead of a sterile clash of arguments.", "resources": {"framework": "Exchange Ladder: Inform → Explore → Reflect → Co-create — a model of progressive conversational depth.", "checklist": ["Did I prepare at least 3 exploratory questions before the visit?", "Did I listen more than I spoke?", "Did I identify the real barrier behind the objection?", "Did I honestly acknowledge the evidence's limitations when relevant?", "Did I close with a clear, traceable commitment?"], "prompt": "Act as a scientific communication coach. Give me 8 high-level exploratory and reflective questions for a conversation with a skeptical specialist about [clinical topic], avoiding any persuasive or commercial tone.", "template": "Conversation Planner: Scientific objective → 3 exploratory questions → Anticipated objections → Evidence-based response → Closing commitment.", "glossary": [{"term": "Scientific exchange", "def": "A two-way dialogue exchanging scientific knowledge."}, {"term": "Exploratory question", "def": "An open-ended question that probes perception or practice without steering the answer."}, {"term": "Scientific objection", "def": "A methodological or clinical-applicability concern raised by an HCP."}, {"term": "Medical closing", "def": "Concluding the interaction with a traceable commitment, with no commercial intent."}]}, "quiz": [{"q": "During a visit, a KOL states that they don't change their clinical practice because 'the evidence doesn't reflect their real patients.' What is the best MSL response?", "options": ["Insist on the pivotal trial results", "Explain that clinical trials are always sufficient", "Explore what differences they perceive between the trial population and their clinical practice", "Redirect the conversation to the commercial team"], "correct": 2, "explain": "The best response is to explore the KOL's perception and understand the gap between evidence and practice, which can generate an actionable medical insight."}, {"q": "What is the essential difference between 'exploring' and 'persuading' in scientific exchange?", "options": ["They are synonyms in the medical context", "Exploring seeks to understand real practice without steering the answer; persuading seeks to change a decision, which is not the MSL's role", "Exploring is faster than persuading", "Persuading is only used with patients, not HCPs"], "correct": 1, "explain": "The MSL must explore, not persuade; persuasion belongs to the commercial domain, not the scientific one."}, {"q": "Which type of question generates the greatest value for detecting a medical insight?", "options": ["'Are you satisfied with our product?'", "'What differences do you notice between the trial patients and the ones you see in daily practice?'", "'How many units do you prescribe per month?'", "'Would you like to receive more promotional material?'"], "correct": 1, "explain": "Reflective questions about the real applicability of evidence generate higher-quality, more actionable insights."}, {"q": "An HCP questions the validity of a secondary endpoint of the study. What is the most appropriate MSL response?", "options": ["Deny that the study has any limitations", "Acknowledge the methodological limitation, contextualize its clinical relevance, and ask which endpoint they would consider more representative", "Change the subject immediately", "Say that question should be directed to the marketing department"], "correct": 1, "explain": "Scientific honesty and exploring the HCP's perspective are key to handling scientific objections."}, {"q": "What characterizes a good 'medical closing' of an interaction?", "options": ["Asking the HCP to prescribe more of the product", "Establishing a clear, traceable commitment, such as sending additional information or following up at the next contact", "Ending the conversation with no follow-up at all", "Promising discounts or incentives"], "correct": 1, "explain": "Medical closing is based on traceable scientific commitments, not sales objectives."}, {"q": "Active listening in scientific exchange mainly involves...", "options": ["Repeating literally what the HCP says, nothing more", "Picking up on tone, doubts and what is left unsaid to identify real barriers beyond surface-level objections", "Taking notes without looking at the other person", "Interrupting to correct any inaccuracy immediately"], "correct": 1, "explain": "Active listening goes beyond explicit content, picking up on nuance and underlying barriers."}, {"q": "Which of the following is NOT a stage of the conversational progression model (Exchange Ladder)?", "options": ["Inform", "Explore", "Negotiate price", "Co-create"], "correct": 2, "explain": "Negotiating price is not part of scientific exchange; it belongs to Market Access/Commercial."}, {"q": "An MSL is preparing questions to explore vaccination barriers in older adults. What is the best formulation?", "options": ["'Why don't you vaccinate your patients more?'", "'What doubts do your patients usually raise about this vaccine?'", "'Do you know this vaccine is effective?'", "'When will you start recommending this vaccine more?'"], "correct": 1, "explain": "The open, non-accusatory question invites genuine sharing about perceived barriers without triggering defensiveness."}, {"q": "What distinguishes 'co-creation' from simple 'exploration' in scientific exchange?", "options": ["There is no real difference", "Co-creation involves jointly building knowledge or an evidence project, beyond simply probing perceptions", "Co-creation is exclusive to principal investigators", "Exploration always precedes persuasion"], "correct": 1, "explain": "Co-creation is the most advanced level of exchange, involving active collaboration in generating knowledge."}, {"q": "Why are strategic questions valuable in a high-impact conversation?", "options": ["Because they allow faster sales closing", "Because they connect the conversation with institutional priorities or unmet needs, revealing genuine collaboration opportunities", "Because they replace the need for prior preparation", "Because they avoid having to listen to the HCP"], "correct": 1, "explain": "Strategic questions connect the dialogue with the HCP's institutional context, opening real opportunities for collaboration."}]}, {"num": 5, "title": "Medical Insights Excellence", "objective": "Learn to identify, capture, analyze and transform medical insights into actionable strategic decisions.", "lessons": [{"title": "What a medical insight is", "text": "A strategic interpretation of a field observation that reveals a need, barrier or perception that isn't obvious, with the potential to generate a concrete action."}, {"title": "What is NOT an insight", "text": "An isolated opinion with no pattern, raw data with no interpretation, or a complaint with no context do not constitute an actionable medical insight."}, {"title": "Difference between data, observation, insight and implication", "text": "Data: an isolated fact. Observation: data placed in field context. Insight: a strategic interpretation of the observation. Implication: the business or medical consequence derived from the insight."}, {"title": "How to capture insights during a visit", "text": "Listen actively, take structured notes immediately after the interaction, and distinguish between what was said literally and the MSL's own interpretation."}, {"title": "How to write actionable insights", "text": "A clear format: objective observation + interpretation + implication + suggested action, avoiding vague language or generalities."}, {"title": "How to avoid bias", "text": "Cross-check the observation against multiple sources, avoid confirming prior hypotheses, and separate the MSL's personal opinion from field evidence."}, {"title": "How to share insights internally", "text": "Use the insight-capture system consistently (CRM/Veeva), classify by category, and route to the internal function able to act on it."}, {"title": "How to turn insights into strategy", "text": "Aggregate recurring insights into patterns, prioritize them by frequency and impact, and feed them into the Medical Plan and the evidence generation plan."}], "examples": ["Turn a KOL's statement ('my older patients don't tolerate the current regimen well') into an insight: a possible adherence barrier in the geriatric subgroup, with the implication of exploring tolerability evidence in that subgroup.", "Classify insights by category: evidence (missing data in a subgroup), barriers (access, adherence), perception (distrust of an endpoint), clinical practice (a usage pattern different from expected) or unmet need.", "Create an insight report for the internal team, no more than one page: context, prioritized insight, source, observed frequency and recommended action."], "caseTitle": "From 15 congress comments to 5 strategic insights", "caseText": "After a congress, you collect 15 comments from KOLs on vaccination in older adults. The correct process is not to report all 15 literal comments, but to group them by thematic patterns: for example, 3 comments about doubts on efficacy in immunocompromised patients become an insight on 'evidence gap in the immunocompromised subpopulation'; 4 comments about logistical difficulties in administration become an insight on 'operational barrier in primary care centers.' From the 15 comments, 5 strategic insights are selected and written up, each with its business implication and an action recommendation directed to the relevant internal function (Medical, Market Access or Clinical Operations).", "resources": {"framework": "Insight Quality Framework: Observation → Interpretation → Implication → Action (OIIA).", "checklist": ["Is the observation clearly separated from the interpretation?", "Does the insight have a clear business or medical implication?", "Has it been cross-checked against more than one source?", "Is it free from confirmation bias?", "Does it include a concrete action recommendation?"], "prompt": "Act as a senior Medical Insights analyst. Convert these raw visit notes [paste notes] into structured insights using the format Observation → Insight → Implication → Action, classifying each by category (evidence, barrier, perception, clinical practice, unmet need).", "template": "Insight Report Template: Source → Objective observation → Insight → Implication → Recommended action → Responsible function → Priority (high/medium/low).", "glossary": [{"term": "Insight", "def": "A strategic interpretation of an observation with actionable potential."}, {"term": "Unmet need", "def": "A clinical need not covered by current treatment options."}, {"term": "Barrier", "def": "An identified obstacle that prevents optimal clinical practice."}, {"term": "Evidence gap", "def": "A lack of solid scientific evidence on a relevant clinical question."}]}, "quiz": [{"q": "An MSL notes: 'Dr. X said they aren't convinced by the product.' Why is this NOT a complete medical insight?", "options": ["Because it's too short", "Because it's an opinion with no interpretation or actionable implication, lacking context and pattern", "Because it should be written in Spanish", "Because insights can only come from congresses"], "correct": 1, "explain": "An insight requires strategic interpretation and a clear implication, not just an isolated opinion recorded verbatim."}, {"q": "What is the correct sequence of the Observation → Insight → Implication → Action framework?", "options": ["Action → Insight → Observation → Implication", "Objective field fact → strategic interpretation → business/medical consequence → concrete recommendation", "Implication → Action → Data → Insight", "There is no logical sequence, they are independent"], "correct": 1, "explain": "The OIIA framework follows this logical order: first the fact, then its interpretation, then its consequence, and finally the action."}, {"q": "What is an evidence gap?", "options": ["A programming error in the CRM", "A lack of solid scientific evidence on a relevant clinical question", "A lack of budget for congresses", "A communication failure between MSL and KOL"], "correct": 1, "explain": "An evidence gap is a real gap in the scientific knowledge available on a relevant clinical question."}, {"q": "An MSL receives a single negative comment from one HCP about tolerability. What is the correct attitude before reporting it as a strategic insight?", "options": ["Report it immediately as a market trend", "Cross-check it against other sources and look for a repeated pattern before elevating it as a relevant insight", "Ignore it entirely because it's just one person", "Modify it to sound more serious so it 'gets heard' at headquarters"], "correct": 1, "explain": "A single comment does not confirm a pattern; cross-checking against other sources avoids bias and false alarms."}, {"q": "Which of these categories is NOT a common classification of a medical insight?", "options": ["Barrier", "Perception", "Commercial discount", "Unmet need"], "correct": 2, "explain": "A commercial discount is not a medical insight category; it belongs to the commercial domain, not the scientific one."}, {"q": "Why is it important to share insights through a structured system (e.g. Veeva/CRM) rather than informally by email?", "options": ["Because it generates insights automatically with no effort", "Because it ensures traceability, consistency, and that the right internal function can act on them", "Because it's purely a matter of appearance", "Because email doesn't allow attachments"], "correct": 1, "explain": "A structured system ensures traceability, format consistency, and correct routing of the insight."}, {"q": "What is confirmation bias in insight capture?", "options": ["Confirming by email that information was received", "The tendency to interpret observations in a way that confirms the MSL's prior hypothesis, ignoring contrary evidence", "A type of statistical bias exclusive to clinical trials", "Confirming a KOL's attendance at a congress"], "correct": 1, "explain": "Confirmation bias distorts the objectivity of an insight by filtering only what confirms prior beliefs."}, {"q": "After a congress with 15 KOL comments, what is the correct approach for the internal report?", "options": ["Transcribe all 15 literal comments with no analysis", "Group them by thematic patterns and synthesize them into a small number of prioritized insights with implication and action", "Report only the most negative comment", "Choose the comment from the most famous KOL and ignore the rest"], "correct": 1, "explain": "The value lies in analytical synthesis by pattern, not in a literal transcription of individual comments."}, {"q": "What is the difference between 'data' and 'observation' in the insight process?", "options": ["They are identical terms", "Data is an isolated fact; an observation is that data placed in the context of the field situation", "An observation is always false and data is always true", "Data only exists in clinical trials"], "correct": 1, "explain": "An observation adds field context to the isolated data point, being the first step toward interpretation as an insight."}, {"q": "What element is essential for an insight to be considered truly 'actionable'?", "options": ["That it is written in complex technical language", "That it includes a concrete action recommendation directed to a responsible function", "That it comes exclusively from a top-tier KOL", "That it is reported within 24 hours without exception"], "correct": 1, "explain": "Actionability requires a clear recommendation and an identified responsible function, not just a description of the finding."}]}, {"num": 6, "title": "Evidence-Based Medicine for MSLs", "objective": "Master the critical interpretation of scientific evidence relevant to Medical Affairs practice.", "lessons": [{"title": "Hierarchy of evidence", "text": "From strongest to weakest, typically: systematic reviews/meta-analyses, randomized controlled trials, observational cohort studies, case-control studies, case series, and expert opinion."}, {"title": "Clinical trials", "text": "Studies with controlled (ideally randomized) allocation designed to minimize bias and establish causality between intervention and outcome, with strict inclusion/exclusion criteria."}, {"title": "Observational studies", "text": "Studies with no investigator-assigned intervention, reflecting real-world practice but with a higher risk of confounding factors."}, {"title": "RWE", "text": "Real-World Evidence: evidence generated from real clinical practice data (registries, electronic health records, administrative databases), complementary to controlled clinical trials."}, {"title": "Primary and secondary endpoints", "text": "The primary endpoint is the main variable answering the study's central question; secondary endpoints provide additional information but should not be used alone for definitive conclusions."}, {"title": "p-value and 95% CI", "text": "The p-value indicates the probability of observing a result as extreme or more extreme if the null hypothesis were true; the 95% confidence interval provides the range of plausible values for the true effect, and is more informative for clinical practice."}, {"title": "Relative risk, odds ratio and hazard ratio", "text": "RR and OR compare proportions or probabilities of an event between groups; the hazard ratio compares the rate of an event's occurrence over time, typical of survival studies."}, {"title": "NNT, NNH and clinical relevance", "text": "Number Needed to Treat/Harm: the number of patients who must be treated to achieve or avoid one event; it translates the statistical effect into practical clinical magnitude."}, {"title": "Forest plots", "text": "A graphical representation of individual study results and their combination in a meta-analysis, showing the effect and its confidence interval."}, {"title": "Limitations and biases", "text": "Identifying selection bias, confounding, publication bias and generalization limitations (external validity) before applying a result to clinical practice."}], "examples": ["Interpret a hazard ratio of 0.65 (95% CI 0.50-0.85): a 35% relative risk reduction for the event, with an interval that does not cross 1, indicating statistical significance and a consistent direction of effect.", "Explain a confidence interval to an HCP: the range of values where the true effect likely lies, with a narrower interval indicating a more precise estimate.", "Differentiate statistical significance from clinical relevance: a result can be statistically significant (p<0.05) yet have an effect size so small that it would not change real clinical practice.", "Analyze a Kaplan-Meier curve: compare the progressive separation between group curves over time as a visual indicator of a difference in survival or time-to-event."], "caseTitle": "Statistical significance vs. clinical relevance", "caseText": "A KOL says: 'the result is statistically significant, but I'm not sure it's clinically relevant.' The MSL's balanced response acknowledges the validity of the observation: statistical significance confirms that the observed effect is unlikely due to chance, but it doesn't inform on its practical magnitude. The MSL can then present the study's NNT, contextualize the effect size against the disease burden, and explore with the KOL what benefit threshold they would consider clinically meaningful for their patients, turning the objection into a high-value exploratory conversation.", "resources": {"framework": "Evidence Interpretation Ladder: Study design → Statistical significance → Effect magnitude (NNT) → Clinical relevance → Real-patient applicability.", "checklist": ["Have I identified the study design and its place in the evidence hierarchy?", "Do I distinguish the primary endpoint from the secondary ones?", "Have I reviewed the 95% CI in addition to the p-value?", "Have I calculated or located the NNT/NNH?", "Have I considered bias and generalization limitations?"], "prompt": "Act as a clinical epidemiologist. Analyze this study abstract [paste abstract] and identify: design, primary endpoint, effect magnitude (with 95% CI), NNT if calculable, and the 2 most relevant methodological limitations for an MSL.", "template": "Critical Appraisal One-Pager: Design → Population → Primary endpoint → Result (with 95% CI) → NNT → Limitations → Clinical implication.", "glossary": [{"term": "RWE", "def": "Real-World Evidence, evidence generated under real clinical practice conditions."}, {"term": "NNT", "def": "Number Needed to Treat, the number of patients to treat to achieve one additional beneficial outcome."}, {"term": "Hazard ratio", "def": "A measure comparing the rate of an event's occurrence between groups over time."}, {"term": "Forest plot", "def": "A chart visually summarizing individual study results and their meta-analysis."}]}, "quiz": [{"q": "An HCP notes that a result is 'statistically significant but maybe not clinically relevant.' What is the best MSL response?", "options": ["Insist that statistical significance already guarantees clinical relevance", "Acknowledge the distinction, present the NNT, and explore what magnitude of benefit the HCP would consider clinically relevant", "Change the subject because it's a difficult objection", "Say that analysis is only for the company's statisticians"], "correct": 1, "explain": "The balanced response acknowledges the difference and uses the NNT to translate the effect into practical clinical terms."}, {"q": "What does a narrower 95% confidence interval indicate compared to a wider one, for the same point estimate?", "options": ["Greater precision of the true effect estimate", "A smaller sample size in the study", "That the result is not valid", "That the study had no control group"], "correct": 0, "explain": "A narrower 95% CI generally reflects a more precise e
