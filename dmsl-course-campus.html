": "Which of these is a relevant bias to consider when evaluating a body of evidence?", "options": ["Publication bias, where studies with positive results are more likely to be published than negative ones", "Font-size bias in the article", "Bias from the journal cover color", "Bias from the number of authors on the study"], "correct": 0, "explain": "Publication bias can distort the overall perception of available evidence on an intervention."}]}, {"num": 7, "title": "Clinical Research, RWE & Evidence Generation", "objective": "Understand how Medical Affairs actively contributes to scientific evidence generation beyond regulatory clinical development.", "lessons": [{"title": "Phases of clinical research", "text": "El desarrollo clínico de un fármaco no termina con la aprobación regulatoria: es un continuo que se extiende desde los primeros estudios en humanos hasta años después del lanzamiento comercial, y un MSL necesita entender ese continuo completo, no solo la fotografía de los ensayos pivotales que sustentaron la ficha técnica. Revisitar las fases desde la perspectiva de la generación de evidencia —más que desde la perspectiva regulatoria pura— es lo que permite a un MSL situar cualquier estudio nuevo dentro del ciclo de vida completo del producto.\n\nLa Fase I y la Fase II generan la evidencia inicial de seguridad, tolerabilidad y eficacia preliminar; son estudios pequeños, muy controlados, y su función primaria es reducir el riesgo antes de invertir en estudios más grandes. La Fase III genera la evidencia confirmatoria que sustenta la aprobación: son los estudios pivotales, con la potencia estadística necesaria para las variables primarias, y habitualmente los más citados en la comunicación médica inicial de un producto. Pero es la Fase IIIb —estudios que se inician tras completar los pivotales pero antes o alrededor del lanzamiento, a menudo para explorar poblaciones adicionales, comparadores no incluidos en los pivotales, o variables secundarias de interés— y la Fase IV —estudios poscomercialización— las que generan buena parte de la evidencia con la que trabaja un MSL en su día a día, precisamente porque responden a las preguntas que emergen una vez el producto se usa en la práctica real.\n\nEste continuo no es lineal ni se detiene: la evidencia generada en Fase IV alimenta nuevas preguntas de investigación, que a su vez pueden dar lugar a nuevos estudios observacionales, análisis de subgrupos, estudios de extensión a largo plazo, o incluso ensayos clínicos adicionales para nuevas indicaciones. Entender este ciclo permite al MSL anticipar qué tipo de evidencia es razonable esperar en cada momento de la vida de un producto, y explicar con honestidad a un HCP por qué determinadas preguntas —por ejemplo, sobre subgrupos poco representados en los pivotales— todavía no tienen respuesta consolidada.\n\nAdemás de las fases clásicas, el MSL debe familiarizarse con diseños híbridos cada vez más frecuentes: los ensayos clínicos pragmáticos, que se ejecutan en condiciones más cercanas a la práctica real (criterios de inclusión más amplios, seguimiento en centros no especializados) mientras mantienen la aleatorización; y los ensayos adaptativos, que permiten modificar aspectos del diseño (dosis, tamaño muestral, criterios de inclusión) en función de los resultados intermedios, acelerando el desarrollo sin comprometer el rigor metodológico.\n\nPara el MSL, dominar este mapa completo del desarrollo clínico —y no solo los estudios pivotales— es lo que le permite ser percibido como un verdadero experto en el producto y en su área terapéutica, capaz de contextualizar cualquier publicación nueva dentro de la trayectoria completa de generación de evidencia, y no solo repetir los datos del último estudio publicado.", "sources": [{"label": "U.S. FDA — Step 3: Clinical Research (drug development process)", "url": "https://www.fda.gov/patients/drug-development-process/step-3-clinical-research"}, {"label": "Umbrex — MSL Support for Clinical Development and Evidence Plans", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/support-for-clinical-development-and-evidence-generation/"}, {"label": "National Cancer Institute — Clinical Trial Phases", "url": "https://www.cancer.gov/about-cancer/treatment/clinical-trials/what-are-trials/phases"}]}, {"title": "IIS", "text": "Un estudio iniciado por el investigador (Investigator-Initiated Study, IIS, también llamado Investigator-Sponsored Study, ISS) es una investigación diseñada, dirigida y patrocinada por un investigador o institución académica independiente —no por la compañía farmacéutica— que puede recibir de esa compañía apoyo en forma de financiación, medicación del estudio, o ambos, pero mantiene el control científico y editorial completo en manos del investigador. Es una de las fuentes de evidencia más valiosas para Medical Affairs, precisamente porque nace de una pregunta clínica genuina planteada por quien trata pacientes cada día.\n\nEl papel del MSL en este proceso se describe en la literatura especializada como el de interfaz científica, guía de proceso y gestor de la relación: el MSL actúa como el puente entre la realidad científica externa —lo que los investigadores observan y quieren investigar— y la agenda de evidencia interna de la compañía. Esto implica varias tareas concretas: identificar y comprender el interés genuino de un investigador en una pregunta de investigación; reconocer si esa pregunta responde a una necesidad de evidencia real y no cubierta; facilitar que el investigador conozca el proceso correcto para presentar una propuesta de IIS a través de los canales formales de la compañía; y llevar de vuelta a los equipos internos de evidencia y estrategia médica el conocimiento adquirido en el terreno sobre qué preguntas de investigación importan más a la comunidad científica.\n\nEs crucial que el MSL entienda —y comunique con total claridad— los límites éticos de su implicación. El MSL puede informar sobre el proceso, los criterios de elegibilidad y los plazos para presentar una propuesta de IIS, pero no puede influir en el diseño científico del estudio, no puede condicionar el apoyo a resultados favorables al producto, y no puede participar en decisiones comerciales relacionadas con médicos que sean, a la vez, prescriptores. Estas líneas separan a un MSL de una función comercial y son la base de la buena práctica científica exigida por los códigos de conducta de la industria (como el Código EFPIA en Europa) y por las políticas internas de gobernanza de las compañías.\n\nEl proceso típico de un IIS pasa por una solicitud formal del investigador, una revisión científica independiente por parte de un comité interno (habitualmente separado de las funciones comerciales), la evaluación de la relevancia científica, la viabilidad metodológica y el alineamiento con las áreas de interés de evidencia de la compañía, y finalmente la aprobación o denegación con criterios documentados y auditable.\n\nPara el MSL, apoyar bien un IIS es una de las contribuciones más tangibles que puede hacer a la generación de evidencia real: conecta preguntas clínicas genuinas con la capacidad de financiación y de producto de la compañía, siempre preservando la independencia científica del investigador, que es lo que da credibilidad y valor real al estudio resultante.", "sources": [{"label": "MSL Consultant — How to effectively manage investigator initiated research as a Medical Science Liaison", "url": "https://www.mslconsultant.com/post/how-to-effectively-manage-investigator-initiated-research-as-a-medical-science-liaison"}, {"label": "From Science to Pharma — MSL and Investigator-Initiated Studies", "url": "https://www.fromsciencetopharma.com/blog/msl-and-investigator-initiated-studies"}, {"label": "Umbrex — MSL Support for Clinical Development and Evidence Plans", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/support-for-clinical-development-and-evidence-generation/"}]}, {"title": "Observational studies", "text": "Más allá de conocer la teoría de los diseños observacionales, un MSL necesita entender cómo estos estudios se ejecutan realmente en la práctica y qué papel puede desempeñar apoyando su desarrollo, siempre dentro de los límites de la no promoción. Los estudios observacionales que un MSL encuentra habitualmente en el terreno se dividen en dos grandes categorías operativas: los patrocinados por la compañía (company-sponsored observational studies), diseñados internamente con objetivos de evidencia predefinidos y ejecutados por equipos de estudios clínicos o de HEOR (Health Economics and Outcomes Research); y los que surgen de colaboraciones académicas o de sociedades científicas, más cercanos en su gobernanza a un IIS pero con un componente observacional en lugar de intervencional.\n\nEn la práctica, estos estudios suelen apoyarse en fuentes de datos ya existentes —historias clínicas electrónicas, bases de datos administrativas de aseguradoras u hospitales, registros de enfermedad— o en la recogida prospectiva de datos adicionales sobre una cohorte de pacientes que ya está recibiendo un tratamiento en la práctica habitual, sin que el estudio modifique esa práctica clínica. Esta característica —no intervenir sobre el tratamiento del paciente— es precisamente lo que distingue metodológica y regulatoriamente a un estudio observacional de un ensayo clínico, y determina un marco ético y regulatorio distinto (por ejemplo, en la Unión Europea, los estudios observacionales no intervencionistas siguen un proceso de notificación distinto al de los ensayos clínicos regulados por el Reglamento de Ensayos Clínicos).\n\nUn MSL puede aportar valor real en varias etapas de un estudio observacional: durante el diseño, compartiendo con los equipos internos de evidencia las preguntas clínicas que realmente preocupan a los investigadores en el terreno; durante el reclutamiento, informando a los investigadores sobre estudios en marcha para los que puedan ser candidatos como centros participantes, siempre a través de los canales formales y no como una gestión comercial directa; y durante la difusión de resultados, ayudando a que los hallazgos lleguen a la comunidad científica relevante una vez publicados, con el contexto metodológico adecuado.\n\nUn reto habitual de los estudios observacionales, y algo que el MSL debe saber comunicar, es el tiempo que requieren: a diferencia de un ensayo clínico con un cronograma cerrado, un estudio observacional bien diseñado puede necesitar años de seguimiento para generar una cohorte suficientemente grande y con suficiente tiempo de exposición como para producir resultados robustos. Gestionar esa expectativa temporal con los HCP interesados en los resultados es también parte del rol del MSL.\n\nEn conjunto, los estudios observacionales bien ejecutados son el puente natural entre la evidencia controlada de los ensayos clínicos y la pregunta que más importa a un clínico: \"¿cómo se comporta esto en mis pacientes reales?\". El MSL que entiende su metodología y su proceso de ejecución está mejor preparado para explicar honestamente qué puede y qué no puede responder cada estudio en curso.", "sources": [{"label": "NCBI Bookshelf — Patient Registries: Registries for Evaluating Patient Outcomes, A User's Guide", "url": "https://www.ncbi.nlm.nih.gov/books/NBK562581/"}, {"label": "U.S. FDA — Real-World Evidence", "url": "https://www.fda.gov/science-research/science-and-research-special-topics/real-world-evidence"}, {"label": "Umbrex — MSL Support for Clinical Development and Evidence Plans", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/support-for-clinical-development-and-evidence-generation/"}]}, {"title": "Registries", "text": "Un registro de pacientes es, según la definición clásica adoptada por la Agency for Healthcare Research and Quality de Estados Unidos, un sistema organizado que utiliza métodos de estudio observacional para recopilar datos uniformes —clínicos y de otro tipo— con el fin de evaluar resultados especificados para una población definida por una enfermedad, condición o exposición concreta, y que sirve a un propósito científico, clínico o de política sanitaria predeterminado. Para un MSL, los registros son una de las herramientas de evidencia más ricas y, a la vez, más infrautilizadas en la conversación científica cotidiana.\n\nLos registros cumplen funciones que ningún otro diseño de estudio puede replicar con la misma amplitud: describir la historia natural y la diversidad fenotípica de una enfermedad, especialmente en patologías raras donde ningún centro individual ve suficientes pacientes para generar conocimiento robusto por sí solo; mejorar la definición de casos y las indicaciones de tratamiento; identificar estrategias de estratificación de riesgo y predicción temprana de la gravedad de la enfermedad; evaluar el impacto real de estrategias preventivas, diagnósticas y terapéuticas sobre la salud de los pacientes a largo plazo; e informar el desarrollo de guías clínicas y las decisiones de política sanitaria. En enfermedades raras en particular, los registros —muchas veces coordinados a escala europea o internacional— son considerados un instrumento clave de la medicina basada en la evidencia, porque permiten agrupar datos de múltiples países para alcanzar un tamaño de muestra que un solo país nunca lograría.\n\nMetodológicamente, los registros recogen datos retrospectivos y prospectivos que varían en el tiempo: exploraciones físicas, pruebas de laboratorio, tratamientos administrados y resultados clínicos, incluyendo cada vez con más frecuencia resultados reportados directamente por los pacientes (PROs) y medidas de calidad de vida. Esta naturaleza longitudinal es lo que permite que emerja información sobre la historia natural de una enfermedad —cómo evoluciona sin intervención, o bajo distintos patrones de tratamiento— que sería imposible obtener con un diseño transversal.\n\nPara un MSL, los registros ofrecen varias oportunidades concretas: son una fuente primaria para identificar gaps de evidencia genuinos (por ejemplo, \"¿qué proporción de pacientes con esta condición alcanza el objetivo terapéutico recomendado en la práctica real?\"); son un vehículo de colaboración con sociedades científicas y grupos de pacientes, que a menudo lideran o co-patrocinan registros de enfermedad; y son una fuente de datos que puede alimentar análisis secundarios de interés para publicaciones, presentaciones en congresos, o la construcción del Plan Médico del producto.\n\nConocer qué registros existen en el área terapéutica propia, quién los gestiona, qué variables recogen y cómo se puede acceder a análisis o colaboraciones es, por tanto, una competencia práctica que todo MSL debería desarrollar de forma activa, no reactiva.", "sources": [{"label": "NCBI Bookshelf — Patient Registries: Registries for Evaluating Patient Outcomes, A User's Guide", "url": "https://www.ncbi.nlm.nih.gov/books/NBK562581/"}, {"label": "PMC — Rare Disease Registries Are Key to Evidence-Based Personalized Medicine: Highlighting the European Experience", "url": "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8934440/"}, {"label": "Taylor & Francis — Real world data for rare diseases research: The beginner's guide to registries", "url": "https://www.tandfonline.com/doi/full/10.1080/21678707.2023.2241347"}]}, {"title": "Real-world evidence", "text": "Si en el módulo anterior la RWE se abordó como categoría de evidencia, aquí el foco es distinto: cómo se integra la RWE dentro de la estrategia médica de un producto, y qué papel juega el MSL en esa integración. La RWE ha dejado de ser un complemento opcional para convertirse en un componente central de los planes integrados de generación de evidencia (Integrated Evidence Generation Plans, IEGP) que muchas compañías farmacéuticas utilizan hoy para coordinar toda su actividad de investigación alrededor de un producto.\n\nUn IEGP bien construido combina, de forma coordinada y no aislada, varios elementos: estudios de Fase IIIb y IV, colaboraciones de investigación iniciada por el investigador, marcos de recogida de datos del mundo real, capacidades de registro, y estudios de resultados en salud y economía de la salud (HEOR). El objetivo de integrar todos estos elementos en un único plan es evitar la generación de evidencia dispersa y reactiva, y en su lugar construir de forma deliberada el cuerpo de evidencia que el producto necesitará a lo largo de su ciclo de vida: para sustentar decisiones de acceso y reembolso, para responder a las preguntas más frecuentes de los HCP, y para mantener la relevancia científica del producto años después de su aprobación inicial.\n\nEl papel del MSL en esta estrategia es el de fuente primaria de inteligencia científica del terreno. Los insights que un MSL recoge en sus interacciones con KOLs y clínicos —qué preguntas quedan sin responder, qué subgrupos de pacientes generan más incertidumbre clínica, qué comparadores le interesan realmente a la comunidad médica— son, según la literatura especializada en planificación de evidencia, un insumo directo para priorizar qué preguntas de investigación aborda el plan de evidencia, para refinar el diseño de futuros protocolos, y para dar forma a las estrategias de RWE y HEOR más alineadas con las necesidades reales de acceso y reembolso.\n\nEsto convierte al MSL en un actor bidireccional: no solo comunica la evidencia generada por la compañía hacia fuera, sino que canaliza hacia dentro las necesidades de evidencia identificadas en el terreno, alimentando directamente el ciclo de planificación estratégica. Esta función de \"traducción\" entre lo que el mercado científico necesita saber y lo que la organización puede investigar es, según los marcos de Medical Affairs más recientes, uno de los valores diferenciales más importantes de la función MSL dentro de la organización médica.\n\nPara que esta contribución sea efectiva, el MSL necesita procesos estructurados de captura y comunicación de insights (tratados en el módulo de Insights) y una relación de confianza con los equipos internos de evidencia, HEOR y acceso al mercado, de forma que la información fluya en ambas direcciones de manera sistemática y no anecdótica.", "sources": [{"label": "Medical Affairs Professional Society (MAPS) — Strategic Integrated Evidence Generation Planning", "url": "https://medicalaffairs.org/wp-content/uploads/2025/02/EVIDENCE-GENERATION-Standards-and-Guidance-2-11-2025.pdf"}, {"label": "THE MSL Journal — Integrated Evidence Generation Planning: Optimizing Strategy Through Medical Insights", "url": "https://themsljournal.com/article/integrated-evidence-generation-planning-optimizing-strategy-through-medical-insights/"}, {"label": "Umbrex — MSL Support for Clinical Development and Evidence Plans", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/support-for-clinical-development-and-evidence-generation/"}]}, {"title": "Evidence gaps", "text": "Un gap de evidencia es una pregunta clínica o científica relevante para la práctica médica —o para la toma de decisiones de pacientes, pagadores o reguladores— que la evidencia disponible actualmente no responde de forma satisfactoria. Identificar estos gaps de forma sistemática, y no solo intuitiva, es una de las contribuciones más estratégicas que un MSL puede hacer, porque conecta directamente el trabajo de campo con la planificación de investigación futura.\n\nLos gaps de evidencia pueden originarse en distintos niveles. Pueden ser gaps de población: los ensayos pivotales, por sus criterios de inclusión, a menudo excluyen a pacientes de edad avanzada, con múltiples comorbilidades, con insuficiencia renal o hepática, embarazadas, o pertenecientes a determinados grupos étnicos infrarrepresentados, dejando sin respuesta clara cómo se comporta el tratamiento en esos subgrupos que sí aparecen en la práctica clínica real. Pueden ser gaps comparativos: muchos ensayos pivotales se diseñan frente a placebo o frente a un comparador que ya no representa el estándar de cuidado actual, dejando sin respuesta directa la pregunta más práctica para un clínico, \"¿cómo se compara esto frente a la alternativa que uso hoy?\". Pueden ser gaps de resultado: ausencia de datos sobre resultados a muy largo plazo, sobre calidad de vida, sobre resultados reportados por el propio paciente, o sobre el impacto económico y de carga asistencial del tratamiento. Y pueden ser gaps de implementación: incertidumbre sobre cómo aplicar de forma óptima una intervención en la práctica real, más allá de si funciona en condiciones ideales.\n\nEl proceso para identificar gaps de evidencia de forma rigurosa combina varias fuentes: una revisión sistemática o de alcance (scoping review) de la literatura existente, que permite mapear qué preguntas ya tienen respuesta consolidada y cuáles no; el análisis de guías clínicas, que a menudo señalan explícitamente áreas de incertidumbre o recomendaciones basadas en consenso de expertos más que en evidencia de alta calidad; y, de forma crucial para el MSL, los insights recogidos directamente de la interacción con KOLs, clínicos e investigadores, que con frecuencia identifican gaps prácticos antes de que aparezcan formalizados en la literatura.\n\nUna vez identificado, un gap de evidencia no se traduce automáticamente en un nuevo estudio: debe evaluarse su relevancia clínica (¿a cuántos pacientes afecta y con qué impacto?), su viabilidad metodológica (¿es posible diseñar un estudio que lo responda con rigor?) y su alineamiento con la estrategia médica del producto. Este proceso de priorización es habitualmente responsabilidad conjunta de Medical Affairs, HEOR y los equipos de evidencia clínica, con el MSL aportando la perspectiva del terreno que valida —o matiza— la relevancia percibida de cada gap.\n\nUn MSL que documenta y comunica gaps de evidencia de forma estructurada, en lugar de mencionarlos de forma anecdótica, incrementa notablemente la probabilidad de que esos insights se traduzcan en estudios reales que, eventualmente, cierren esas mismas preguntas sin respuesta.", "sources": [{"label": "Medical Affairs Professional Society (MAPS) — Strategic Integrated Evidence Generation Planning", "url": "https://medicalaffairs.org/wp-content/uploads/2025/02/EVIDENCE-GENERATION-Standards-and-Guidance-2-11-2025.pdf"}, {"label": "THE MSL Journal — Integrated Evidence Generation Planning: Optimizing Strategy Through Medical Insights", "url": "https://themsljournal.com/article/integrated-evidence-generation-planning-optimizing-strategy-through-medical-insights/"}, {"label": "NCBI Bookshelf — Patient Registries: Registries for Evaluating Patient Outcomes, A User's Guide", "url": "https://www.ncbi.nlm.nih.gov/books/NBK562581/"}]}, {"title": "Evidence generation plan", "text": "Un plan de generación de evidencia es el documento estratégico que traduce las preguntas de investigación prioritarias de un producto —muchas de ellas identificadas como gaps de evidencia— en un conjunto coordinado de estudios y actividades, con objetivos, cronograma y responsables definidos. Es, en esencia, la hoja de ruta que asegura que la evidencia que se genera responde a una estrategia deliberada y no a iniciativas aisladas y descoordinadas.\n\nSegún los marcos de referencia de organizaciones como la Medical Affairs Professional Society (MAPS), un plan de generación de evidencia integrado combina distintos tipos de actividad de forma sinérgica: estudios clínicos de Fase IIIb y IV que amplían el conocimiento sobre el producto en poblaciones o comparadores no cubiertos por los pivotales; estudios iniciados por el investigador que responden a preguntas surgidas de la comunidad científica externa; iniciativas de recogida de datos del mundo real y colaboraciones con registros de enfermedad; y estudios de resultados en salud y economía de la salud que generan la evidencia necesaria para las decisiones de acceso y reembolso. La clave de un buen plan no es la cantidad de estudios, sino su coherencia: cada actividad debe estar justificada por una pregunta estratégica concreta, y el conjunto debe cubrir, de forma equilibrada, las necesidades de evidencia científica, de acceso al mercado y de práctica clínica.\n\nEl proceso de construcción de un plan de generación de evidencia sigue típicamente varias etapas: primero, la identificación y priorización de gaps de evidencia, con aportación directa del terreno a través de los insights del equipo de MSL; segundo, la definición de objetivos de evidencia específicos, medibles y con un horizonte temporal claro; tercero, el diseño metodológico de las actividades necesarias para cada objetivo, decidiendo qué tipo de estudio (intervencional, observacional, registro, análisis secundario de bases de datos) responde mejor a cada pregunta; y cuarto, la asignación de recursos, cronograma y gobernanza, incluyendo los comités de revisión científica que aprueban cada actividad.\n\nEl MSL participa en este proceso principalmente en dos momentos. En la fase de identificación de gaps y priorización, aportando la perspectiva sistematizada del terreno —lo que realmente preguntan y necesitan los KOLs y clínicos—. Y en la fase de ejecución y difusión, apoyando la relación con investigadores en estudios en marcha, y ayudando a que los resultados generados lleguen, una vez publicados, a la comunidad científica relevante a través de la comunicación científica no promocional.\n\nUn plan de generación de evidencia bien ejecutado tiene un efecto compuesto a lo largo del ciclo de vida del producto: cada estudio que responde a un gap real genera nueva evidencia, que a su vez puede revelar nuevas preguntas, alimentando un ciclo continuo de generación de conocimiento que mantiene al producto —y a la conversación científica de Medical Affairs sobre él— relevante y creíble mucho más allá del momento de su aprobación inicial.", "sources": [{"label": "Medical Affairs Professional Society (MAPS) — Strategic Integrated Evidence Generation Planning", "url": "https://medicalaffairs.org/wp-content/uploads/2025/02/EVIDENCE-GENERATION-Standards-and-Guidance-2-11-2025.pdf"}, {"label": "THE MSL Journal — Integrated Evidence Generation Planning: Optimizing Strategy Through Medical Insights", "url": "https://themsljournal.com/article/integrated-evidence-generation-planning-optimizing-strategy-through-medical-insights/"}, {"label": "Umbrex — MSL Support for Clinical Development and Evidence Plans", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/support-for-clinical-development-and-evidence-generation/"}]}, {"title": "The MSL's role in research", "text": "A lo largo de este módulo se ha descrito el papel del MSL en distintos tipos de actividad de investigación —estudios iniciados por el investigador, estudios observacionales, registros, planes de generación de evidencia—, pero conviene consolidar en una lección propia la función global del MSL dentro del ecosistema de investigación clínica, porque es una de las dimensiones del rol que con más frecuencia se malinterpreta, tanto dentro como fuera de la organización.\n\nEl MSL no diseña estudios, no analiza datos estadísticamente, y no toma decisiones sobre qué investigación financiar: esas son responsabilidades de los equipos de investigación clínica, biostadística y estrategia médica. Lo que el MSL sí hace, de forma insustituible, es actuar como el nodo de conexión entre la realidad científica del terreno y la maquinaria de generación de evidencia de la organización. Esta función se articula en cuatro capacidades concretas, consistentes con los marcos descritos por asociaciones profesionales como la MSL Society y publicaciones especializadas como THE MSL Journal.\n\nPrimero, la escucha científica activa: el MSL está en contacto directo y recurrente con investigadores, KOLs y clínicos que generan hipótesis, identifican problemas no resueltos y proponen ideas de investigación de forma continua; recoger esa información de manera sistemática es la primera capa del valor del MSL en investigación. Segundo, la orientación de proceso: cuando un investigador tiene una idea de estudio, el MSL le ayuda a navegar el proceso correcto para formalizarla —a través de canales de IIS, de colaboraciones de registro, o de propuestas a comités científicos internos— sin influir en el contenido científico de la propuesta. Tercero, la facilitación de la relación entre el investigador y los equipos internos correspondientes (investigación clínica, HEOR, asuntos regulatorios), asegurando que la comunicación fluya de forma eficiente y con la documentación adecuada. Cuarto, y quizá el más estratégico, el MSL alimenta la planificación de evidencia con inteligencia agregada del terreno, ayudando a que los planes de generación de evidencia respondan a necesidades reales y no solo a supuestos internos.\n\nUn modelo de responsabilidad compartida bien descrito en la literatura especializada es el que compara el rol del MSL con el del Clinical Research Associate (CRA) dentro del ecosistema de investigación: mientras el CRA garantiza la ejecución operativa y el cumplimiento normativo de los estudios en curso, el MSL aporta el contexto científico, la relación de confianza con el investigador, y la conexión estratégica entre esa investigación concreta y las prioridades médicas más amplias de la organización. Ambos roles son complementarios, no intercambiables.\n\nEntender con precisión estos límites y estas capacidades es lo que permite a un MSL contribuir de forma genuina a la investigación clínica sin cruzar nunca la línea hacia la influencia comercial o el diseño científico que no le corresponde, preservando así la integridad —y la credibilidad— de toda la función.", "sources": [{"label": "THE MSL Journal — MSL and CRA: A Responsibility Model for the Efficiency of Clinical Research and Clinical Trials", "url": "https://themsljournal.com/article/msl-and-cra-a-responsibility-model-for-the-efficiency-of-clinical-research-and-clinical-trials/"}, {"label": "MSL Consultant — How to effectively manage investigator initiated research as a Medical Science Liaison", "url": "https://www.mslconsultant.com/post/how-to-effectively-manage-investigator-initiated-research-as-a-medical-science-liaison"}, {"label": "Umbrex — MSL Support for Clinical Development and Evidence Plans", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/support-for-clinical-development-and-evidence-generation/"}]}, {"title": "Collaborating with investigators", "text": "La calidad de la colaboración entre un MSL y un investigador determina, en gran medida, tanto el éxito de los estudios en los que colaboran como la percepción de la compañía en la comunidad científica local. Esta colaboración no es un evento puntual, sino una relación que se construye de forma sostenida a lo largo del tiempo, con reglas claras que protegen tanto la independencia científica del investigador como la integridad ética del MSL.\n\nLa colaboración eficaz empieza por entender genuinamente la agenda de investigación del investigador: qué preguntas le interesan, en qué fase está su carrera científica, qué recursos tiene disponibles (tiempo, equipo, financiación, acceso a pacientes), y qué tipo de apoyo —metodológico, logístico, de financiación, de acceso a comparadores o medicación de estudio— podría realmente ayudarle a avanzar su investigación. Este conocimiento no se adquiere en una sola conversación, sino a través de una relación longitudinal de scientific exchange genuino, en la que el MSL demuestra interés real en la ciencia del investigador, no solo en el potencial de esa relación para los objetivos de la compañía.\n\nUna vez identificada una oportunidad de colaboración —típicamente a través de un IIS—, el MSL desempeña un papel de facilitador de proceso: explica con claridad los pasos formales para presentar una propuesta, los criterios que el comité de revisión científica utilizará para evaluarla, los plazos razonables de respuesta, y qué tipo de apoyo puede o no puede ofrecer la compañía. Es fundamental que el MSL comunique desde el principio que la aprobación de la propuesta dependerá de una evaluación científica independiente, y no de la relación personal entre el investigador y el MSL, para evitar expectativas desalineadas.\n\nDurante la ejecución del estudio, si es aprobado, el rol del MSL vuelve a ser de apoyo científico no intervencionista: puede facilitar el acceso a literatura relevante, a datos de contexto sobre el producto (siempre dentro de los canales aprobados), o a la conexión con otros investigadores trabajando en preguntas similares, pero no participa en el análisis de los datos ni en la interpretación de los resultados, que permanecen bajo control exclusivo del investigador.\n\nFinalmente, una colaboración bien gestionada no termina con la publicación del estudio: el MSL puede ayudar a que los resultados generados lleguen a la audiencia científica adecuada —a través de presentaciones en congresos, discusión no promocional en visitas médicas, o inclusión en el plan de publicaciones— siempre respetando la autoría y el mensaje científico que el propio investigador quiere transmitir sobre su trabajo.\n\nUna relación de colaboración así construida —basada en interés científico genuino, transparencia de proceso y respeto estricto de los límites éticos— es lo que convierte a un MSL en un socio de investigación valorado a largo plazo, y no en un simple gestor de trámites administrativos.", "sources": [{"label": "MSL Consultant — How to effectively manage investigator initiated research as a Medical Science Liaison", "url": "https://www.mslconsultant.com/post/how-to-effectively-manage-investigator-initiated-research-as-a-medical-science-liaison"}, {"label": "From Science to Pharma — MSL and Investigator-Initiated Studies", "url": "https://www.fromsciencetopharma.com/blog/msl-and-investigator-initiated-studies"}, {"label": "THE MSL Journal — MSL and CRA: A Responsibility Model for the Efficiency of Clinical Research and Clinical Trials", "url": "https://themsljournal.com/article/msl-and-cra-a-responsibility-model-for-the-efficiency-of-clinical-research-and-clinical-trials/"}]}, {"title": "Good scientific and ethical practice", "text": "La credibilidad de un MSL —y, por extensión, de toda la función de Medical Affairs— depende de un conjunto de principios éticos y de buena práctica científica que deben aplicarse de forma no negociable en toda actividad relacionada con investigación. Estos principios no son un añadido burocrático: son la base que distingue a Medical Affairs de una función comercial y lo que sostiene, a largo plazo, la confianza de la comunidad médica y científica.\n\nEl primer principio es la independencia científica del investigador. En cualquier colaboración de investigación —un IIS, un registro, un estudio observacional— el diseño, la ejecución, el análisis y la interpretación de los resultados deben permanecer bajo control del investigador o del equipo científico independiente, sin que la compañía patrocinadora condicione el resultado ni influya en las conclusiones que se publican, sean estas favorables o no al producto.\n\nEl segundo principio es la separación estricta entre la actividad científica y la actividad comercial. Esto se traduce en reglas operativas concretas: el apoyo a la investigación no debe estar vinculado, ni siquiera de forma implícita, al volumen de prescripción de un investigador; el MSL no debe compartir información sobre estudios de investigación con equipos comerciales de forma que pueda usarse con fines de venta; y las decisiones sobre qué propuestas de investigación aprobar deben tomarse a través de comités de revisión científica independientes de las funciones comerciales.\n\nEl tercer principio es la transparencia y el registro público. Todo ensayo clínico y, cada vez con mayor frecuencia, también los estudios observacionales relevantes, deben registrarse en plataformas públicas como ClinicalTrials.gov o el EU Clinical Trials Register antes de iniciar el reclutamiento, y sus resultados deben publicarse con independencia de si son favorables o desfavorables al producto estudiado —una práctica que combate directamente el sesgo de publicación descrito en el módulo anterior.\n\nEl cuarto principio es el respeto de los marcos regulatorios y de buena práctica clínica (Good Clinical Practice, GCP), un estándar internacional que rige el diseño ético, la conducción, el registro y la comunicación de los ensayos que involucran participantes humanos, garantizando la protección de sus derechos, su seguridad y su bienestar, así como la fiabilidad de los datos generados.\n\nEl quinto principio, más específico del día a día del MSL, es la gestión honesta de conflictos de interés: cualquier relación de colaboración, financiación o apoyo debe ser transparente y declarada, tanto por parte del investigador como de la compañía, en las publicaciones resultantes y ante los comités éticos correspondientes.\n\nInteriorizar y aplicar estos principios de forma constante —no solo cuando alguien supervisa— es lo que permite a un MSL construir, visita tras visita y estudio tras estudio, una reputación de integridad científica que ninguna otra estrategia de comunicación puede sustituir.", "sources": [{"label": "ICH — Good Clinical Practice (ICH E6) guideline", "url": "https://www.ich.org/page/efficacy-guidelines"}, {"label": "Medical Affairs Professional Society (MAPS) — Strategic Integrated Evidence Generation Planning", "url": "https://medicalaffairs.org/wp-content/uploads/2025/02/EVIDENCE-GENERATION-Standards-and-Guidance-2-11-2025.pdf"}, {"label": "MSL Consultant — How to effectively manage investigator initiated research as a Medical Science Liaison", "url": "https://www.mslconsultant.com/post/how-to-effectively-manage-investigator-initiated-research-as-a-medical-science-liaison"}]}], "examples": ["Identify an evidence gap: absence of effectiveness data for a treatment in patients with multiple comorbidities, detected through recurring field insights.", "Propose a well-formulated research question using the PICO framework (Population, Intervention, Comparator, Outcome).", "Assess whether a study idea is viable: scientific relevance, fit with prioritized evidence gaps, methodological feasibility, and absence of conflict with ongoing studies.", "Differentiate an IIS (led independently by the investigator, with company support) from a sponsored study (designed and controlled by the company)."], "caseTitle": "Evaluating an IIS proposal on vaccine effectiveness in adults over 75", "caseText": "An investigator proposes a study on vaccine effectiveness in adults over 75. The correct evaluation separates three dimensions: first, scientific quality of the idea (clear research question, methodologically sound design, recruitment feasibility); second, strategic fit (does it address a prioritized evidence gap in the Medical Plan? does it add value beyond what is already known?); third, process compliance (evaluation by an independent IIS committee, no link to commercial decisions, transparent and documented value transfer). Only if all three dimensions are positive should the study be recommended to proceed, always preserving the investigator's methodological independence.", "resources": {"framework": "Evidence Generation Priority Matrix: Clinical relevance of the gap x Study feasibility, to prioritize evidence-generation initiatives.", "checklist": ["Is the evidence gap documented with field insights or a literature review?", "Does the study proposal use a clear PICO framework?", "Has the investigator's methodological independence been assessed?", "Is the support disconnected from any commercial objective?", "Is there an independent committee evaluation process?"], "prompt": "Act as an Evidence Generation Director. Evaluate this study proposal [paste summary] across three dimensions: scientific quality, strategic fit with priority evidence gaps, and methodological feasibility. Provide a structured recommendation.", "template": "Evidence Gap Log: Identified gap → Source (insight/literature) → Clinical relevance → Recommended study type → Priority → Status.", "glossary": [{"term": "IIS", "def": "Investigator-Initiated Study, a study independently led by an external investigator."}, {"term": "Registry", "def": "A longitudinal database of patients with a specific condition or treatment."}, {"term": "Evidence generation plan", "def": "A strategic plan prioritizing what evidence to generate, how and when."}, {"term": "PICO", "def": "A framework for formulating research questions: Population, Intervention, Comparator, Outcome."}]}, "quiz": [{"q": "What is the essential feature that distinguishes an IIS from a company-sponsored study?", "options": ["An IIS never receives company funding", "An IIS is designed and led with scientific and methodological independence by the external investigator, even if it receives company support", "An IIS can only take place in Phase III", "An IIS does not require ethical approval"], "correct": 1, "explain": "The investigator's methodological independence is the key element that distinguishes an IIS from a sponsored study."}, {"q": "An investigator proposes a study that addresses no prioritized evidence gap and adds no relevant new knowledge. What is the most appropriate recommendation?", "options": ["Approve it automatically because the investigator is an important KOL", "Do not recommend it proceed, transparently explaining the scientific and strategic evaluation criteria used", "Approve it on condition the investigator increases their prescribing", "Ignore the proposal without responding"], "correct": 1, "explain": "The evaluation must be based on objective scientific and strategic criteria, communicated transparently to the investigator."}, {"q": "What role should the MSL play in evaluating an IIS?", "options": ["Design the study on the investigator's behalf", "Identify potential investigators and assess strategic and methodological fit, without directing or conditioning the investigator's independence", "Unilaterally decide on the study's approval", "Negotiate commercial discounts in exchange for the proposal"], "correct": 1, "explain": "The MSL facilitates the process while preserving the investigator's independence; formal decisions go through independent committees."}, {"q": "What is an 'evidence gap'?", "options": ["An error in the CRM database", "A relevant clinical question with no solid answer in the available scientific evidence", "The price difference between two treatments", "A recruitment failure in a clinical trial"], "correct": 1, "explain": "An evidence gap identifies relevant gaps in scientific knowledge for clinical practice."}, {"q": "What is a fundamental ethical good practice in relationships with external investigators?", "options": ["Conditioning study support on the investigator's prescription volume", "Keeping the study's scientific evaluation completely separate from any commercial consideration, with transparency in value transfer", "Always choosing the investigator who prescribes the most, with no scientific evaluation", "Avoiding documentation of the support provided to simplify the process"], "correct": 1, "explain": "Separating scientific evaluation from commercial considerations is a fundamental ethical pillar in relationships with investigators."}, {"q": "What do patient registries contribute to evidence generation?", "options": ["They are only useful for internal administrative purposes", "Longitudinal data on patients with a specific condition or treatment, useful for long-term evidence in large populations", "They completely replace Phase III clinical trials", "They are only useful in rare diseases"], "correct": 1, "explain": "Registries provide longitudinal follow-up in large, real populations, complementing other types of evidence."}, {"q": "What is the main purpose of an Evidence Generation Plan?", "options": ["Listing every study published in the literature", "Prioritizing which evidence gaps will be addressed, with what type of study, timeline and resources, aligned with the Medical Plan", "Replacing the product's marketing plan", "Setting the reimbursement price of the product"], "correct": 1, "explain": "The Evidence Generation Plan is the strategic roadmap for closing prioritized evidence gaps."}, {"q": "In the PICO framework for formulating a research question, what does the 'O' represent?", "options": ["Sponsoring organization", "Outcome, the result or endpoint of interest to measure", "Commercial objective of the study", "Responsible regulatory office"], "correct": 1, "explain": "PICO: Population, Intervention, Comparator, Outcome (the result of interest)."}, {"q": "What is the main difference between an observational study and a patient registry?", "options": ["There is no difference, they are synonyms", "An observational study usually has a research objective bounded in time; a registry is a continuous, longitudinal data infrastructure", "Registries never include safety data", "Observational studies are always randomized"], "correct": 1, "explain": "A registry is a continuous data-collection infrastructure, while an observational study usually has a defined design and time period."}, {"q": "Why is it important for Medical Affairs to identify evidence gaps from field insights and not only from the literature?", "options": ["Because the literature is never reliable", "Because field insights capture real needs and barriers of clinical practice that may not yet be reflected in publications", "Because field insights are cheaper to obtain", "Because scientific literature is forbidden in Medical Affairs"], "correct": 1, "explain": "Field insights provide a real-practice perspective that complements, and sometimes anticipates, what published literature reflects."}]}, {"num": 8, "title": "Congress Excellence", "objective": "Learn to prepare, execute and capitalize on scientific congresses from a Medical Affairs perspective, maximizing the scientific value obtained.", "lessons": [{"title": "Medical objectives of a congress", "text": "Un congreso científico no es un evento al que un MSL \"asiste\": es una operación médica con objetivos definidos de antemano, cuyo éxito se mide en resultados concretos, no en horas de presencia. Antes de reservar vuelos y agenda, un MSL excelente responde a una pregunta previa y no negociable: ¿qué queremos conseguir médicamente en este congreso, y cómo sabremos si lo hemos logrado?\n\nLos objetivos médicos de un congreso se agrupan típicamente en cuatro categorías. Primero, objetivos de inteligencia científica: identificar qué datos nuevos se van a presentar en el área terapéutica, qué tendencias emergen en el pensamiento clínico de los líderes de opinión, y qué preguntas de investigación están ganando relevancia en la comunidad. Segundo, objetivos de relación: fortalecer o iniciar relaciones con KOLs y DOLs prioritarios de la lista de mapeo de la organización, aprovechando que un congreso concentra en pocos días más interacciones cara a cara que meses de visitas individuales. Tercero, objetivos de generación de insights: capturar de forma sistemática lo que la comunidad médica piensa, necesita o cuestiona sobre el área terapéutica y el producto, información que alimentará directamente la estrategia médica. Cuarto, objetivos de difusión científica no promocional: asegurar que la evidencia generada por la compañía —posters, presentaciones orales, publicaciones asociadas— llegue con el contexto correcto a la audiencia relevante.\n\nDefinir estos objetivos antes del congreso, y no durante o después, cambia radicalmente la forma en que se planifica la asistencia. Permite priorizar qué sesiones son imprescindibles frente a las que son solo interesantes, decidir con qué KOLs concretos merece la pena programar una reunión formal frente a un encuentro informal en el pasillo, y establecer de antemano qué preguntas de insight se quieren explorar activamente en cada conversación, en lugar de limitarse a escuchar pasivamente lo que surja.\n\nEstos objetivos deben además estar alineados —no ser una iniciativa aislada del MSL individual— con el plan médico global del producto y con el plan de congresos anual del equipo de Medical Affairs, que a su vez conecta con el plan de generación de evidencia y con las prioridades de comunicación científica del ciclo de vida del producto en ese momento concreto. Un congreso en fase de prelanzamiento, por ejemplo, tendrá objetivos centrados en awareness científico y generación de insights sobre necesidades no cubiertas; un congreso años después del lanzamiento tendrá objetivos más centrados en discutir datos de práctica real y en explorar gaps de evidencia residuales.\n\nFinalmente, cada objetivo médico debe llevar asociado un indicador de éxito verificable: número de interacciones cualificadas con KOLs prioritarios, número de insights de calidad capturados y documentados, cobertura de las sesiones científicas clave, o número de conexiones iniciadas con investigadores potenciales para colaboraciones futuras. Sin esos indicadores, la evaluación posterior del congreso se reduce a una impresión subjetiva, en lugar de a una valoración objetiva del retorno médico obtenido.", "sources": [{"label": "Prezent — The ultimate guide to medical congresses", "url": "https://www.prezent.ai/blog/guide-to-medical-congresses"}, {"label": "Tika Mobile — Elevating Medical Congress Engagement: A Strategic Playbook for Medical Affairs Teams and MSLs", "url": "https://www.tikamobile.com/resources/blog/strategic-playbook-for-medical-affairs-teams-and-msls"}, {"label": "Medical Affairs Specialist — 16 Effective Ways for MSLs to Get the Most Out of Medical Congresses", "url": "https://medicalaffairsspecialist.org/blog/16-effective-ways-for-msls-to-get-the-most-out-of-medical-congresses"}]}, {"title": "Pre-congress preparation", "text": "La preparación previa a un congreso es, según la experiencia consolidada de la función MSL, el factor que más determina el valor obtenido durante el evento. La ventana de tiempo en un congreso es corta y las agendas de los KOLs se llenan con semanas de antelación, así que quien improvisa sobre el terreno llega sistemáticamente tarde a las oportunidades más valiosas.\n\nEl primer bloque de preparación es el mapeo de objetivos y personas: revisar la lista de KOLs y DOLs prioritarios del territorio propio que probablemente asistirán, identificar a quiénes de ellos se quiere ver de forma prioritaria, y comenzar a coordinar reuniones formales o informales con la suficiente antelación —las agendas de los ponentes y líderes científicos se completan rápido, y esperar a estar en el propio congreso para proponer un encuentro reduce drásticamente las probabilidades de conseguirlo—. Este trabajo se apoya en el sistema de CRM y mapeo de KOLs trabajado en el Módulo 3, que debería mantenerse actualizado durante todo el año, no solo antes de un congreso.\n\nEl segundo bloque es la inmersión en el contenido científico previo: revisar el programa completo del congreso, identificar sesiones plenarias, comunicaciones orales y pósters relevantes para el área terapéutica propia, y estudiar los abstracts publicados de antemano —muchos congresos los liberan con semanas de anticipación— para poder anticipar qué datos nuevos se presentarán y preparar preguntas o puntos de discusión informados en lugar de reaccionar improvisando in situ.\n\nEl tercer bloque es la alineación interna: participar en el briefing previo del equipo de Medical Affairs para asegurar que todo el equipo de campo —MSLs, y en su caso también personal de stand o de comunicación científica— transmite el mismo relato científico basado en los mismos datos y el mismo lenguaje aprobado, evitando mensajes inconsistentes entre distintos miembros del equipo que puedan confundir a la audiencia o dañar la credibilidad de la organización.\n\nEl cuarto bloque es la preparación logística y de materiales: asegurar el acceso a los materiales científicos aprobados que se puedan necesitar durante el congreso (respuestas a preguntas frecuentes, literatura de respaldo, presentaciones de referencia), revisar los procedimientos de compliance específicos del congreso (algunos tienen normas propias sobre interacción con HCPs, zonas de exhibición o registro de comidas y hospitalidad), y planificar la logística de desplazamiento entre sesiones para no perder tiempo valioso en un evento donde cada franja horaria compite con múltiples actividades simultáneas.\n\nUn MSL que llega a un congreso con esta preparación completa no solo aprovecha mejor su tiempo: transmite a cada KOL con el que se reúne la sensación de que la conversación ha sido pensada específicamente para él, lo cual, por sí solo, ya fortalece la relación científica.", "sources": [{"label": "Livestorm — How to Plan a Successful Medical Congress", "url": "https://livestorm.co/blog/plan-medical-congress"}, {"label": "Within3 — Best practices for medical congress planning", "url": "https://within3.com/infographics/medical-congress-planning-best-practices-checklist"}, {"label": "Tika Mobile — Checklist: How to Prepare for a Successful KOL Meeting as an MSL", "url": "https://www.tikamobile.com/resources/blog/successful-kol-meeting-preparation-checklist-msl"}]}, {"title": "KOL meetings", "text": "Una reunión con un KOL durante un congreso es, con frecuencia, la interacción de mayor densidad científica de todo el año con esa persona: concentra en 20 o 30 minutos una conversación que, en el terreno habitual, podría requerir varias visitas repartidas en meses. Aprovechar bien ese tiempo exige una preparación específica, distinta de la de una visita médica ordinaria.\n\nAntes de la reunión, el MSL debe definir con claridad el propósito específico de ese encuentro concreto: ¿es principalmente una reunión de exploración de insights sobre una nueva área de interés?, ¿es una oportunidad para presentar y discutir datos recientes del producto?, ¿es un primer contacto para evaluar el interés del KOL en una colaboración de investigación futura?, ¿es simplemente el mantenimiento de una relación longitudinal ya consolidada? Cada propósito exige una preparación distinta y una forma distinta de estructurar la conversación, siguiendo los principios de intercambio científico y preguntas estratégicas trabajados en el Módulo 4.\n\nDurante la reunión, el entorno del congreso impone su propia dinámica: las interrupciones son frecuentes, el tiempo es limitado y ambas partes suelen tener la agenda cargada con más compromisos el mismo día. Esto exige que el MSL sea capaz de ir directo a lo esencial sin perder la calidad del intercambio científico: abrir con una pregunta o comentario genuinamente relevante para el KOL (idealmente conectado con algo que él mismo haya presentado o publicado recientemente, si aplica), escuchar activamente, y dejar espacio deliberado para que el KOL comparta su perspectiva sin monopolizar el tiempo con el mensaje de la compañía.\n\nUn elemento distintivo de las reuniones en congreso es que ocurren en un contexto de alta densidad informativa: el propio KOL probablemente acaba de salir de una sesión con datos nuevos, o va camino de presentar los suyos, así que el MSL bien preparado puede conectar la conversación con lo que se está discutiendo en el congreso en ese mismo momento, lo cual demuestra estar genuinamente inmerso en la conversación científica del evento y no solo ejecutando una agenda prefijada de la compañía.\n\nDespués de cada reunión, y antes de que la memoria se diluya entre el resto de interacciones del día, el MSL debe documentar de inmediato —o lo antes posible— los puntos clave discutidos y, especialmente, cualquier insight relevante compartido por el KOL, siguiendo el marco de captura de insights ya trabajado en el Módulo 5. Dejar esta documentación para el final del congreso, cuando se han acumulado docenas de conversaciones, es la forma más segura de perder matices valiosos o de mezclar información entre distintos interlocutores.\n\nLas reuniones de congreso, bien preparadas y bien documentadas, son una de las oportunidades de mayor densidad estratégica de todo el calendario médico anual, y merecen un nivel de cuidado proporcional a esa importancia.", "sources": [{"label": "Definitive Healthcare — KOL Conference Engagement: Strategies", "url": "https://www.definitivehc.com/resources/how-to-guides/kol-engagement-conferences"}, {"label": "Tika Mobile — Checklist: How to Prepare for a Successful KOL Meeting as an MSL", "url": "https://www.tikamobile.com/resources/blog/successful-kol-meeting-preparation-checklist-msl"}, {"label": "THE MSL Journal — My Top 7 Tips for MSLs Attending Medical Conferences", "url": "https://themsljournal.com/article/my-top-7-tips-for-msls-attending-medical-conferences/"}]}, {"title": "Session tracking", "text": "Con decenas o incluso cientos de sesiones simultáneas en un congreso médico de gran tamaño, ningún MSL puede asistir a todo, y el seguimiento sistemático de sesiones (session tracking) es la disciplina que convierte esa limitación de tiempo en una cobertura estratégica, en lugar de en una asistencia aleatoria a lo que resulta más cómodo o más cercano.\n\nEl primer paso del session tracking es la priorización previa, construida sobre el trabajo de inmersión en el programa científico descrito en la lección de preparación previa: identificar, entre todas las sesiones disponibles, cuáles son de asistencia obligatoria (por ejemplo, cualquier presentación relacionada directamente con el propio producto o con el comparador principal, o con la ponencia de un KOL prioritario), cuáles son de alto valor pero no imprescindibles (sesiones sobre tendencias emergentes en el área terapéutica), y cuáles pueden cubrirse mediante el resumen de un compañero de equipo o a través de la publicación del abstract, sin necesidad de asistencia física.\n\nCuando el volumen de sesiones relevantes supera la capacidad de un único MSL —algo habitual en congresos grandes—, la buena práctica es coordinar la cobertura en equipo: repartir sesiones entre los distintos MSLs presentes, de forma que cada sesión clave tenga a alguien asignado para tomar notas estructuradas, y consolidar después esa información en un repositorio compartido, evitando duplicidades y lagunas de cobertura.\n\nDurante cada sesión, la toma de notas estructurada es lo que distingue el session tracking profesional de simplemente \"estar presente\". Un MSL eficaz no transcribe la presentación palabra por palabra, sino que captura de forma selectiva: el mensaje científico central de la ponencia, los datos concretos más relevantes (tamaño del efecto, población estudiada, comparador), cualquier limitación metodológica mencionada por el propio ponente o planteada durante el turno de preguntas, la reacción de la audiencia (preguntas críticas, silencio, interés visible), y cualquier implicación directa para el propio producto o área terapéutica —ya sea una oportunidad, una amenaza competitiva, o un gap de evidencia que la propia sesión pone de manifiesto—.\n\nLas herramientas modernas de inteligencia de congresos —desde aplicaciones específicas de captura estructurada hasta simples plantillas compartidas— facilitan que esta información se registre en tiempo real, con marca de tiempo y autor, y esté disponible de inmediato para el resto del equipo, en lugar de depender de la memoria o de notas dispersas que se consolidan días después, cuando buena parte del matiz ya se ha perdido.\n\nUn session tracking bien ejecutado transforma la asistencia a un congreso de una experiencia individual y anecdótica en una fuente de inteligencia científica colectiva, sistemática y accionable para toda la organización médica.", "sources": [{"label": "Sedulo Group — Medical Conference Intelligence: A Complete Guide to Pharmaceutical Conference Coverage", "url": "https://sedulogroup.com/blog-post/pharmaceutical-conference-coverage/"}, {"label": "Sorcero — Congress Intelligence for Medical Affairs, MSLs, and field teams", "url": "https://www.sorcero.com/solutions/congress-intelligence"}, {"label": "Tika Mobile — Conference Intelligence for Medical Affairs: Beyond Spreadsheets", "url": "https://www.tikamobile.com/resources/blog/onference-intelligence-for-medical-affairs"}]}, {"title": "Poster walks", "text": "La sesión de pósters es, para muchos MSLs, el terreno de mayor densidad científica de todo un congreso: cientos de investigadores presentan sus datos en un formato compacto y accesible, y a menudo el propio autor está de pie junto a su póster, disponible para una conversación directa que en otros formatos —como una comunicación oral— resulta imposible. Un poster walk bien organizado convierte esta oportunidad en una fuente estructurada de inteligencia científica y de contacto con investigadores emergentes.\n\nUn poster walk eficaz empieza, de nuevo, con la preparación: revisar de antemano el listado de pósters programados (habitualmente disponible en la app o el catálogo del congreso, y muchas veces con los abstracts ya publicados) e identificar cuáles son de interés prioritario según los criterios ya trabajados —relación con el producto propio o su comparador, autores que son KOLs o DOLs del mapeo de la organización, o temas relacionados con gaps de evidencia identificados previamente—. Recorrer 400 pósters sin ningún criterio de priorización es, en la práctica, equivalente a no revisar ninguno con verdadera profundidad.\n\nDurante el recorrido, la conversación con el autor de un póster tiene un valor distinto al de una reunión formal con un KOL consolidado: muchos autores de pósters son investigadores más jóvenes, clínicos en formación avanzada o científicos emergentes que están presentando quizá por primera vez sus datos ante una audiencia internacional, y a menudo estarán encantados de tener una conversación en profundidad sobre su metodología, sus hallazgos y sus planes futuros de investigación. Estas conversaciones son, con frecuencia, una fuente extraordinaria de identificación temprana de talento científico y de potenciales colaboradores para estudios futuros —conectando directamente con el trabajo de identificación de \"rising stars\" descrito en el Módulo 3—.\n\nEl poster walk exige también una escucha crítica: preguntar por el diseño del estudio, el tamaño muestral, las limitaciones reconocidas por el propio autor, y cómo interpreta él mismo la relevancia clínica de sus hallazgos, aplicando los mismos principios de pensamiento crítico sobre evidencia trabajados en el Módulo 6. Esta conversación in situ con el autor aporta con frecuencia matices que no aparecen en el abstract publicado, y que resultan muy valiosos para contextualizar después el hallazgo ante otros interlocutores.\n\nCada conversación relevante durante un poster walk debe documentarse con el mismo rigor que una reunión formal: quién es el autor, cuál es el mensaje científico central del póster, qué matices o limitaciones se discutieron, y si existe una oportunidad de seguimiento —ya sea de relación científica, de insight relevante para el plan médico, o de una futura colaboración de investigación—. Sin esa documentación inmediata, el valor de decenas de conversaciones valiosas se pierde en cuestión de días.", "sources": [{"label": "Prezent — Congress Communication in Pharma: Complete Guide", "url": "https://www.prezent.ai/blog/congress-communication"}, {"label": "Medical Affairs Specialist — 16 Effective Ways for MSLs to Get the Most Out of Medical Congresses", "url": "https://medicalaffairsspecialist.org/blog/16-effective-ways-for-msls-to-get-the-most-out-of-medical-congresses"}, {"label": "Within3 — Best practices for medical congress planning", "url": "https://within3.com/infographics/medical-congress-planning-best-practices-checklist"}]}, {"title": "Ethical competitor intelligence", "text": "Un congreso médico es también el escenario donde compiten, de forma abierta y pública, todas las compañías activas en un área terapéutica: presentaciones de competidores, stands, simposios satélite y conversaciones informales generan una cantidad enorme de información sobre el panorama competitivo. Un MSL recoge inevitablemente parte de esa información en su actividad normal, y la pregunta relevante no es si debe prestarle atención, sino cómo hacerlo de forma éticamente correcta.\n\nEl principio rector es sencillo de enunciar y exigente de aplicar: toda la información de inteligencia competitiva que un MSL puede recoger legítimamente en un congreso proviene de fuentes públicas y abiertas —presentaciones orales, pósters, simposios abiertos al público, materiales distribuidos libremente en stands, publicaciones y abstracts oficiales del congreso—. Nunca es aceptable obtener información mediante engaño, mediante la ocultación de la propia identidad o afiliación, mediante el acceso a materiales o sesiones restringidas sin autorización, o mediante la extracción de información confidencial de personal de un competidor bajo falsas pretensiones.\n\nEn la práctica, esto significa que un MSL puede —y en muchos equipos se espera que lo haga como parte de su cobertura de sesiones— tomar notas sobre lo que un competidor presenta en una comunicación oral pública, observar la reacción de la audiencia ante esos datos, y registrar el posicionamiento de mensaje que un stand competidor comunica abiertamente al público del congreso. Lo que no puede hacer es acudir a un simposio o sesión restringida haciéndose pasar por un HCP o por alguien sin afiliación a la industria, ni presionar al personal de un stand competidor —muchas veces profesionales de nivel júnior— para que revele información estratégica no publicada.\n\nLa información de inteligencia competitiva recogida de forma ética debe canalizarse a través de los procesos formales de la organización —típicamente un equipo o función dedicada a inteligencia competitiva (Competitive Intelligence, CI)— y no usarse de forma informal o directamente en conversaciones con HCPs de manera que pueda interpretarse como comunicación comparativa no autorizada, que en muchos mercados está sujeta a restricciones regulatorias y de compliance específicas.\n\nLos marcos de gobernanza actuales en Medical Affairs, apoyados cada vez más por herramientas digitales de captura estructurada, insisten en que esta actividad debe quedar documentada con trazabilidad —quién capturó la información, cuándo, de qué fuente pública—, lo cual no solo mejora la calidad del análisis competitivo agregado, sino que constituye también una salvaguarda de cumplimiento ante cualquier auditoría posterior.\n\nMantener esta disciplina ética no es una limitación al valor que un MSL puede aportar: es precisamente lo que permite que la inteligencia competitiva recogida sea sostenible, defendible y coherente con la reputación de integridad que sostiene toda la función médica.", "sources": [{"label": "Sedulo Group — Medical Conference Intelligence: A Complete Guide to Pharmaceutical Conference Coverage", "url": "https://sedulogroup.com/blog-post/pharmaceutical-conference-coverage/"}, {"label": "PR Newswire / Sorcero — Field Medical Excellence & Insights and Congress Intelligence Solutions", "url": "https://www.prnewswire.com/news-releases/sorcero-introduces-field-medical-excellence--insights-and-congress-intelligence-solutions-to-accelerate-evidence-based-medical-affairs-strategies-302716867.html"}, {"label": "VML Health — X-Fly for Medical Congresses: Real-Time Intelligence Capture", "url": "https://vmlhealthplatforms.com/x-fly-medical-congress-intelligence/"}]}, {"title": "Insight capture", "text": "La densidad de interacciones que ofrece un congreso —decenas de conversaciones con KOLs, autores de pósters, asistentes a sesiones y colegas de la comunidad médica en apenas unos días— lo convierte en la ventana de captura de insights más intensa de todo el calendario anual de un MSL. Aplicar aquí, de forma disciplinada, el marco de insights trabajado en el Módulo 5 es lo que determina si esa densidad se traduce en valor estratégico real o simplemente en una acumulación de notas dispersas.\n\nEl reto principal en un congreso no es la falta de información, sino el exceso: el volumen de conversaciones es tan alto que, sin un sistema, resulta prácticamente imposible recordar con precisión, días después, qué dijo cada interlocutor y en qué contexto. La disciplina fundamental es capturar cada insight lo más cerca posible del momento en que ocurre —inmediatamente después de una conversación, entre una sesión y otra, nunca esperando al final del día, y mucho menos al final del congreso—.\n\nUn insight de calidad capturado en un congreso sigue la misma estructura de rigor trabajada en el Módulo 5: no es una opinión genérica ni una cita aislada, sino una observación específica, con contexto (quién lo dijo, en qué situación), y con una implicación clara para la estrategia médica —ya sea un gap de evidencia expresado espontáneamente por un KOL durante una conversación de pasillo, una reacción crítica de la audiencia ante los datos de un competidor durante una sesión plenaria, o una necesidad clínica no cubierta mencionada por un investigador junto a su póster—.\n\nLa naturaleza del congreso también permite captar un tipo de insight particularmente valioso: la conversación colectiva del propio evento, es decir, los temas que emergen repetidamente en múltiples sesiones, en el pasillo, en las redes sociales asociadas al congreso (muchos eventos tienen un hashtag oficial activo con comentarios en tiempo real de los asistentes) y en las preguntas más recurrentes tras las presentaciones. Ese patrón agregado —qué está preocupando de verdad a la comunidad científica este año— es, con frecuencia, un insight de nivel superior al de cualquier conversación individual aislada.\n\nAl final de cada jornada del congreso, la buena práctica es hacer una revisión breve y sistemática de todos los insights capturados ese día, verificar que están completos y bien contextualizados, y marcar los que parecen de mayor relevancia estratégica para destacarlos en el debrief posterior del equipo, en lugar de dejar esa priorización para el regreso a la oficina, cuando la memoria del contexto original ya se ha diluido considerablemente.", "sources": [{"label": "Tika Mobile — Conference Intelligence for Medical Affairs: Beyond Spreadsheets", "url": "https://www.tikamobile.com/resources/blog/onference-intelligence-for-medical-affairs"}, {"label": "Sorcero — Congress Intelligence for Medical Affairs, MSLs, and field teams", "url": "https://www.sorcero.com/solutions/congress-intelligence"}, {"label": "aissel — Post-Congress Debrief: Smarter KOL Engagement Strategy", "url": "https://www.aissel.com/blog/post-congress-debrief-how-to-turn-insights-into-an-updated-kol-engagement-strategy/"}]}, {"title": "Internal debrief", "text": "El debrief interno posterior a un congreso es el mecanismo que convierte la experiencia individual de cada MSL en conocimiento colectivo de la organización. Sin un debrief estructurado, buena parte del valor generado durante el congreso —insights, inteligencia competitiva, oportunidades de colaboración, cobertura de sesiones— permanece disperso en la memoria y las notas personales de cada asistente, y se pierde progresivamente con el paso de las semanas.\n\nUn debrief eficaz, según las prácticas descritas en la literatura especializada, debe involucrar a un grupo cross-funcional más amplio que el equipo de campo: MSLs, responsables de Medical Affairs, equipos de estrategia médica y, cuando la información lo justifica, equipos comerciales o de acceso al mercado con los que existan canales formales de intercambio de información no confidencial. Esta implicación cruzada asegura que los insights capturados no se queden archivados en un documento interno del equipo de campo, sino que fluyan hacia las decisiones más amplias de la organización que puedan beneficiarse de ellos.\n\nLa estructura recomendada de un debrief cubre varios bloques: primero, una síntesis de la cobertura científica lograda (qué sesiones y pósters clave se cubrieron, cuáles quedaron sin cobertura y por qué); segundo, un resumen consolidado de los insights más relevantes capturados, priorizados por impacto estratégico y no simplemente listados por orden cronológico; tercero, un resumen de inteligencia competitiva relevante, obtenida siempre de fuentes públicas y canalizada correctamente; cuarto, un repaso de las relaciones con KOLs y DOLs —nuevos contactos iniciados, relaciones fortalecidas, compromisos de seguimiento adquiridos—; y quinto, cualquier oportunidad identificada de colaboración de investigación o de generación de evidencia que haya surgido durante el evento.\n\nUn elemento que distingue un debrief verdaderamente valioso de uno meramente informativo es que no se limita a documentar lo ocurrido, sino que conecta esa información con decisiones concretas: qué insights requieren una acción de seguimiento inmediata (por ejemplo, informar a los equipos de generación de evidencia sobre un gap identificado repetidamente), qué relaciones necesitan un plan de cultivo específico en los próximos meses, y qué implicaciones tiene la inteligencia competitiva recogida para el posicionamiento científico del propio producto.\n\nLas herramientas de colaboración asíncrona —documentos compartidos, plataformas de gestión de insights, canales de mensajería del equipo— facilitan que este debrief no dependa de encontrar un hueco común en la agenda de todo el equipo inmediatamente después del congreso, y permiten que la información fluya de forma continua incluso mientras algunos miembros del equipo siguen todavía en el propio evento o en desplazamiento de regreso.", "sources": [{"label": "aissel — Post-Congress Debrief: Smarter KOL Engagement Strategy", "url": "https://www.aissel.com/blog/post-congress-debrief-how-to-turn-insights-into-an-updated-kol-engagement-strategy/"}, {"label": "Sedulo Group — Medical Conference Intelligence: A Complete Guide to Pharmaceutical Conference Coverage", "url": "https://sedulogroup.com/blog-post/pharmaceutical-conference-coverage/"}, {"label": "Tika Mobile — Elevating Medical Congress Engagement: A Strategic Playbook for Medical Affairs Teams and MSLs", "url": "https://www.tikamobile.com/resources/blog/strategic-playbook-for-medical-affairs-teams-and-msls"}]}, {"title": "Executive report", "text": "Más allá del debrief operativo del equipo de campo, un congreso de relevancia estratégica —un gran congreso internacional del área terapéutica propia, por ejemplo— suele requerir un informe ejecutivo dirigido a la dirección de Medical Affairs y, en ocasiones, a otras funciones de liderazgo de la organización. Este informe tiene un propósito distinto al debrief interno del equipo: no busca documentar exhaustivamente todo lo ocurrido, sino sintetizar lo que la dirección necesita saber para tomar decisiones informadas.\n\nUn informe ejecutivo eficaz sigue el principio de comunicación ejecutiva de \"empezar por la conclusión\": en lugar de narrar cronológicamente el congreso día por día, abre con un resumen de una página que responda a las preguntas que más importan a un director de Medical Affairs: ¿qué cambió en el panorama científico o competitivo como resultado de este congreso?, ¿qué implicaciones tiene para la estrategia médica del producto?, ¿qué decisiones o inversiones requieren atención en el corto plazo?, ¿qué riesgos u oportunidades emergieron que antes no estaban en el radar?\n\nEl cuerpo del informe puede después desarrollar, con el nivel de detalle adecuado a una audiencia directiva —es decir, sin la granularidad operativa del debrief interno—, los bloques principales: los datos científicos más relevantes presentados en el congreso, tanto propios como de la competencia, con su implicación estratégica explícita; el estado del panorama competitivo, resumido en términos de mensajes clave y posicionamiento observado, no en transcripciones detalladas; los insights más significativos capturados, agrupados por tema y priorizados por impacto potencial; y las oportunidades de relación o colaboración de mayor relevancia estratégica identificadas durante el evento.\n\nUn informe ejecutivo bien construido evita dos errores frecuentes: el primero es la sobrecarga de detalle, incluyendo docenas de datos y anécdotas sin jerarquía, lo cual diluye el mensaje principal y hace perder tiempo a una audiencia directiva con capacidad de atención limitada; el segundo es la ausencia de implicación estratégica, limitándose a listar \"lo que pasó\" sin conectar esa información con una recomendación o una pregunta que requiera decisión de la dirección.\n\nEl formato visual también importa: un informe ejecutivo se beneficia de una estructura clara, con titulares que comuniquen la conclusión antes que el dato, apoyos visuales sencillos cuando ayudan a sintetizar información compleja, y una extensión contenida que respete el tiempo limitado de lectura de la audiencia directiva —habilidades de comunicación ejecutiva que se desarrollan en profundidad en el módulo de liderazgo de Medical Affairs más adelante en este curso.", "sources": [{"label": "Prezent — Congress Communication in Pharma: Complete Guide", "url": "https://www.prezent.ai/blog/congress-communication"}, {"label": "aissel — Post-Congress Debrief: Smarter KOL Engagement Strategy", "url": "https://www.aissel.com/blog/post-congress-debrief-how-to-turn-insights-into-an-updated-kol-engagement-strategy/"}, {"label": "Sedulo Group — Pharma CI Conference 2024: Comprehensive Summary Report", "url": "https://sedulogroup.com/blog-post/pharma-ci-conference-2024-summary/"}]}, {"title": "Post-congress follow-up", "text": "El valor de un congreso no se realiza durante el evento, sino en las semanas y meses posteriores, cuando los compromisos adquiridos, las relaciones iniciadas y los insights capturados se convierten —o no— en acciones concretas. El seguimiento post-congreso es, por tanto, la fase menos visible pero más determinante del ciclo completo de un congreso, y con frecuencia la que más se descuida bajo la presión de volver rápidamente a la actividad ordinaria del territorio.\n\nEl primer bloque de seguimiento es el cumplimiento de los compromisos adquiridos: si durante una reunión con un KOL se prometió enviar un artículo, conectar con otro investigador, o compartir información adicional sobre un estudio, ese compromiso debe cumplirse en un plazo razonablemente corto tras el congreso —idealmente en los primeros días, mientras la conversación sigue fresca para ambas partes—. Cumplir estos compromisos con rapidez y precisión es una de las formas más efectivas de consolidar la confianza construida durante el congreso; incumplirlos, o cumplirlos tarde y de forma genérica, puede anular buena parte del valor relacional generado.\n\nEl segundo bloque es la actualización sistemática del sistema de gestión de relaciones (CRM): registrar cada interacción relevante mantenida durante el congreso, actualizar el perfil y el nivel de relación de cada KOL o DOL contactado, y programar los próximos pasos de cultivo de esa relación según el plan de engagement trabajado en el Módulo 3, en lugar de dejar que el contacto se enfríe hasta la próxima interacción casual.\n\nEl tercer bloque es la traducción de insights en acción: los insights capturados y priorizados durante el debrief no deben quedarse en un documento archivado, sino comunicarse activamente a los equipos internos relevantes —generación de evidencia, estrategia médica, HEOR— con seguimiento explícito de si esa información se ha incorporado a alguna decisión o plan concreto, cerrando así el ciclo entre la captura del insight y su uso estratégico real.\n\nEl cuarto bloque es la evaluación del propio congreso frente a los objetivos definidos en la fase de planificación: revisar, de forma
