rioriza el rigor metodológico y el cumplimiento de plazos de estudio. Entender estas prioridades distintas —sin adoptarlas como propias, dado que Medical Affairs debe mantener su independencia científica— permite anticipar mejor cómo comunicar una misma información de forma relevante para cada audiencia interna.\n\nEl segundo paso es establecer canales de comunicación regulares y no solo reactivos: reuniones periódicas de alineamiento con los equipos con los que se colabora de forma más frecuente, en lugar de contactar únicamente cuando surge una necesidad puntual, construye la relación de confianza que después facilita la colaboración en momentos de mayor presión o de decisiones más complejas.\n\nEl tercer paso, especialmente delicado para Medical Affairs, es mantener límites claros de independencia mientras se colabora activamente: compartir insights y contexto científico relevante con otras funciones sin comprometer nunca la naturaleza no promocional del propio rol, un equilibrio que exige claridad interna sobre qué información puede compartirse, con qué propósito, y a través de qué canales formales, coherente con los principios éticos trabajados en el Módulo 7.\n\nEl cuarto paso es gestionar de forma proactiva los desacuerdos legítimos entre funciones: cuando la perspectiva médica y la perspectiva comercial o de acceso al mercado no coinciden sobre una decisión concreta —algo que ocurre con normalidad en cualquier organización matricial—, un profesional con madurez de liderazgo aborda ese desacuerdo con argumentos basados en evidencia y en el interés a largo plazo del producto y de los pacientes, buscando una resolución constructiva en lugar de evitar la conversación o imponer su posición por la fuerza de la autoridad científica.\n\nGestionar bien estas relaciones internas no es una tarea política ajena al verdadero trabajo médico: es, en la práctica, lo que determina si el conocimiento científico generado por Medical Affairs se traduce en decisiones reales de la organización, o se queda archivado sin influencia efectiva en la estrategia del producto.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Fiona Day Consulting — How do you develop your ability to influence without authority as a medical or public health leader?", "url": "https://fionadayconsulting.co.uk/how-do-you-develop-your-ability-to-influence-without-authority-as-a-medical-or-public-health-leader/"}, {"label": "SOCRA — Leadership: Influencing Without Authority in Clinical Research", "url": "https://www.socra.org/blog/cra-leadership-influencing-without-authority-clinical-research/"}]}, {"title": "Personal brand in Medical Affairs", "text": "La marca personal de un profesional de Medical Affairs es la reputación científica y profesional que se construye, de forma deliberada o involuntaria, a través de cada interacción, cada publicación y cada presencia pública a lo largo de una carrera. En un campo tan basado en la confianza y la credibilidad como Medical Affairs, cultivar esa marca de forma consciente —sin caer nunca en la autopromoción vacía o en un tono que recuerde a la comunicación comercial— es una inversión de carrera con retorno significativo a medio y largo plazo.\n\nEl fundamento de cualquier marca personal sólida en este campo es el mismo que sostiene la credibilidad de toda la función: el rigor científico demostrado de forma consistente a lo largo del tiempo. Ninguna estrategia de comunicación o de visibilidad compensa la falta de sustancia científica real; la marca personal amplifica una reputación ya merecida, no la sustituye.\n\nSobre esa base, la construcción activa de marca personal se apoya en varios elementos concretos. La especialización visible: ser reconocido por un conocimiento profundo en un área terapéutica o en una competencia específica (por ejemplo, excelencia en insights, o dominio particular de metodología estadística) en lugar de presentarse como un generalista indiferenciado, facilita que otros profesionales —tanto dentro de la organización como en la comunidad científica externa— piensen en esa persona de forma natural cuando surge una necesidad relacionada con esa especialidad. La consistencia de presencia profesional: mantener un perfil actualizado y coherente en plataformas profesionales como LinkedIn, que refleje con precisión la experiencia, el rol y los intereses científicos genuinos, sin exagerar ni tergiversar la propia trayectoria. Y las contribuciones visibles al conocimiento colectivo: participar en foros profesionales, contribuir con comentarios sustantivos a discusiones científicas relevantes, o colaborar en iniciativas internas de formación o de mejores prácticas, actividades que construyen reputación de forma orgánica a través de la contribución real, no de la autopromoción directa.\n\nUn error frecuente que debe evitarse con disciplina es confundir marca personal con autopromoción comercial: compartir logros propios de forma desproporcionada, o utilizar el tono y las técnicas de comunicación propias del marketing personal genérico, resulta contraproducente en un campo donde la credibilidad se basa precisamente en la ausencia de intención promocional. La marca personal más eficaz en Medical Affairs se construye de forma indirecta, a través de la calidad sostenida del propio trabajo y de contribuciones genuinas a la comunidad científica y profesional, más que a través de una estrategia de visibilidad autocentrada.\n\nDesarrollar esta marca personal de forma consciente desde etapas tempranas de la carrera —no solo cuando se busca activamente un ascenso o un cambio de rol— es lo que hace que, cuando llega el momento de una oportunidad de mayor responsabilidad, la reputación profesional ya construida hable por sí misma.", "sources": [{"label": "LinkedIn Learning — Establish your personal brand: How to Become a Thought Leader", "url": "https://www.linkedin.com/learning/how-to-become-a-thought-leader-and-advance-your-career/establish-your-personal-brand"}, {"label": "LinkedIn — How to Build a Personal Brand as a Thought Leader", "url": "https://www.linkedin.com/top-content/marketing/personal-brand-building/how-to-build-a-personal-brand-as-a-thought-leader/"}, {"label": "The MSL Academy — Transitioning into the MSL Role Without Industry Experience", "url": "https://www.themslacademy.com/blog/from-bench-to-field-transitioning-into-the-msl-role-without-industry-experience"}]}, {"title": "LinkedIn thought leadership", "text": "Ser reconocido como una voz de referencia (thought leader) en un área concreta dentro de LinkedIn exige una estrategia de contenido deliberada, distinta del uso puntual descrito en el Módulo 10 para la relación con DOLs individuales: aquí el foco es la construcción sostenida de una presencia propia reconocible, siempre dentro de los límites de rigor científico y de no promoción que rigen toda la actividad de un profesional de Medical Affairs.\n\nEl primer elemento de una estrategia de thought leadership eficaz es la claridad de enfoque: definir con precisión en qué área concreta se quiere ser reconocido —por ejemplo, un ámbito terapéutico específico, la aplicación de inteligencia artificial en Medical Affairs, o la excelencia en generación de insights— en lugar de intentar comunicar sobre todo de forma dispersa. Esta especialización facilita que la audiencia asocie de forma clara y recordable a esa persona con ese tema concreto.\n\nEl segundo elemento es la consistencia: publicar y participar de forma regular, aunque sea con una frecuencia moderada, construye visibilidad de forma mucho más efectiva que una actividad esporádica e impredecible. El contenido no necesita ser exclusivamente original: comentar de forma sustantiva y con perspectiva propia publicaciones científicas relevantes, resumir de forma accesible un hallazgo importante de un congreso reciente, o compartir una reflexión genuina sobre una tendencia del área terapéutica son formas de contribución que construyen reputación con la misma eficacia que el contenido enteramente original, y con menor exigencia de tiempo.\n\nEl tercer elemento es el formato adaptado a la plataforma: contenido breve, visualmente claro y directamente útil para la audiencia profesional de LinkedIn tiende a generar mayor interacción genuina que textos extensos o excesivamente técnicos; explicar un concepto clínico complejo de forma accesible a través de un breve vídeo o una infografía, por ejemplo, demuestra tanto conocimiento científico como habilidad de comunicación, una combinación particularmente valorada en el sector.\n\nEl cuarto elemento, indispensable para un profesional de Medical Affairs, es el filtro de compliance previo a cualquier publicación: todo contenido compartido debe seguir las políticas internas de comunicación digital de la organización trabajadas en el Módulo 10, evitando cualquier apariencia de promoción de producto, respetando la separación estricta entre opinión científica personal y posicionamiento oficial de la compañía, y aplicando siempre el mismo rigor de verificación de fuentes que en cualquier otra comunicación científica.\n\nConstruir thought leadership en LinkedIn no es un fin en sí mismo, sino una herramienta que, bien ejecutada de forma sostenida, amplifica la marca personal descrita en la lección anterior y abre puertas profesionales —nuevas colaboraciones, invitaciones a participar en iniciativas relevantes, y visibilidad ante quienes toman decisiones de contratación— mucho antes de que esa persona busque activamente una nueva oportunidad.", "sources": [{"label": "HubSpot — How to Become a LinkedIn Thought Leader in 9 Easy Steps", "url": "https://blog.hubspot.com/marketing/linkedin-thought-leadership"}, {"label": "National Search Group — Build a Powerful LinkedIn Thought Leadership Profile", "url": "https://www.nationalsearchgroup.com/build-linkedin-thought-leadership-profile/"}, {"label": "C-Suite Content — LinkedIn Personal Branding: A Complete How-To Guide", "url": "https://csuitecontent.com/an-in-depth-guide-to-linkedin-personal-branding/"}]}, {"title": "Interviewing for MSL and Medical Advisor roles", "text": "El proceso de selección para roles de MSL y Medical Advisor sigue, según la experiencia consolidada del sector, una estructura relativamente predecible que puede constar de hasta cuatro etapas: una entrevista telefónica inicial de cribado, una entrevista más profunda con el equipo contratante, en muchos casos pruebas psicométricas de aptitud y estilo de trabajo, y una entrevista final que habitualmente incluye una presentación clínica preparada por el candidato y, con mucha frecuencia, un ejercicio de simulación de una visita a un KOL frente a un panel evaluador.\n\nEl ejercicio de simulación de visita (role play) merece preparación específica: el panel evalúa no solo el conocimiento científico del candidato, sino su capacidad de mantener una conversación informativa, atractiva y profesional que demuestre comprensión genuina del rol de MSL —aplicando exactamente los principios de intercambio científico, escucha activa y preguntas estratégicas trabajados en el Módulo 4 de este curso—, y no una simulación de discurso comercial disfrazado de conversación científica, un error que los evaluadores experimentados detectan con facilidad.\n\nLa preparación de la presentación clínica exige seleccionar un tema que permita demostrar simultáneamente profundidad científica y capacidad de comunicación clara: estructurar la presentación siguiendo los mismos principios de comunicación ejecutiva trabajados en este mismo módulo —empezando por el mensaje central, apoyándose en datos bien seleccionados y visualmente claros, y siendo capaz de responder con solidez a preguntas de seguimiento sobre metodología o limitaciones del estudio elegido, aplicando el pensamiento crítico sobre evidencia trabajado en el Módulo 6—.\n\nDemostrar conocimiento actualizado del sector es otro factor determinante que los reclutadores valoran de forma consistente: mantenerse al día sobre aprobaciones recientes de fármacos, abstracts destacados de congresos relevantes, y ampliaciones de indicación en el área terapéutica de interés permite al candidato hacer referencias concretas y actuales durante la entrevista, demostrando un interés genuino y activo en el campo, más allá del conocimiento teórico adquirido en formación previa.\n\nFinalmente, la fase de preguntas del candidato al entrevistador —habitualmente al cierre de cada etapa del proceso— es también una oportunidad de demostrar criterio profesional: preguntar de forma genuina sobre las oportunidades de progresión de carrera dentro de la organización, sobre cómo se mide el éxito en el rol, o sobre la estructura y prioridades del Plan Médico del producto en cuestión, comunica al entrevistador un nivel de reflexión estratégica que distingue a un candidato preparado de uno que simplemente busca cualquier puesto disponible.\n\nPrepararse con este nivel de detalle para un proceso de selección de Medical Affairs no es un ejercicio aislado: es, en sí mismo, una aplicación práctica de casi todas las competencias trabajadas a lo largo de este curso completo.", "sources": [{"label": "MSL Consultant (LinkedIn) — Medical Science Liaison (MSL) Interview Stages", "url": "https://www.linkedin.com/pulse/medical-science-liaison-msl-interview-stages-msl-consultant"}, {"label": "Jasmine Wynne (LinkedIn) — A step by step guide to the MSL interview process", "url": "https://www.linkedin.com/pulse/step-guide-msl-interview-process-jasmine-wynne"}, {"label": "The MSL Academy — Transitioning into the MSL Role Without Industry Experience", "url": "https://www.themslacademy.com/blog/from-bench-to-field-transitioning-into-the-msl-role-without-industry-experience"}]}, {"title": "Professional development plan", "text": "Un plan de desarrollo profesional es el mapa deliberado que un profesional de Medical Affairs construye para dirigir de forma activa su propio crecimiento de carrera, en lugar de dejar que la progresión profesional dependa exclusivamente de oportunidades que surgen por azar o de decisiones tomadas por otros. Cerrar este módulo, y este curso completo, con la construcción de un plan de desarrollo propio es la forma más directa de convertir todo el contenido trabajado en una hoja de ruta personal y accionable.\n\nEl primer paso de un plan de desarrollo profesional sólido es una autoevaluación honesta frente a las competencias trabajadas a lo largo de este módulo y del curso completo: dominio del intercambio científico y la escucha activa (Módulo 4), calidad y sistematización de la captura de insights (Módulo 5), solidez en el pensamiento crítico sobre evidencia (Módulo 6), contribución a la generación de evidencia (Módulo 7), excelencia en la ejecución de congresos (Módulo 8), comprensión de la planificación estratégica médica (Módulo 9), fluidez en el entorno digital y omnicanal (Módulo 10), uso responsable y productivo de herramientas de inteligencia artificial (Módulo 11), y las competencias de liderazgo trabajadas en este módulo final. Identificar con honestidad en qué áreas se tiene ya un dominio sólido y en cuáles existe una brecha real de desarrollo es la base de cualquier plan efectivo.\n\nEl segundo paso es la definición de objetivos de desarrollo específicos y con un horizonte temporal claro, siguiendo el mismo rigor de objetivos medibles trabajado al hablar de imperativos estratégicos en el Módulo 9: en lugar de un objetivo genérico como \"mejorar mis habilidades de liderazgo\", un objetivo bien formulado podría ser \"liderar el debrief post-congreso de mi equipo territorial en los próximos dos congresos, aplicando la estructura trabajada en el Módulo 8, y solicitar retroalimentación explícita de mi responsable sobre mi capacidad de síntesis ejecutiva\".\n\nEl tercer paso es identificar las vías concretas de desarrollo para cada objetivo: formación estructurada, mentoría de un profesional más senior dentro o fuera de la organización, participación activa en proyectos transfuncionales que permitan practicar la influencia sin autoridad trabajada en este módulo, o la búsqueda deliberada de oportunidades de mayor visibilidad (una presentación ejecutiva, la representación del equipo en un comité interno) que permitan demostrar competencias emergentes ante quienes toman decisiones de progresión de carrera.\n\nEl cuarto paso, y el que da continuidad real al plan, es la revisión periódica: reevaluar cada pocos meses el progreso frente a los objetivos definidos, ajustar el plan según lo aprendido, e incorporar nuevas prioridades de desarrollo a medida que la propia trayectoria profesional avanza y las necesidades de la organización evolucionan.\n\nUn plan de desarrollo profesional bien construido y mantenido de forma activa —no como un documento archivado, sino como una herramienta viva de dirección de la propia carrera— es lo que, en última instancia, transforma el conocimiento adquirido en este curso en una trayectoria profesional sostenida de crecimiento e impacto dentro de Medical Affairs.", "sources": [{"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "The MSL Academy — Transitioning into the MSL Role Without Industry Experience", "url": "https://www.themslacademy.com/blog/from-bench-to-field-transitioning-into-the-msl-role-without-industry-experience"}]}, {"title": "From MSL to Medical Lead", "text": "La trayectoria desde un rol de MSL hacia posiciones de mayor responsabilidad como Medical Advisor, Medical Manager o, con el tiempo, Medical Lead o Director Médico, no es un camino automático que ocurre simplemente por acumular años de experiencia: es una progresión que se construye de forma deliberada, aplicando de forma creciente y visible las competencias de liderazgo trabajadas a lo largo de este módulo, mientras se sigue ejecutando con excelencia el rol actual.\n\nUn patrón que la literatura del sector identifica de forma consistente en profesionales que progresan con éxito desde MSL hacia roles de mayor responsabilidad es la ampliación gradual del alcance de impacto: empezar por ser excelente en el propio territorio y las propias relaciones, y desde ahí buscar de forma proactiva oportunidades de contribuir más allá de esa responsabilidad individual —liderar una iniciativa de mejora de proceso para todo el equipo de campo, coordinar la preparación de un congreso estratégico para el equipo completo, o representar a Medical Affairs en un proyecto transfuncional relevante—. Estas oportunidades no siempre llegan de forma espontánea: con frecuencia hay que buscarlas y proponerlas activamente, comunicando con claridad el interés en asumir mayor responsabilidad.\n\nUn segundo patrón es la visibilidad estratégica ante quienes toman decisiones de progresión: no basta con hacer un trabajo excelente si ese trabajo permanece invisible para la dirección; comunicar los propios resultados y contribuciones de forma efectiva —aplicando los principios de comunicación ejecutiva y de narrativa de impacto trabajados en los Módulos 9 y en este mismo módulo— es lo que permite que el trabajo de calidad se traduzca en reconocimiento real y en consideración para nuevas oportunidades.\n\nUn tercer patrón es la búsqueda activa de mentoría y de modelos de referencia: identificar a profesionales que ya ocupan el tipo de rol al que se aspira, y buscar de forma proactiva su perspectiva sobre qué competencias y qué experiencias fueron más determinantes en su propia progresión, aporta un conocimiento práctico del camino a seguir que ningún curso teórico puede replicar por completo.\n\nUn cuarto patrón, y quizá el más importante para sostener una trayectoria de largo plazo, es mantener siempre el ancla en el propósito original de la función: la progresión de carrera dentro de Medical Affairs tiene más sentido, y es más sostenible emocionalmente, cuando se entiende no como una acumulación de títulos o de autoridad formal, sino como una ampliación progresiva de la capacidad de contribuir a mejores decisiones clínicas y, en última instancia, a mejores resultados de salud para los pacientes —el mismo propósito con el que se abrió este curso completo en su primer módulo, y que debería seguir orientando cada paso de la trayectoria profesional, desde la primera visita de campo hasta la dirección estratégica de una organización médica entera.\n\nEste curso ha recorrido, módulo a módulo, el conocimiento técnico, relacional, estratégico y digital que sostiene esa trayectoria. Aplicarlo con consistencia, honestidad científica y ambición profesional genuina es, a partir de ahora, responsabilidad de cada profesional que lo ha completado.", "sources": [{"label": "Blue Matter Consulting — Medical Affairs as a Strategic Leader", "url": "https://bluematterconsulting.com/insights/blog/medical-affairs-4-strategic-leader/"}, {"label": "Council on Pharmacy Standards — Core competencies required for Medical Affairs success", "url": "https://pharmacystandards.org/cmap/section-1-4-core-competencies-required-for-medical-affairs-success/"}, {"label": "THE MSL Journal — Servant Leadership in Medical Affairs: A Competitive Advantage", "url": "https://themsljournal.com/article/servant-leadership-in-medical-affairs-a-competitive-advantage/"}]}], "examples": ["Create a 30-second professional elevator pitch combining scientific value proposition, differential experience and career direction.", "Prepare for an MSL interview with concrete applied examples (an insight generated, a KOL relationship recovered, an evidence gap identified) rather than generic descriptions.", "Design a 3-year career plan with competency, training and experience milestones for each stage of progression.", "Write an educational LinkedIn post on a relevant scientific topic, non-promotional, offering genuine professional perspective."], "caseTitle": "A 12-month growth plan from MSL to Medical Advisor/Manager", "caseText": "You are an MSL with 2 years of experience wanting to move into a Medical Advisor or Medical Manager role. The 12-month growth plan combines four pillars: first, closing identified competency gaps (for example, gaining more exposure to designing evidence generation plans by actively participating in building the next Medical Plan); second, expanding internal visibility by presenting strategic insights to senior stakeholders; third, building an external personal brand through compliant thought-leadership content on LinkedIn about the therapeutic area; fourth, actively seeking mentorship from a current Medical Manager or Medical Director, with quarterly progress reviews against defined milestones. The plan is documented with concrete, measurable milestones each quarter, not as a generic aspiration.", "resources": {"framework": "Career Growth Canvas: Current role → Target role → Competency gaps → Development actions → Quarterly milestones → Mentor/sponsor.", "checklist": ["Do I have a documented development plan with quarterly milestones?", "Have I precisely identified my competency gaps versus the target role?", "Am I building internal visibility with concrete impact examples?", "Do I have an active mentor or sponsor within the organization?", "Is my external personal brand consistent with my career goals and compliant?"], "prompt": "Act as a Medical Affairs career coach. With my current role [describe] and my 12-month target role [describe], help me build a development plan with 4 priority competency gaps and 3 concrete quarterly actions to close them.", "template": "12-Month Career Plan: Quarter → Development objective → Concrete action → Evidence of achievement → Mentor review.", "glossary": [{"term": "Influence without authority", "def": "The ability to achieve alignment and action from others without a direct hierarchical relationship."}, {"term": "Thought leadership", "def": "Positioning oneself professionally as a reference of perspective and knowledge in a field."}, {"term": "Sponsor", "def": "A senior person who actively promotes a professional's development and visibility within the organization."}, {"term": "Medical Lead", "def": "A medical leadership role with strategic and team responsibility."}]}, "quiz": [{"q": "What best characterizes 'influence without authority,' a key competency in Medical Affairs?", "options": ["Giving direct orders to other departments", "Achieving alignment and action from other teams with no direct hierarchical relationship, through scientific credibility and delivered value", "Avoiding any interaction with other departments", "Always depending on a superior's approval"], "correct": 1, "explain": "In matrixed structures, Medical Affairs must influence through credibility and value, not formal authority."}, {"q": "What element makes an interview for an MSL or Medical Advisor role more effective?", "options": ["Generic answers about personal motivation", "Concrete, applied examples of impact generated, such as actionable insights or identified evidence gaps", "Emphasizing only theoretical knowledge with no examples", "Avoiding discussing real cases due to confidentiality, with no adaptation at all"], "correct": 1, "explain": "Concrete, applied examples demonstrate real competence far more persuasively than generic statements."}, {"q": "What is 'executive communication' in the context of medical leadership?", "options": ["Speaking with as much technical detail as possible in any context", "Synthesizing complex scientific information into clear, prioritized, actionable messages for time-constrained executive audiences", "Avoiding communication with leadership to save time", "Always using presentations with more than 50 slides"], "correct": 1, "explain": "Executive communication requires synthesis and prioritization, adapting scientific complexity to the executive's context and available time."}, {"q": "What distinguishes the progression 'from MSL to Medical Lead'?", "options": ["Just a title change with no new responsibilities", "Evolving from individual field excellence to team leadership capability, strategic vision and senior stakeholder management", "No longer needing scientific knowledge", "Completely reducing contact with KOLs"], "correct": 1, "explain": "Progression into leadership roles requires developing team management and strategic competencies, beyond individual field excellence."}, {"q": "What principle should guide the use of LinkedIn for medical thought leadership?", "options": ["Sharing any content, including promotional product messages", "Sharing educational content and genuine professional perspective, always within compliance limits", "Using it exclusively to look for a new job", "Avoiding any activity, since it adds no professional value"], "correct": 1, "explain": "Medical thought leadership on LinkedIn must be educational, non-promotional, and always compliant."}, {"q": "What role does a 'sponsor' play in professional development within Medical Affairs?", "options": ["It's the same as a mentor, with no difference", "A senior person who actively promotes the professional's visibility and development within the organization", "A purely administrative role unrelated to career development", "A legal requirement for any promotion"], "correct": 1, "explain": "A sponsor provides active promotion and visibility, complementing the more advice-oriented role of a mentor."}, {"q": "What characterizes a good professional development plan in Medical Affairs?", "options": ["Being a generic aspiration with no defined timelines", "Having precisely identified competency gaps and a concrete action plan with measurable milestones", "Requiring no periodic review once defined", "Focusing solely on the target salary"], "correct": 1, "explain": "An effective development plan is specific, measurable, and periodically reviewed against concrete milestones."}, {"q": "What is 'strategic thinking' as applied to a Medical Affairs professional's role?", "options": ["Focusing exclusively on day-to-day operational tasks with no bigger-picture view", "The ability to connect everyday tactical decisions with long-term medical and business strategy", "Delegating all strategic decisions to other departments", "Avoiding any participation in defining the Medical Plan"], "correct": 1, "explain": "Strategic thinking connects daily action with the organization's long-term implications and priorities."}, {"q": "What is a fundamental element of effectively managing internal stakeholders?", "options": ["Ignoring each stakeholder's particular interests", "Mapping the interests, priorities and communication style of key stakeholders to build effective alliances", "Communicating with every stakeholder in exactly the same way", "Avoiding any interaction until strictly necessary"], "correct": 1, "explain": "Effective stakeholder management requires understanding and adapting to each person's interests and style."}, {"q": "What role does personal brand play in a Medical Affairs professional's career?", "options": ["No relevance at all if the technical work is good", "It builds a consistent professional reputation based on scientific rigor and reliability, opening internal and external opportunities", "It only matters for marketing roles, not Medical Affairs", "It is based exclusively on the number of social media followers"], "correct": 1, "explain": "Personal brand in Medical Affairs is built on demonstrated scientific credibility and reliability, not vanity metrics."}]}];

const AUTH_API = '/api/dmsl-auth.php';
const TOTAL_MODULES = COURSE_DATA.length;
const PASS_THRESHOLD = 70;
const EXCELLENT_THRESHOLD = 90;
const PROTECTED_VIEWS = ['dashboard','curriculum','module','certificate'];

function defaultState(){
  const modules = {};
  COURSE_DATA.forEach(m=>{
    modules[m.num] = { bestScore:null, attempts:0, lessonsViewed:new Array(m.lessons.length).fill(false), quizState:null };
  });
  return { modules, lastModule:null, studentName:'', xp:0 };
}

/* ===== Auth / account state ===== */
let CURRENT_USER = null;      // normalized email of the logged-in user, or null
let AUTH_MODE = 'login';      // 'login' | 'register' | 'verify'
let AUTH_ERROR = '';
let PENDING_EMAIL = null;     // email awaiting OTP verification
let PENDING_VIEW = 'dashboard'; // where to go once login/verification succeeds

let STATE = defaultState();
let VIEW = 'auth';
let CURRENT_MODULE = 1;
let CURRENT_TAB = 'overview';
let QUIZ_ANSWERS = {};
let QUIZ_SUBMITTED = false;
let QUIZ_SCORE = null;
let SIDEBAR_MOBILE_OPEN = false;
let AUTH_BUSY = false;

function normalizeEmail(email){ return String(email||'').trim().toLowerCase(); }
function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

/* Real backend calls — accounts, sessions and progress all live server-side
   now (api/dmsl-auth.php). The session is an HttpOnly cookie the browser
   manages automatically; credentials:'include' sends it on every call. */
async function apiCall(action, body){
  const res = await fetch(AUTH_API + '?action=' + action, {
    method: body === undefined ? 'GET' : 'POST',
    credentials: 'include',
    headers: body === undefined ? {} : {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data;
  try{ data = await res.json(); }catch(e){ data = {}; }
  if(!res.ok && data.ok === undefined) data.ok = false;
  if(!data.error && !res.ok) data.error = 'Something went wrong. Please try again.';
  return data;
}

function stateFromProgress(progress){
  const base = defaultState();
  if(progress && typeof progress === 'object'){
    Object.keys(base.modules).forEach(k=>{
      if(progress.modules && progress.modules[k]) base.modules[k] = Object.assign(base.modules[k], progress.modules[k]);
    });
    base.lastModule = progress.lastModule || null;
    base.studentName = progress.studentName || '';
    base.xp = progress.xp || 0;
  }
  return base;
}

let SAVE_STATE_TIMER = null;
function saveState(){
  if(!CURRENT_USER) return;
  // Debounced so rapid actions (ticking several lessons) don't fire a
  // request each — the server is the source of truth, this is just sync.
  clearTimeout(SAVE_STATE_TIMER);
  SAVE_STATE_TIMER = setTimeout(function(){
    apiCall('save-progress', {progress: STATE}).catch(function(){ /* retried on next save */ });
  }, 400);
}

/* ===== Auth actions ===== */
function requireAuth(view){
  if(CURRENT_USER){ goTo(view); return; }
  PENDING_VIEW = view;
  AUTH_MODE = 'login';
  AUTH_ERROR = '';
  goTo('auth');
}
function switchAuthMode(mode){
  AUTH_MODE = mode;
  AUTH_ERROR = '';
  render();
}
async function doRegister(){
  if(AUTH_BUSY) return;
  const nameEl = document.getElementById('regName');
  const emailEl = document.getElementById('regEmail');
  const passEl = document.getElementById('regPassword');
  const pass2El = document.getElementById('regPassword2');
  const name = nameEl ? nameEl.value : '';
  const email = normalizeEmail(emailEl ? emailEl.value : '');
  const pass = passEl ? passEl.value : '';
  const pass2 = pass2El ? pass2El.value : '';
  AUTH_ERROR = '';
  if(!name.trim()){ AUTH_ERROR='Please enter your full name.'; render(); return; }
  if(!isValidEmail(email)){ AUTH_ERROR='Please enter a valid email address.'; render(); return; }
  if(pass.length<6){ AUTH_ERROR='Password must be at least 6 characters.'; render(); return; }
  if(pass!==pass2){ AUTH_ERROR='Passwords do not match.'; render(); return; }
  AUTH_BUSY = true; render();
  try{
    const data = await apiCall('register', {name: name.trim(), email, password: pass});
    AUTH_BUSY = false;
    if(!data.ok){ AUTH_ERROR = data.error || 'Something went wrong. Please try again.'; render(); return; }
    PENDING_EMAIL = email;
    AUTH_MODE = 'verify';
    AUTH_ERROR = data.emailSent === false ? (data.warning || '') : '';
    render();
  }catch(e){
    AUTH_BUSY = false;
    AUTH_ERROR = 'Could not reach the server. Please check your connection and try again.';
    render();
  }
}
async function doLogin(){
  if(AUTH_BUSY) return;
  const emailEl = document.getElementById('loginEmail');
  const passEl = document.getElementById('loginPassword');
  const email = normalizeEmail(emailEl ? emailEl.value : '');
  const pass = passEl ? passEl.value : '';
  AUTH_ERROR = '';
  if(!isValidEmail(email)){ AUTH_ERROR='Please enter a valid email address.'; render(); return; }
  AUTH_BUSY = true; render();
  try{
    const data = await apiCall('login', {email, password: pass});
    AUTH_BUSY = false;
    if(data.needsVerification){
      PENDING_EMAIL = email;
      AUTH_MODE = 'verify';
      AUTH_ERROR = data.error || 'Please verify your email — we just sent you a new code.';
      render();
      return;
    }
    if(!data.ok){ AUTH_ERROR = data.error || 'Incorrect email or password.'; render(); return; }
    CURRENT_USER = data.email;
    STATE = stateFromProgress(data.progress);
    if(STATE.lastModule) CURRENT_MODULE = STATE.lastModule;
    showToast('Welcome back!');
    goTo(PENDING_VIEW || 'dashboard');
  }catch(e){
    AUTH_BUSY = false;
    AUTH_ERROR = 'Could not reach the server. Please check your connection and try again.';
    render();
  }
}
async function doVerify(){
  if(AUTH_BUSY) return;
  const codeEl = document.getElementById('otpInput');
  const code = (codeEl ? codeEl.value : '').trim();
  AUTH_ERROR = '';
  if(!PENDING_EMAIL){ AUTH_ERROR='Something went wrong. Please register again.'; AUTH_MODE='register'; render(); return; }
  AUTH_BUSY = true; render();
  try{
    const data = await apiCall('verify', {email: PENDING_EMAIL, code});
    AUTH_BUSY = false;
    if(!data.ok){ AUTH_ERROR = data.error || 'Incorrect verification code.'; render(); return; }
    CURRENT_USER = data.email;
    STATE = stateFromProgress(data.progress);
    showToast('Account verified — welcome to the Academy!');
    goTo(PENDING_VIEW || 'dashboard');
  }catch(e){
    AUTH_BUSY = false;
    AUTH_ERROR = 'Could not reach the server. Please check your connection and try again.';
    render();
  }
}
async function resendCode(){
  if(AUTH_BUSY || !PENDING_EMAIL) return;
  AUTH_BUSY = true; render();
  try{
    await apiCall('resend', {email: PENDING_EMAIL});
    AUTH_BUSY = false;
    showToast('A new verification code has been sent to your email.');
    render();
  }catch(e){
    AUTH_BUSY = false;
    showToast('Could not send the code — please try again.');
    render();
  }
}
function logout(){
  apiCall('logout', {}).catch(function(){});
  CURRENT_USER = null;
  STATE = defaultState();
  CURRENT_MODULE = 1;
  VIEW = 'auth';
  AUTH_MODE = 'login';
  AUTH_ERROR = '';
  render();
}

/* ===== Derived metrics ===== */
function moduleStatus(num){
  const m = STATE.modules[num];
  if(!m || m.bestScore===null) return 'not_started';
  if(m.bestScore>=EXCELLENT_THRESHOLD) return 'excellent';
  if(m.bestScore>=PASS_THRESHOLD) return 'completed';
  return 'in_progress';
}
function isModuleCompleted(num){
  const s = STATE.modules[num];
  return s && s.bestScore!==null && s.bestScore>=PASS_THRESHOLD;
}
function completedModulesCount(){
  return COURSE_DATA.filter(m=>isModuleCompleted(m.num)).length;
}
function globalProgressPercent(){
  let sum=0;
  COURSE_DATA.forEach(m=>{
    const s = STATE.modules[m.num];
    sum += (s && s.bestScore!==null) ? Math.min(s.bestScore,100) : 0;
  });
  return Math.round(sum/TOTAL_MODULES);
}
function averageScore(){
  const attempted = COURSE_DATA.filter(m=>STATE.modules[m.num].bestScore!==null);
  if(attempted.length===0) return 0;
  const sum = attempted.reduce((a,m)=>a+STATE.modules[m.num].bestScore,0);
  return Math.round(sum/attempted.length);
}
function rankInfo(){
  const p = globalProgressPercent();
  if(p>=100) return {name:'Medical Affairs Leader', min:100};
  if(p>=76) return {name:'Strategic MSL', min:76};
  if(p>=51) return {name:'Medical Partner', min:51};
  if(p>=26) return {name:'Field Learner', min:26};
  return {name:'Explorer', min:0};
}
function certificateUnlocked(){ return completedModulesCount()===TOTAL_MODULES; }
function statusLabel(s){
  return {not_started:'Not started', in_progress:'In progress', completed:'Completed', excellent:'Excellent score'}[s];
}

/* ===== XP toast ===== */
function showToast(msg){
  let t = document.getElementById('xpToast');
  if(!t){
    t = document.createElement('div');
    t.id='xpToast'; t.className='xp-toast';
    document.body.appendChild(t);
  }
  t.innerHTML = '<span class="gold">&#9733;</span><span>'+msg+'</span>';
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ===== Navigation ===== */
function goTo(view){
  VIEW = view;
  SIDEBAR_MOBILE_OPEN = false;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function openModule(num){
  CURRENT_MODULE = num;
  CURRENT_TAB = 'overview';
  STATE.lastModule = num;
  saveState();
  QUIZ_ANSWERS = {};
  QUIZ_SUBMITTED = false;
  QUIZ_SCORE = null;
  VIEW = 'module';
  SIDEBAR_MOBILE_OPEN = false;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function setTab(tab){

  const el = document.getElementById('lesson-'+idx);
  if(el){ el.classList.toggle('open'); }
  const m = STATE.modules[CURRENT_MODULE];
  if(m && !m.lessonsViewed[idx]){

    saveState();
    const dot = document.getElementById('lessoncheck-'+idx);
    if(dot){ dot.classList.add('done'); dot.innerHTML='&#10003;'; }
  }
}
function toggleLessonDone(event, idx){
  if(event){ event.stopPropagation(); }
  const m = STATE.modules[CURRENT_MODULE];
  if(!m) return;
  m.lessonsViewed[idx] = !m.lessonsViewed[idx];
  saveState();
  const dot = document.getElementById('lessoncheck-'+idx);
  if(dot){
    if(m.lessonsViewed[idx]){ dot.classList.add('done'); dot.innerHTML='&#10003;'; }

  }
}

/* ===== Quiz logic ===== */
function selectOption(qIdx, optIdx){
  if(QUIZ_SUBMITTED) return;
  QUIZ_ANSWERS[qIdx] = optIdx;
  render();
}
function submitQuiz(){
  const mod = getModule(CURRENT_MODULE);
  const total = mod.quiz.length;
  const answeredCount = Object.keys(QUIZ_ANSWERS).length;
  if(answeredCount < total){
    showToast('Please answer all '+total+' questions before submitting.');
    return;
  }
  let correct=0;
  mod.quiz.forEach((q,i)=>{ if(QUIZ_ANSWERS[i]===q.correct) correct++; });
  const score = Math.round((correct/total)*100);
  QUIZ_SUBMITTED = true;
  QUIZ_SCORE = score;
  const s = STATE.modules[mod.num];
  s.attempts += 1;
  const prevBest = s.bestScore;
  const passed = score>=PASS_THRESHOLD;
  if(s.bestScore===null || score>s.bestScore){ s.bestScore = score; }
  if(passed && (prevBest===null || prevBest<PASS_THRESHOLD)){
    STATE.xp += 100;
    showToast('+100 XP &mdash; Module '+mod.num+' completed!');
  } else if(score>EXCELLENT_THRESHOLD-1 && (prevBest===null || prevBest<EXCELLENT_THRESHOLD)){
    STATE.xp += 50;
    showToast('+50 XP &mdash; Excellent score badge unlocked!');
  } else {
    STATE.xp += 10;
  }
  saveState();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function retakeQuiz(){
  QUIZ_ANSWERS = {};
  QUIZ_SUBMITTED = false;
  QUIZ_SCORE = null;
  render();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadCertificate(){
  if(!STATE.studentName || STATE.studentName.trim().length<2){
    showToast('Please enter your full name first.');
    return;
  }
  const html = certificateHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);

  a.href = url;
  a.download = 'Digital_Medical_Science_Liaison_Certificate.html';
  document.body.appendChild(a);
  a.click();

/* ===== Copy prompt (AI Prompt Template blocks) ===== */
function copyPrompt(btn, text){
  const finish = ()=>{
    const original = btn.getAttribute('data-label') || 'Copy';
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(finish);
  } else {
    finish();
  }
}

  const viewedCount = STATE.modules[m.num].lessonsViewed.filter(Boolean).length;
  return `
  <div class="grid grid-2">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px;">Module Objective</h3>
      <p style="font-size:13.5px;color:var(--muted);">${m.objective}</p>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px;">Your Progress in this Module</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:8px;">${viewedCount}/${m.lessons.length} lessons opened &middot; ${STATE.modules[m.num].attempts} quiz attempt(s)</p>
      <div class="progressbar"><div style="width:${Math.round((viewedCount/m.lessons.length)*100)}%"></div></div>
    </div>
  </div>
  <div class="block">
    <h3 style="font-size:15px;margin-bottom:14px;">What you will master</h3>
    <div class="grid grid-2">
      ${m.lessons.slice(0,8).map(l=>`<div class="example-item"><div class="dot"></div><p><strong style="color:var(--fg);">${l.title}.</strong></p></div>`).join('')}
    </div>
  </div>
  <div class="block" style="text-align:center;">
    <button class="btn btn-primary" onclick="setTab('lessons')">Start Lessons &rarr;</button>
  </div>
  `;
}

function renderLessonsTab(m){
  return `
  <div>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Click a lesson to read it, or click the circle to mark it complete &mdash; click the circle again to undo it.</p>
    ${m.lessons.map((l,idx)=>{
      const done = STATE.modules[m.num].lessonsViewed[idx];
      return `<div class="lesson-item" id="lesson-${idx}">
        <div class="lesson-head" onclick="toggleLesson(${idx})">
          <div class="lesson-head-left">
            <div class="lesson-check ${done?'done':''}" id="lessoncheck-${idx}" title="Mark as complete / incomplete" onclick="toggleLessonDone(event, ${idx})">${done?'&#10003;':''}</div>
            <div><div class="lesson-num">LESSON ${idx+1}</div><div class="lesson-title">${l.title}</div></div>
          </div>
          <div class="chevron">&#9660;</div>
        </div>
        <div class="lesson-body"><div class="lesson-body-inner">${renderLessonText(l.text)}${renderLessonSources(l.sources)}</div></div>
      </div>`;
    }).join('')}
  </div>
  `;
}

function renderLessonText(text){
  return String(text||'').split(/\n\n+/).map(p=>`<p>${p}</p>`).join('');
}

function renderLessonSources(sources){
  if(!sources || !sources.length) return '';
  return `<div class="lesson-sources">
    <h5>Further Reading &amp; Sources</h5>
    <ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a></li>`).join('')}</ol>
  </div>`;
}

function renderCasesTab(m){
  return `
  <h3 style="font-size:15px;margin-bottom:14px;">Practical Examples</h3>
  ${m.examples.map(e=>`<div class="example-item"><div class="dot"></div><p>${e}</p></div>`).join('')}
  <div class="case-box">
    <div class="case-label">Applied Case Study</div>
    <h4>${m.caseTitle}</h4>
    <p>${m.caseText}</p>
  </div>
  `;
}

function renderQuizTab(m){
  const s = STATE.modules[m.num];
  if(QUIZ_SUBMITTED){
    return renderQuizResult(m);
  }
  const answeredCount = Object.keys(QUIZ_ANSWERS).length;
  return `
  <div class="quiz-intro">
    <div>
      <h3 style="font-size:16px;">Module ${m.num} Exam &mdash; 10 Questions</h3>
      <p style="font-size:13px;color:var(--muted);margin-top:4px;">Pass mark: ${PASS_THRESHOLD}%. Answered: ${answeredCount}/10.</p>
    </div>
    <div class="best">Best score so far<br><b>${s.bestScore!==null? s.bestScore+'%' : '&mdash;'}</b></div>
  </div>
  <div class="block">
    ${m.quiz.map((q,i)=>renderQuizQuestion(q,i,false)).join('')}
  </div>
  <div class="quiz-actions">
    <span style="font-size:12.5px;color:var(--muted);">You can retake this exam as many times as you need. Your best score is always saved.</span>
    <button class="btn btn-primary" onclick="submitQuiz()">Submit Exam</button>
  </div>
  `;
}

function renderQuizQuestion(q, i, answered){
  const selected = QUIZ_ANSWERS[i];
  const letters = ['A','B','C','D'];
  return `
  <div class="quiz-q ${QUIZ_SUBMITTED?'answered':''}">
    <div class="qnum">QUESTION ${i+1} / 10</div>
    <div class="qtext">${q.q}</div>
    ${q.options.map((opt,oi)=>{
      let cls='option';
      if(QUIZ_SUBMITTED){
        if(oi===q.correct) cls+=' correct';
        else if(oi===selected) cls+=' incorrect';
      } else if(selected===oi){ cls+=' selected'; }
      return `<div class="${cls}" onclick="selectOption(${i},${oi})">
        <div class="letter">${letters[oi]}</div><div>${opt}</div>
      </div>`;
    }).join('')}
    ${QUIZ_SUBMITTED? `<div class="feedback-box ${selected===q.correct?'ok':'ko'}">
      <strong>${selected===q.correct?'Correct. ':'Incorrect. '}</strong>${q.explain}
    </div>` : ''}
  </div>`;
}

function renderQuizResult(m){
  const score = QUIZ_SCORE;
  const passed = score>=PASS_THRESHOLD;
  const excellent = score>=EXCELLENT_THRESHOLD;
  let msg = '';
  if(excellent) msg = 'Outstanding performance. You demonstrate senior-level command of this module\'s content.';
  else if(passed) msg = 'Well done. You have met the mastery bar for this module.';
  else msg = 'Not passed yet. Review the lessons and retake the exam &mdash; you need '+PASS_THRESHOLD+'% to complete this module.';
  return `
  <div class="quiz-result">
    <div class="score">${score}%</div>
    <div class="msg">${msg}</div>
    ${passed? `<div class="pass">&#10003; Module ${excellent?'Completed with Excellence':'Completed'}</div>` : ''}
  </div>
  <div class="block">
    ${m.quiz.map((q,i)=>renderQuizQuestion(q,i,true)).join('')}
  </div>
  <div class="quiz-actions">
    <button class="btn btn-outline" onclick="retakeQuiz()">Retake Exam</button>
    ${passed? `<button class="btn btn-primary" onclick="openModule(${Math.min(m.num+1,TOTAL_MODULES)})">${m.num<TOTAL_MODULES? 'Continue to Next Module &rarr;' : 'Go to Certificate &rarr;'}</button>` : ''}
  </div>
  `;
}

function renderResourcesTab(m){
  const r = m.resources;
  const promptEscaped = escapeHtml(r.prompt).replace(/`/g,'&#96;');
  return `
  <div class="grid grid-2">
    <div class="res-card">
      <h4>&#128218; Core Framework</h4>
      <p>${r.framework}</p>
    </div>
    <div class="res-card">
      <h4>&#9989; Practical Checklist</h4>
      <ul>${r.checklist.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
    <div class="res-card" style="grid-column:1/-1;">
      <h4>&#129302; AI Prompt Template</h4>
      <div class="promptwrap">
        <div class="prompttop">
          <span class="plabel">AI Prompt</span>
          <button class="copybtn" data-label="Copy" onclick="copyPrompt(this, this.closest('.promptwrap').querySelector('.prompt').textContent)">Copy</button>
        </div>
        <pre class="prompt">${promptEscaped}</pre>
      </div>
    </div>
    <div class="res-card" style="grid-column:1/-1;">
      <h4>&#128203; Working Template</h4>
      <p>${r.template}</p>
    </div>
  </div>
  <div class="res-card block">
    <h4>&#128213; Mini-Glossary</h4>
    ${r.glossary.map(g=>`<div class="glossary-term"><b>${g.term}</b><span>${g.def}</span></div>`).join('')}
  </div>
  `;
}
</script>
<script>
function renderCertificatePage(){
  const done = completedModulesCount();
  const unlocked = certificateUnlocked();
  if(!unlocked){
    return `
    <div class="section-title">Certificate of Completion</div>
    <div class="section-sub">Complete all 12 modules with at least ${PASS_THRESHOLD}% to unlock your certificate.</div>
    <div class="cert-locked">
      <div class="lock-icon">&#128274;</div>
      <h3 style="font-size:18px;margin-bottom:8px;">Certificate Locked</h3>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">You have completed ${done}/${TOTAL_MODULES} modules. Finish the remaining modules to unlock your certificate.</p>
      <div class="progressbar" style="max-width:360px;margin:0 auto 20px;"><div style="width:${Math.round((done/TOTAL_MODULES)*100)}%"></div></div>
      <button class="btn btn-primary" onclick="goTo('curriculum')">Go to Curriculum</button>
    </div>`;
  }
  const score = averageScore();
  const date = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  return `
  <div class="section-title">Certificate of Completion</div>
  <div class="cert-unlocked-banner">
    <h3>&#127881; Certificate Unlocked</h3>
    <p style="color:rgba(255,255,255,.85);font-size:14px;margin-top:6px;">Congratulations &mdash; you have completed all ${TOTAL_MODULES} modules of the Digital Medical Science Liaison Online Course.</p>
  </div>
  <div class="cert-form">
    <label>Full name (as it should appear on the certificate)</label>
    <input type="text" placeholder="e.g. Dr. Jane Smith" value="${escapeHtml(STATE.studentName||'')}" oninput="updateStudentName(this.value)">
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="generateCertificate()">Preview Certificate</button>
      <button class="btn btn-gold" onclick="downloadCertificate()">Download Certificate</button>
    </div>
  </div>
  <div class="cert-preview" id="certPreview">
    <img src="${LOGO_ON_LIGHT}" alt="Digital MSL" style="width:64px;height:64px;margin-bottom:12px;">
    <div class="cert-eyebrow">Certificate of Completion</div>
    <h2>Digital Medical Science Liaison Online Course</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:14px;">This certifies that</p>
    <div class="cert-name">${escapeHtml(STATE.studentName || 'Your Name Here')}</div>
    <p class="cert-course">has successfully completed the advanced online course <strong>Digital Medical Science Liaison Online Course &mdash; Advanced Course for MSL &amp; Medical Affairs Excellence</strong></p>
    <div class="cert-meta">
      <div><div class="num">12/12</div><div class="label">Modules Completed</div></div>
      <div><div class="num">${score}%</div><div class="label">Final Average Score</div></div>
      <div><div class="num">${date}</div><div class="label">Date</div></div>
    </div>
    <div class="cert-sign">Issued by<br><strong style="color:var(--primary);font-style:normal;">Digital Medical Science Liaison Online Course</strong></div>
  </div>
  `;
}
</script>

<script>
/* ===== Boot ===== */
(function init(){
  // The marketing pitch lives on /dmsl-course.html now — arriving here
  // goes straight to log in / create account, not a duplicate landing.
  VIEW = 'auth';
  AUTH_MODE = 'login';
  render();
  // Real session check — an HttpOnly cookie, not localStorage. Runs after
  // the first paint so the page isn't blocked on a network round-trip.
  apiCall('me').then(function(data){
    if(data && data.ok && data.authenticated){
      CURRENT_USER = data.email;
      STATE = stateFromProgress(data.progress);
      if(STATE.lastModule){ CURRENT_MODULE = STATE.lastModule; }
      render();
    }
  }).catch(function(){ /* not logged in / offline — stay on hero */ });
})();
</script>
</body>
</html>
