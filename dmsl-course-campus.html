<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMSL Course Campus — Digital Medical Science Liaison Online Course | Albert Ruiz de la Oliva</title>
<meta name="description" content="Student campus for the Digital Medical Science Liaison Online Course — 12 modules, quizzes and certificate.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.albertruizdelaoliva.com/dmsl-course-campus.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Albert Ruiz de la Oliva">
<meta property="og:title" content="DMSL Course Campus">
<meta property="og:url" content="https://www.albertruizdelaoliva.com/dmsl-course-campus.html">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#7A00E6;
  --primary-dark:#5E12A1;
  --accent:#AB30E8;
  --fg:#1F242E;
  --muted:#737373;
  --border:#E6E1EB;
  --surface:#F0EAF7;
  --bg:#FFFFFF;
  --grad:linear-gradient(135deg,#7A00E6 0%,#5E12A1 100%);
  --grad-soft:linear-gradient(135deg,#AB30E8 0%,#7A00E6 100%);
  --shadow:0 10px 30px rgba(94,18,161,.12);
  --shadow-sm:0 4px 14px rgba(94,18,161,.08);
  --radius:16px;
  --radius-sm:10px;
  --success:#16a34a;
  --success-bg:#f1f9f3;
  --success-border:#cfe9d6;
  --danger:#c23b53;
  --danger-bg:#fdf3f4;
  --danger-border:#f4d4d9;
  --font-title:'Poppins',system-ui,-apple-system,sans-serif;
  --font-body:'Poppins',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  color:var(--fg);
  background:var(--bg);
  line-height:1.6;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{font-family:var(--font-title);color:var(--fg);font-weight:700;letter-spacing:-.01em;line-height:1.15;}
.num, .metric{font-weight:800;font-variant-numeric:tabular-nums;}
a{color:var(--primary);text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
ul{list-style:none;}
::selection{background:var(--surface);color:var(--primary-dark);}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d8cfe6;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{min-height:100vh;display:flex;flex-direction:column;}

/* Header */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--grad);
  color:var(--bg);
  padding:0 24px;
  height:66px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.topbar-logo-img{width:100%;height:100%;object-fit:contain;display:block;}
.hero-logo{position:relative;z-index:1;width:64px;height:64px;margin-bottom:18px;display:block;}
.topbar-brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;}
.topbar-title{font-family:var(--font-title);font-weight:700;font-size:15px;color:#fff;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw;}
.topbar-title small{display:block;font-weight:500;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-right{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-nav-extra{display:flex;align-items:center;gap:8px;}
@media (max-width:640px){
  .topbar-nav-extra{display:none;}
  .topbar-title{max-width:36vw;font-size:13px;}
  .topbar-title small{display:none;}
}
.topbar-progress{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.14);
  padding:6px 14px;border-radius:999px;
  font-size:12px;font-weight:700;color:#fff;
}
.topbar-progress .bar{width:70px;height:6px;border-radius:6px;background:rgba(255,255,255,0.25);overflow:hidden;}
.topbar-progress .bar>div{height:100%;background:#fff;border-radius:6px;transition:width .5s ease;}
.nav-btn{
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.85);transition:.2s;
}
.nav-btn:hover{background:rgba(255,255,255,0.14);color:#fff;}
.nav-btn.active{background:rgba(255,255,255,0.22);color:#fff;}
.hamburger{display:none;color:#fff;font-size:22px;padding:6px;}

/* Layout */
.layout{flex:1;display:flex;width:100%;max-width:1440px;margin:0 auto;min-height:0;}
.sidebar{
  width:280px;flex:none;background:var(--bg);
  border-right:1px solid var(--border);
  padding:22px 14px 40px;
  position:sticky;top:66px;align-self:flex-start;
  height:calc(100vh - 66px);overflow-y:auto;
}
.sidebar-head{padding:4px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.sidenav-kic{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px;}
.sidenav-title{font-weight:700;font-size:14px;color:var(--primary-dark);line-height:1.25;display:block;}
.sidebar-section-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:700;margin:18px 8px 8px;
}
.sidebar-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:12px;margin-bottom:4px;
  cursor:pointer;transition:.15s;
}
.sidebar-item:hover{background:var(--surface);}
.sidebar-item.active{background:var(--grad-soft);box-shadow:var(--shadow-sm);}
.sidebar-item.active .sidebar-item-title{color:#fff;}
.sidebar-item.active .sidebar-item-num{background:rgba(255,255,255,.28);color:#fff;}
.sidebar-item-num{
  width:26px;height:26px;border-radius:8px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary);flex:none;
}
.sidebar-item-title{font-size:13px;font-weight:600;color:var(--fg);flex:1;line-height:1.3;}
.sidebar-item-status{width:9px;height:9px;border-radius:50%;flex:none;}
.status-not_started{background:#CBD5E1;}
.status-in_progress{background:var(--accent);}
.status-completed{background:var(--success);}
.status-excellent{background:var(--primary);box-shadow:0 0 0 3px rgba(122,0,230,.18);}

/* Progress ring */
.sidenav-progress{text-align:center;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.progress-ring{position:relative;width:88px;height:88px;margin:0 auto 8px;}
.progress-ring svg{width:88px;height:88px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:7;}
.ring-fg{fill:none;stroke:var(--primary);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .55s cubic-bezier(0.34,1.2,0.5,1);}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:var(--primary);}
.progress-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}

.main{flex:1;min-width:0;padding:34px;}
@media (max-width:980px){
  .sidebar{display:none;}
  .sidebar.mobile-open{
    display:block;position:fixed;top:66px;left:0;right:0;bottom:0;
    width:100%;height:calc(100vh - 66px);z-index:90;box-shadow:var(--shadow);
  }
  .hamburger{display:block;}
  .main{padding:18px;}
}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:999px;font-weight:600;font-size:14px;
  transition:.18s ease;white-space:nowrap;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{opacity:.92;transform:translateY(-1px);}
.btn-gold{background:var(--grad-soft);color:#fff;box-shadow:var(--shadow-sm);}
.btn-gold:hover{opacity:.92;transform:translateY(-1px);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--primary);background:var(--surface);}
.btn-onhero{background:rgba(255,255,255,0.12) !important;color:#fff !important;border-color:rgba(255,255,255,0.35) !important;}
.btn-onhero:hover{background:rgba(255,255,255,0.2) !important;}
.btn-ghost{color:var(--primary);background:var(--surface);}
.btn-ghost:hover{background:#e5d9f5;}
.btn-danger{color:var(--danger);background:var(--danger-bg);}
.btn-danger:hover{background:#fbdfe4;}
.btn-sm{padding:8px 16px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}

/* ===== Hero ===== */
.hero{
  background:var(--grad);
  color:#fff;border-radius:24px;padding:80px 56px 72px;position:relative;overflow:hidden;
  animation:fadeIn .5s ease;
}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;background:radial-gradient(circle,rgba(171,48,232,.55),transparent 70%);border-radius:50%;}
.hero-eyebrow{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);
  padding:6px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.05em;
  color:#fff;margin-bottom:20px;
}
.hero h1{position:relative;z-index:1;font-size:clamp(34px,5vw,58px);color:#fff;line-height:1.05;max-width:820px;}
.hero .subtitle{position:relative;z-index:1;font-size:clamp(17px,2vw,21px);color:#fff;opacity:.95;font-weight:600;margin-top:14px;max-width:720px;}
.hero p.desc{position:relative;z-index:1;margin-top:18px;max-width:680px;opacity:.9;font-size:15px;}
.hero-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:38px;max-width:920px;}
.hero-stat{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:14px;padding:16px 18px;}
.hero-stat .num{font-size:26px;color:#fff;display:block;}
.hero-stat .label{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;}
.hero-actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:14px;margin-top:38px;}
@media (max-width:640px){.hero{padding:44px 26px;}}

/* ===== Section headers ===== */
.section-title{font-size:25px;margin-bottom:4px;}
.section-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
.block{margin-top:44px;}

/* ===== Cards ===== */
.card{
  background:var(--bg);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:.2s;
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.dash-card{display:flex;flex-direction:column;gap:6px;}
.dash-card .icon{width:42px;height:42px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px;}
.dash-card .num{font-size:30px;color:var(--primary);}
.dash-card .label{font-size:13px;color:var(--muted);font-weight:600;}

.progressbar{height:9px;border-radius:8px;background:var(--surface);overflow:hidden;}
.progressbar>div{height:100%;border-radius:8px;background:var(--grad-soft);transition:width .6s ease;}

.rank-banner{
  background:var(--grad);color:#fff;
  border-radius:var(--radius);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.rank-banner .rank-name{font-size:20px;color:#fff;}
.rank-pill{background:rgba(255,255,255,0.2);color:#fff;padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;}

/* Module cards (curriculum) */
.mod-card{cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;}
.mod-card .mod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.mod-card .mod-index{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.04em;}
.mod-card h3{font-size:16px;line-height:1.3;}
.mod-card p{font-size:13px;color:var(--muted);}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
.badge-not_started{background:#EEF0F2;color:#6b7280;}
.badge-in_progress{background:#F3E4FC;color:var(--accent);}
.badge-completed{background:var(--success-bg);color:var(--success);}
.badge-excellent{background:#EBDBFC;color:var(--primary-dark);}
.mod-card .mod-score{font-size:12px;font-weight:700;color:var(--primary);margin-top:4px;}

/* ===== Module detail ===== */
.module-header{
  background:var(--bg);border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow-sm);border:1px solid var(--border);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;
}
.module-header h2{font-size:24px;}
.module-header .objective{font-size:14px;color:var(--muted);margin-top:8px;max-width:640px;}
.tabs{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{
  padding:11px 18px;font-size:13.5px;font-weight:600;color:var(--muted);
  border-bottom:2.5px solid transparent;white-space:nowrap;
}
.tab-btn.active{color:var(--primary);border-color:var(--primary);}
.tab-panel{display:none;animation:fadeIn .35s ease;padding-top:26px;}
.tab-panel.active{display:block;}

/* Lessons accordion */
.lesson-item{background:var(--bg);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.lesson-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer;gap:12px;}
.lesson-head:hover{background:var(--surface);}
.lesson-head-left{display:flex;align-items:center;gap:12px;}
.lesson-check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:.2s;cursor:pointer;
}
.lesson-check:hover{border-color:var(--primary);background:var(--surface);}
.lesson-check.done{background:var(--success);border-color:var(--success);}
.lesson-title{font-size:14px;font-weight:600;color:var(--fg);}
.lesson-num{font-size:11px;color:var(--accent);font-weight:700;}
.chevron{transition:.25s;color:var(--muted);font-size:13px;}
.lesson-item.open .chevron{transform:rotate(180deg);}
.lesson-body{max-height:0;overflow:hidden;transition:max-height .4s ease;}
.lesson-item.open .lesson-body{max-height:5000px;}
.lesson-body-inner{padding:0 18px 18px 52px;font-size:13.5px;color:var(--fg);}
.lesson-body-inner p{margin-bottom:12px;line-height:1.6;}
.lesson-body-inner p:last-of-type{margin-bottom:0;}
.lesson-sources{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
.lesson-sources h5{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;font-weight:700;}
.lesson-sources ol{list-style:decimal;padding-left:18px;margin:0;}
.lesson-sources li{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.5;}
.lesson-sources a{color:var(--accent);text-decoration:none;word-break:break-word;}
.lesson-sources a:hover{text-decoration:underline;}

/* Practical cases */
.example-item{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;
  display:flex;gap:12px;align-items:flex-start;
}
.example-item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
.example-item p{font-size:13.5px;color:var(--fg);}
.case-box{
  background:var(--grad);color:#fff;border-radius:18px;padding:26px 28px;margin-top:22px;
}
.case-box .case-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;margin-bottom:8px;}
.case-box h4{color:#fff;font-size:17px;margin-bottom:10px;}
.case-box p{font-size:14px;color:rgba(255,255,255,.9);}

/* Resources */
.res-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.res-card h4{font-size:14px;color:var(--primary-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.res-card p, .res-card li{font-size:13.5px;color:var(--fg);}
.res-card ul{margin-top:6px;}
.res-card li{padding:4px 0;padding-left:18px;position:relative;}
.res-card li:before{content:"✓";position:absolute;left:0;color:var(--success);font-weight:700;}
.glossary-term{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.glossary-term:last-child{border:none;}
.glossary-term b{color:var(--primary-dark);min-width:150px;flex:none;}

/* AI Prompt block — dark code style with copy button */
.promptwrap{margin-top:14px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #2a2142;}
.prompttop{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#120d24;padding:11px 14px 11px 18px;}
.plabel{color:#c79bff;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.copybtn{background:var(--grad-soft);color:#fff;border:none;border-radius:999px;padding:7px 16px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:opacity .15s,background .2s;white-space:nowrap;flex:0 0 auto;}
.copybtn:hover{opacity:.9;}
.copybtn.copied{background:var(--success);}
.prompt{background:#1b1430;color:#e8e2f5;margin:0;padding:18px 20px;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.62;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}

/* ===== Quiz ===== */
.quiz-intro{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:var(--shadow-sm);}
.quiz-intro .best{font-size:13px;color:var(--muted);}
.quiz-intro .best b{color:var(--primary);font-size:16px;}
.quiz-q{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.quiz-q .qnum{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:6px;}
.quiz-q .qtext{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:16px;line-height:1.45;}
.option{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;
  margin-bottom:9px;cursor:pointer;transition:.15s;font-size:13.5px;
}
.option:hover{border-color:var(--primary);background:var(--surface);}
.option.selected{border-color:var(--primary);background:var(--surface);}
.option .letter{
  width:24px;height:24px;border-radius:8px;background:var(--surface);color:var(--muted);font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.option.selected .letter{background:var(--grad-soft);color:#fff;}
.quiz-q.answered .option{cursor:default;pointer-events:none;}
.quiz-q.answered .option.correct{border-color:var(--success-border);background:var(--success-bg);}
.quiz-q.answered .option.correct .letter{background:var(--success);color:#fff;}
.quiz-q.answered .option.incorrect{border-color:var(--danger-border);background:var(--danger-bg);}
.quiz-q.answered .option.incorrect .letter{background:var(--danger);color:#fff;}
.feedback-box{margin-top:12px;padding:12px 16px;border-radius:12px;font-size:13px;display:none;}
.quiz-q.answered .feedback-box{display:block;animation:fadeIn .3s ease;}
.feedback-box.ok{background:var(--success-bg);color:#166534;border-left:4px solid var(--success);}
.feedback-box.ko{background:var(--danger-bg);color:#8f2b3f;border-left:4px solid var(--danger);}
.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:14px;}
.quiz-result{
  background:var(--grad);color:#fff;border-radius:20px;padding:34px;text-align:center;margin-bottom:20px;
  animation:fadeIn .4s ease;box-shadow:var(--shadow);
}
.quiz-result .score{font-size:52px;color:#fff;}
.quiz-result .msg{font-size:15px;color:rgba(255,255,255,.9);margin-top:6px;max-width:480px;margin-left:auto;margin-right:auto;}
.quiz-result .pass{color:#fff;background:rgba(255,255,255,.18);padding:6px 16px;border-radius:999px;font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin-top:16px;display:inline-block;}
.xp-toast{
  position:fixed;bottom:26px;right:26px;background:var(--grad);color:#fff;padding:14px 22px;border-radius:14px;
  box-shadow:var(--shadow);font-size:13px;font-weight:600;z-index:999;display:flex;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;transition:.35s ease;
}
.xp-toast.show{transform:translateY(0);opacity:1;}
.xp-toast .gold{color:#fce38a;font-size:16px;}

/* ===== Certificate ===== */
.cert-locked{
  background:var(--bg);border:1.5px dashed var(--border);border-radius:20px;padding:48px;text-align:center;
}
.cert-locked .lock-icon{font-size:38px;margin-bottom:14px;}
.cert-unlocked-banner{
  background:var(--grad);color:#fff;border-radius:20px;padding:30px;text-align:center;margin-bottom:24px;box-shadow:var(--shadow);
}
.cert-unlocked-banner h3{color:#fff;font-size:22px;}
.cert-form{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:520px;margin:0 auto;box-shadow:var(--shadow-sm);}
.cert-form label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;}
.cert-form input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:18px;font-family:inherit;
}
.cert-form input:focus{outline:none;border-color:var(--primary);}
.cert-preview{
  border-radius:22px;padding:44px 36px;text-align:center;background:var(--bg);
  position:relative;max-width:720px;margin:26px auto 0;box-shadow:var(--shadow);
}
.cert-preview:before{content:"";position:absolute;inset:0;border-radius:22px;padding:3px;background:var(--grad-soft);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.cert-preview .cert-eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.cert-preview h2{font-size:26px;margin-top:10px;color:var(--primary-dark);}
.cert-preview .cert-name{font-size:30px;color:var(--fg);margin:18px 0;font-family:var(--font-title);border-bottom:2px solid var(--surface);display:inline-block;padding-bottom:8px;}
.cert-preview .cert-course{font-size:15px;color:var(--fg);max-width:520px;margin:0 auto;}
.cert-meta{display:flex;justify-content:center;gap:36px;margin-top:26px;flex-wrap:wrap;}
.cert-meta div{text-align:center;}
.cert-meta .num{font-size:20px;color:var(--primary);}
.cert-meta .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.cert-sign{margin-top:34px;font-size:13px;color:var(--muted);font-style:italic;}

.footer-note{text-align:center;color:var(--muted);font-size:12px;padding:40px 20px 10px;}

/* ===== Auth screens ===== */
.user-chip{font-size:12px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.auth-card{background:var(--bg);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow);animation:fadeIn .4s ease;}
.auth-tabs{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;margin-bottom:26px;}
.auth-tab{flex:1;padding:10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);text-align:center;transition:.2s;}
.auth-tab.active{background:var(--grad);color:#fff;box-shadow:var(--shadow-sm);}
.auth-card label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;margin-top:14px;}
.auth-card input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;}
.auth-card input:focus{outline:none;border-color:var(--primary);}
.auth-error{background:var(--danger-bg);border-left:4px solid var(--danger);color:#8f2b3f;padding:10px 14px;border-radius:10px;font-size:13px;margin:10px 0 0;}
.demo-note{font-size:11.5px;color:var(--muted);margin-top:24px;text-align:center;line-height:1.5;}
.otp-inbox{background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px;padding:16px 18px;margin:18px 0 6px;}
.otp-inbox-label{font-size:12px;font-weight:700;color:var(--primary-dark);margin-bottom:6px;}
.otp-code{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:800;letter-spacing:.3em;color:var(--primary);text-align:center;background:#fff;border-radius:12px;padding:12px;margin-top:6px;border:1px solid var(--border);}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (max-width:640px){
  .quiz-result .score{font-size:38px;}
  .cert-preview{padding:28px 18px;}
  .cert-preview .cert-name{font-size:22px;}
}
.hidden{display:none !important;}
</style>

<script>
const COURSE_DATA = [{"num": 1, "title": "Medical Affairs Foundations & Strategic Role", "objective": "Understand the strategic role of Medical Affairs within the modern pharmaceutical industry, and its function as an independent unit connecting science, clinical practice and business strategy without promotional bias.", "lessons": [{"title": "What Medical Affairs is and why it exists", "text": "Medical Affairs is the function inside a pharmaceutical, biotech or medtech company responsible for generating, interpreting and communicating scientific and clinical evidence so that a medicine or device is used in the safest, most effective and most appropriate way. It exists because approval by a regulator is not the same as correct use in real clinical practice: a drug label tells a physician what a medicine is indicated for, but it rarely answers the specific question a clinician has in front of a specific patient. Medical Affairs fills that gap with balanced, non-promotional scientific exchange.\n\nHistorically, Medical Affairs grew out of a purely reactive role — responding to unsolicited medical information requests and supporting regulatory submissions. Today, industry analyses from McKinsey and the Medical Affairs Professional Society (MAPS) describe it as a strategic \"third pillar\" of the biopharmaceutical enterprise, standing alongside Research & Development and Commercial. Between 2019 and 2023, the share of Medical Affairs leaders reporting directly to the CEO roughly doubled, from about 30% to nearly 60% — a concrete signal of how central the function has become to corporate strategy, not just to compliance.\n\nWhat makes Medical Affairs structurally different from every other function in the company is its operating principle: independence from commercial objectives. A Medical Science Liaison (MSL) or Medical Advisor does not have a sales target, and every scientific interaction must be able to stand on its own as balanced and evidence-based, whether the data is favourable to the company's product or not. This is not a soft cultural preference; it is a legal and ethical requirement enforced through internal firewalls, codes of practice (e.g., the IFPMA Code, EFPIA Code, PhRMA Code) and regulatory guidance in most major markets.\n\nIn practice, Medical Affairs performs five interconnected activities: scientific engagement with healthcare professionals and Key Opinion Leaders (KOLs); generation of medical insights that inform internal strategy; contribution to evidence generation (real-world evidence, investigator-sponsored studies, registries); medical education and publications; and medical information services that answer unsolicited enquiries with full scientific rigor. None of these activities is optional window-dressing — each addresses a real asymmetry between what regulatory approval proves and what a treating physician actually needs to know.\n\nFor a Medical Science Liaison, understanding why Medical Affairs exists — not just what it does — is the foundation for everything else in this course. Every technique you will learn, from KOL segmentation to insight capture to AI-assisted workflows, only makes sense once you internalise that your value proposition is scientific credibility, not sales influence. The moment that credibility is compromised, the entire function loses its reason to exist, because a Medical Affairs team that behaves like an extension of the sales force offers healthcare professionals nothing they cannot already get from a sales representative.", "sources": [{"label": "McKinsey & Company — A vision for Medical Affairs 2030: Five priorities for patient impact", "url": "https://www.mckinsey.com/industries/life-sciences/our-insights/a-vision-for-medical-affairs-2030-five-priorities-for-patient-impact"}, {"label": "Medical Affairs Professional Society (MAPS) — Has Medical Affairs Truly Achieved a Position as the Third Strategic Pillar?", "url": "https://medicalaffairs.org/elevate-podcasts-medical-affairs-third-strategic-pillar/"}]}, {"title": "Differences between Medical, Commercial, Market Access and R&D", "text": "Every pharmaceutical company organizes itself around four functions that touch a medicine at different points in its life, and confusing their roles is one of the fastest ways for a new MSL to damage their own credibility. Understanding the precise boundaries between them is not bureaucratic trivia — it is the basis of compliant, effective cross-functional work.\n\nResearch & Development (R&D) generates the pivotal clinical data that supports regulatory approval: it designs and runs the clinical trials, defines the Target Product Profile, and hands off a medicine with a defined, regulator-approved label. R&D's time horizon is the longest and its output — the clinical dossier — becomes the foundation everyone else builds on.\n\nMedical Affairs takes that dossier and translates it into real-world scientific value: interpreting the evidence for practising clinicians, generating post-approval evidence (real-world evidence, registries, investigator-sponsored studies) that R&D's pivotal trials could not capture, and maintaining scientific exchange that is deliberately independent of sales targets. McKinsey now explicitly frames Medical Affairs as a strategic pillar in its own right — \"not an interface function or a compliance buffer\" between R&D and Commercial, but a distinct value driver.\n\nMarket Access sits between the science and the health system's economics: it builds the pricing, reimbursement and health-economic value proposition that persuades payers, health technology assessment (HTA) bodies and hospital formularies to fund a medicine. Market Access uses clinical and real-world evidence — often evidence that Medical Affairs helped generate — to build cost-effectiveness and budget-impact arguments.\n\nCommercial owns the promotional relationship with prescribers: sales representatives communicate approved, on-label messages with the explicit goal of driving appropriate use and volume. Commercial's conversations are promotional by design and regulation; Medical Affairs' conversations must never be.\n\nThe line between Medical Affairs and Commercial is protected by what the industry calls a \"firewall\" — a set of governance controls (separate reporting lines, restrictions on sharing commercial targets or customer data, documented rules of engagement) required because unsolicited, balanced medical information and promotional messaging must remain visibly and structurally separate. Guidance from bodies such as the U.S. Department of Health and Human Services Office of Inspector General has explicitly called for medical affairs to maintain \"a respectful distance\" from sales and marketing. A breach of that firewall — for example, an MSL sharing prescriber-level insights that get used to target a sales call, or attending a commercial meeting where product strategy is discussed — is a genuine compliance risk, not just an internal politics issue.\n\nFor an MSL, the practical takeaway is this: your job is to know exactly which conversations belong to which function, to redirect commercial questions to the right colleague, and to protect the independence that makes your own scientific input credible in the first place.", "sources": [{"label": "Medicine to Market — Medical Affairs Is No Longer a Support Function", "url": "https://medicinetomarket.com/medical-affairs-commercial-driver-pharma/"}, {"label": "GCI Health — Bridging the Firewall: A Blueprint for Seamless Medical-Commercial Collaboration", "url": "https://gcihealth.com/2026/07/21/bridging-the-firewall-a-blueprint-for-seamless-medical-commercial-collaboration/"}]}, {"title": "The evolution of Medical Affairs: from scientific support to strategic partner", "text": "For most of its history, Medical Affairs was a reactive, back-office function: it answered unsolicited medical questions, reviewed promotional materials for scientific accuracy, and supported regulatory dossiers. Its budget and headcount were modest compared with Commercial, and its success was measured mostly by absence of problems rather than by positive contribution.\n\nThat model has changed structurally over roughly the last decade, driven by three converging forces documented across McKinsey, Deloitte and ZS industry analyses. First, the products themselves became more complex: specialty and biologic medicines, cell and gene therapies, and companion-diagnostic-linked treatments require a much deeper level of scientific dialogue with prescribers than a traditional small-molecule tablet ever did. Second, payers and health systems started demanding real-world outcomes data that pivotal trials alone cannot provide, which pushed Medical Affairs into evidence-generation work — registries, real-world evidence studies, investigator-sponsored research — that used to sit almost exclusively with R&D. Third, competitive pressure on pricing made scientific differentiation, not just promotional messaging, one of the few remaining levers to defend a product's value proposition with physicians and payers.\n\nThe result is what MAPS and several consultancies now describe as Medical Affairs entering a \"third era\": from a compliance-oriented support function, to a scientific-engagement function, to today's strategic-partner model where Medical Affairs leadership co-designs launch strategy, evidence-generation plans and even parts of the Target Product Profile alongside R&D and Commercial from early development onward. A concrete marker of this shift: the proportion of Medical Affairs leaders reporting directly to the CEO nearly doubled between 2019 and 2023.\n\nThis evolution changes what is expected of every individual working in the function, including MSLs. A reactive Medical Affairs professional waits for questions and answers them accurately. A strategic Medical Affairs professional anticipates evidence gaps before they become urgent, structures field insights so they actually change internal decisions, and can articulate — in a boardroom, not just in a scientific exchange — how their work moved a clinical or commercial outcome. Case documentation, such as the AstraZeneca Spain experience published in scientific literature, shows this playing out concretely: Medical Affairs teams that understood the local healthcare ecosystem well enough to position themselves as genuine strategic partners, rather than just field scientific responders, achieved measurably greater organisational influence.\n\nFor someone starting or advancing an MSL career today, this means the bar has moved. Scientific accuracy and compliance are the non-negotiable floor, not the ceiling. The professionals who advance fastest into Medical Advisor, Medical Lead and Medical Director roles are the ones who can operate with genuine strategic thinking — connecting what they hear in the field to the medical plan, the evidence-generation agenda and, ultimately, patient outcomes.", "sources": [{"label": "ZS — Talent and culture needs for the third era of medical affairs: Impact @ scale", "url": "https://www.zs.com/insights/talent-and-culture-needs-for-the-third-era-of-medical-affairs"}, {"label": "PMC — Understanding the National Healthcare Ecosystem to Position Medical Affairs as a Strategic Element: Lessons Learned from AstraZeneca Spain", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11880095/"}]}, {"title": "Medical value across the product lifecycle", "text": "A medicine's relationship with Medical Affairs does not start at launch and does not end at loss of exclusivity — it runs across the entire lifecycle, and the nature of medical value shifts substantially at each stage. Thinking in these stages is one of the most useful mental models an MSL can carry, because it explains why the same scientific question can require a completely different response depending on timing.\n\nPre-launch. Before approval, Medical Affairs contributes to shaping the Target Product Profile, running early scientific engagement with KOLs to understand unmet needs, and building disease-state education so that the healthcare community understands the condition — independent of any specific product — before a launch conversation is even possible. This is also when Medical Affairs begins mapping the evidence landscape: what data already exists, and what gaps the pivotal trials will not close.\n\nLaunch. At launch, medical value is about translation and education: turning a dense clinical trial dataset into something a busy clinician can actually use in a consultation. This is peak scientific-exchange intensity — new mechanism of action, new dosing, new safety profile, all needing to be communicated accurately and rapidly across a prescriber base that has, by definition, no prior experience with the product.\n\nPost-launch (growth and maturity). Once a product is established, the center of gravity shifts toward real-world evidence generation, because pivotal trials — run in controlled populations under ideal conditions — cannot answer everything a payer, guideline committee or treating physician needs to know about how the medicine performs in everyday, heterogeneous patients. This is where registries, real-world evidence studies and investigator-sponsored research become the primary evidence-generation tools, often directly informed by the insights MSLs bring back from the field.\n\nLoss of exclusivity (LOE). As generics or biosimilars enter the market, medical value shifts again — toward sustaining the differentiated clinical evidence base (long-term safety data, specific subpopulation data, new formulations or delivery methods) that a generic competitor cannot replicate, and toward supporting appropriate continuity of care decisions rather than pure promotion.\n\nUnderstanding which lifecycle stage a product is in tells an MSL what kind of medical value they should be generating in the field. Asking for real-world evidence input on a product that launched six weeks ago is premature; still running pure disease-education content three years post-launch, when physicians already understand the mechanism well, wastes an opportunity to gather the deeper real-world insights the product now needs. Reading the lifecycle stage correctly — and adjusting the scientific conversation accordingly — is a mark of a mature Medical Affairs professional, not a junior one.", "sources": [{"label": "McKinsey & Company — Medical Affairs insights", "url": "https://www.mckinsey.com/industries/life-sciences/how-we-help-clients/medical-affairs/medical-affairs-insights"}]}, {"title": "Patient centricity and health value", "text": "Patient centricity is often used as a marketing slogan, but it has a precise, working definition in the industry: an organizational culture and set of practices that consistently place patients at the centre of decision-making, responding to needs articulated by patients themselves, while still driving legitimate business outcomes. A widely cited collaborative definition from Patient Engagement for Medicines Development describes it as \"putting the patient first in an open and sustained engagement of the patient to respectfully and compassionately achieve the best experience and outcome for that person and their family.\" For Medical Affairs, that is not a values statement to put on a slide — it changes what counts as good scientific work.\n\nThe shift patient centricity demands is from thinking about \"the pill\" to thinking about \"health\" — the physical, mental, social and emotional dimensions of what a patient actually experiences living with a condition and a treatment. A medicine can be efficacious on a trial endpoint and still fail patients if it is delivered in a way that ignores adherence barriers, quality-of-life impact, or the practical realities of a patient's daily life. Medical Affairs sits closer to this reality than almost any other function, because MSLs regularly hear from clinicians about how a treatment actually plays out for real patients — not just for the idealized population enrolled in a pivotal trial.\n\nHealth value, in this framing, is the outcome patient centricity is meant to produce: not simply \"does the drug work,\" but \"does the drug improve the outcomes and experience that matter most to the patient, delivered in a system that can sustain that improvement.\" This is precisely why patient-reported outcomes (PROs), quality-of-life measures and real-world evidence have become central to modern evidence-generation plans — they are the tools that let Medical Affairs actually measure health value rather than assume it from a surrogate endpoint.\n\nConcretely, patient centricity changes an MSL's field practice in at least three ways. First, it reframes what counts as a valuable medical insight: a clinician's observation about a barrier to adherence, or a subgroup that responds poorly for reasons the label doesn't capture, is exactly as important as a purely mechanistic scientific question. Second, it justifies why Medical Affairs increasingly partners with patient advocacy groups and engages, where appropriate and compliant, with patient organizations to understand lived experience directly, rather than only through the clinician's account of it. Third, it reshapes how evidence-generation priorities get set: real-world evidence studies increasingly build in patient-reported endpoints alongside clinical ones, because payers and prescribers alike now expect that dimension of proof.\n\nFor an MSL, keeping patient centricity genuinely operational — not decorative — means asking, in every scientific exchange: what does this conversation ultimately change for the patient at the other end of the prescription?", "sources": [{"label": "Patient Engagement for Medicines Development — Patient centricity: a collaborative definition", "url": "https://patientfocusedmedicine.org/patient-centricity-collaborative-definition/"}, {"label": "ZS — Patient centricity in action: How medical affairs drives change", "url": "https://www.zs.com/insights/patient-centricity-medical-affairs"}]}, {"title": "Medical Affairs as a translator between science, clinical practice and strategy", "text": "If Medical Affairs has one irreplaceable function, it is translation — moving information accurately across three languages that rarely speak to each other directly: the language of scientific evidence, the language of everyday clinical practice, and the language of corporate strategy. Losing accuracy in any one direction of that translation is where Medical Affairs professionals most often fail, even when their individual scientific knowledge is strong.\n\nTranslating science into clinical practice means taking a clinical trial's statistical findings — a hazard ratio, a confidence interval, a subgroup analysis — and expressing what it actually means for the decision a physician makes in a ten-minute consultation with a specific patient. This is harder than it sounds, because trial populations, endpoints and statistical significance do not map cleanly onto an individual patient sitting in front of a clinician today. An MSL who can only recite the trial's headline result, without being able to contextualise its clinical relevance and its limits, has not really translated anything — they have just repeated it.\n\nTranslating clinical practice into medical insight means capturing what MSLs hear in the field — a clinician's unmet need, a barrier to using a therapy correctly, an unexpected safety signal, a gap between guideline recommendations and real-world prescribing — and structuring it so that it becomes something the organisation can act on. Raw field observations are not insights until they are filtered, validated and connected to a specific decision someone inside the company needs to make. This translation step is exactly what Module 5 of this course is dedicated to.\n\nTranslating insight into strategy means connecting what the field is telling Medical Affairs to the Medical Plan, the evidence-generation agenda, publication planning and, where compliant channels allow, informing broader corporate strategy. This is the layer where Medical Affairs stops being a scientific communications channel and becomes what recent industry analysis calls a strategic pillar: an organisation whose field intelligence measurably shapes what evidence gets generated next, what educational gaps get addressed, and how a product's value story evolves over its lifecycle.\n\nThe translator role explains why Medical Affairs professionals need a genuinely unusual combination of skills: deep enough scientific and statistical literacy to interpret evidence correctly (covered in Module 6 of this course), field-level communication skills to have a real two-way scientific conversation rather than a one-way information dump (Module 4), and enough business and strategic literacy to know what the organisation actually needs from that conversation (Module 9). A Medical Science Liaison who is only strong in one of these three languages will eventually hit a ceiling — either as an inaccurate scientist, an ineffective communicator, or a well-liked field presence whose work never actually changes anything upstream.", "sources": [{"label": "McKinsey & Company — A vision for Medical Affairs 2030", "url": "https://www.mckinsey.com/industries/life-sciences/our-insights/a-vision-for-medical-affairs-2030-five-priorities-for-patient-impact"}]}, {"title": "The role of Medical Excellence", "text": "Medical Excellence is the internal function within Medical Affairs responsible for setting the standards, training, tools and quality frameworks that let field and office-based medical teams do their job consistently and compliantly, at scale, across therapeutic areas and geographies. Where an individual MSL or Medical Advisor is judged on the quality of their own scientific interactions, Medical Excellence is judged on whether the whole organisation performs to a consistently high standard — which is a structurally different and complementary problem.\n\nConcretely, Medical Excellence typically owns several interlocking responsibilities. It defines core competency frameworks for MSLs and Medical Advisors — what \"good\" looks like in scientific exchange, insight generation, compliance and stakeholder engagement — and builds the training curricula and certification programs that develop those competencies. It designs and maintains the standard operating procedures and governance frameworks (call planning tools, insight-capture templates, medical review processes for promotional and non-promotional materials) that keep field activity compliant with internal policy and external codes of practice. It also frequently owns the CRM and field-medical technology stack — the systems, like Veeva, that MSLs use daily to plan interactions, log insights and manage territory data — because consistent data quality across a Medical Affairs organisation depends on a well-designed and well-trained-on system, not just individual diligence.\n\nMedical Excellence also plays a central quality-assurance role: auditing scientific interactions and materials, running calibration exercises so that different MSLs and Medical Advisors interpret compliance boundaries the same way, and identifying skill gaps through performance data rather than anecdote. In organisations that take the function seriously, Medical Excellence also owns onboarding — the structured ramp-up a new MSL goes through before being fully autonomous in the field, covering everything from disease-area science to compliance training to CRM proficiency.\n\nWhy does this matter to someone training to become — or already working as — an MSL? Because Medical Excellence is the function that defines the quality bar you will be measured against, builds the training you will go through, and frequently designs the very tools (call reports, insight templates, competency assessments) that shape your day-to-day work. Understanding that Medical Excellence exists, and what it is actually responsible for, helps an MSL engage constructively with training requirements and quality processes rather than experiencing them as arbitrary bureaucracy. It is also worth noting for career planning: Medical Excellence is one of the natural senior-career paths for experienced MSLs and Medical Advisors who want to shape how an entire Medical Affairs organisation operates, rather than only ever managing their own individual territory — a route explored further in Module 12 of this course.", "sources": [{"label": "Medical Affairs Professional Society (MAPS) — professional resources and competency frameworks", "url": "https://medicalaffairs.org/"}]}, {"title": "How the impact of Medical Affairs is measured", "text": "Measuring the impact of Medical Affairs is genuinely harder than measuring Commercial performance, and understanding why is the first step to doing it well. Commercial functions have a clean, immediate proxy for success — sales volume, market share, prescription counts — that ties directly and quickly to a rep's individual activity. Medical Affairs, by design, does not have — and should not create — an equivalent metric, because tying medical activity to a sales-like number would compromise the very independence that makes Medical Affairs credible in the first place.\n\nFor a long time, this measurement gap led Medical Affairs to rely heavily on activity-based metrics: number of KOL interactions, number of medical information requests answered, number of publications supported. Industry analysis increasingly criticises this approach, and for good reason: counting interactions tells you nothing about whether those interactions changed anything. An MSL can log fifty high-quality field visits in a quarter and generate zero insights that ever influence a decision, while another MSL logs half as many visits but surfaces a single insight that reshapes an evidence-generation plan. Activity volume and impact are simply not the same thing.\n\nThe direction the field is moving — reflected in recent MAPS and field-medical-metrics research — is toward outcome-based KPIs tied to patient care, clinical practice change and evidence quality, rather than pure activity counts. In practice, this looks like tracking things such as: the number of medical insights that were actually acted upon by an internal stakeholder (not just logged); measurable changes in clinical practice or guideline positioning that field medical engagement plausibly contributed to; the quality and downstream use of evidence generated with Medical Affairs input (citations, guideline inclusion, HTA submissions); and qualitative feedback — from KOLs, from internal commercial and market-access partners, from evidence-generation teams — about whether Medical Affairs input was genuinely useful.\n\nA second, complementary trend is a stronger emphasis on qualitative assessment alongside quantitative KPIs: structured KOL feedback, internal stakeholder satisfaction with medical support, and documented case studies of insight-to-action pathways. Quantitative metrics answer \"how much did we do\"; qualitative assessment answers the harder and more important question, \"did it matter.\"\n\nFor an individual MSL, this shift has a direct, practical implication: the way you build your own case for impact — in a performance review, in a promotion conversation, in the \"executive report\" skill covered in Module 8 — should not lean primarily on how many visits you completed. It should be built on a small number of well-documented examples where a specific insight you captured, a specific scientific conversation you had, or a specific piece of evidence-generation support you provided led to a traceable outcome. That is the evidence a modern Medical Affairs organisation is actually looking for.", "sources": [{"label": "The MSL Academy — Medical Affairs Metrics: Proving Impact Beyond Traditional KPIs", "url": "https://www.themslacademy.com/blog/medical-affairs-metrics-proving-impact-beyond-traditional-kpis"}, {"label": "The MSL Society — Field Medical Affairs Key Performance Indicators Report", "url": "https://themsls.org/field-medical-affairs-kpi-metrics-report/"}]}], "examples": ["Differentiate a medical action (exploring a specialist's perception of an endpoint) from a promotional action (persuading someone to prescribe a product).", "Design a medical value proposition for a vaccine, a biologic or an oncology treatment, based on unmet need, differential evidence and clinically relevant outcomes.", "Explain to a commercial team, in an alignment session, what Medical can and cannot do: it can share unsolicited evidence within compliance and explore clinical practice; it cannot negotiate commercial terms or take part in sales messaging."], "caseTitle": "Launching a vaccine for older adults", "caseText": "A company is launching a new vaccine for older adults. Before launch, Medical Affairs must map the immunosenescence landscape, identify relevant KOLs and scientific societies, and build disease awareness about the burden of the condition. During launch, it must execute scientific exchange on the mechanism of action and pivotal data, train the field team, and set up a system to capture insights on vaccination barriers. After launch, it must generate RWE on real-world effectiveness, support publications, and feed the following year's Medical Plan with the evidence gaps identified in the field.", "resources": {"framework": "Medical Value Framework (Pre-launch / Peri-launch / Post-launch) — maps what Medical Affairs contributes at each stage of the product lifecycle.", "checklist": ["Does the activity respond to an unsolicited or organically arising scientific need?", "Is it disconnected from any sales objective?", "Does it generate or translate real-world evidence?", "Is it traceable and documentable within the compliance system?", "Does it add value for the patient or the healthcare system, not just the product?"], "prompt": "Act as a Director of Medical Affairs. Given this product and lifecycle stage [describe], define 3 strategic medical priorities and the differential value Medical Affairs must bring versus Commercial and Market Access.", "template": "Medical Value Canvas: Lifecycle stage → Medical objective → Key stakeholder → Available evidence → Evidence gap → Medical activity → Impact KPI.", "glossary": [{"term": "Medical Affairs", "def": "A non-promotional scientific function that generates and communicates evidence."}, {"term": "Scientific Exchange", "def": "A two-way scientific dialogue with a healthcare professional."}, {"term": "Non-promotional", "def": "An activity with no sales intent or message."}, {"term": "Cross-functional alignment", "def": "Coordination between Medical, Commercial, Market Access and R&D while respecting distinct mandates."}]}, "quiz": [{"q": "A sales representative asks the MSL to 'convince' a skeptical physician to prescribe the product using clinical data. What is the correct MSL response?", "options": ["Agree, since the data is real and objective", "Explain that Medical can share scientific evidence in a non-directed way, but cannot have a persuasion objective aimed at sales", "Delegate the conversation to the Medical Manager without explaining why", "Join the representative on the visit to reinforce the commercial message"], "correct": 1, "explain": "Medical Affairs' mandate is scientific and non-promotional; sharing evidence is fine, but the objective can never be to persuade someone to sell."}, {"q": "Which of the following most precisely describes the difference between Market Access and Medical Affairs?", "options": ["Market Access runs clinical trials and Medical Affairs publishes them", "Market Access negotiates value and price with payers; Medical Affairs generates and communicates scientific evidence without negotiating commercial terms", "Both have the same mandate but a different boss", "Medical Affairs only works with patients and Market Access only with physicians"], "correct": 1, "explain": "Market Access translates evidence into an access and pricing argument; Medical Affairs generates and communicates the evidence independently."}, {"q": "A company is about to launch an oncology drug. Which activity is most typical of the pre-launch phase for Medical Affairs?", "options": ["Negotiating the reimbursement price", "Mapping the scientific landscape, identifying evidence gaps and building disease awareness", "Training the sales force on commercial objection handling", "Publishing the post-marketing RWE study"], "correct": 1, "explain": "Pre-launch focuses on scientific shaping: mapping evidence, KOLs and gaps before the product is available."}, {"q": "What is the best way to measure the qualitative impact of Medical Affairs?", "options": ["The number of visits made by the commercial team", "Sales volume", "The quality and actionability of the insights generated, together with the depth of scientific exchange", "The number of emails sent to HCPs"], "correct": 2, "explain": "Qualitative impact focuses on the quality of scientific exchange and the strategic usefulness of insights, not on commercial metrics."}, {"q": "A Medical Manager must explain to a Market Access team why Medical Affairs cannot take part in price negotiations. What is the strongest argument?", "options": ["Because Medical Affairs has no training in health economics", "Because mixing the independent scientific function with commercial negotiation compromises the objectivity of the evidence generated", "Because it isn't their department, full stop", "Because the law explicitly forbids it in every country"], "correct": 1, "explain": "The separation protects the scientific credibility of Medical Affairs in the eyes of HCPs, payers and regulators."}, {"q": "What best represents the evolution of Medical Affairs in recent years?", "options": ["It has reduced its activity to focus only on pharmacovigilance", "It has moved from a reactive support function to a strategic partner that co-designs evidence and strategy from early stages", "It has absorbed the functions of Market Access", "It has become a purely administrative function"], "correct": 1, "explain": "The global trend is toward greater early strategic involvement, not toward a reduced role."}, {"q": "Which of these activities is NOT typical of Medical Excellence?", "options": ["Standardizing insight documentation processes", "Designing ongoing scientific training for the medical team", "Negotiating commercial bonuses for the sales team", "Ensuring compliance in interactions with HCPs"], "correct": 2, "explain": "Medical Excellence focuses on quality, process and medical compliance, not on commercial compensation."}, {"q": "During the loss-of-exclusivity phase of a product, what is the main focus of Medical Affairs?", "options": ["Stop all medical activity because the product is no longer a priority", "Sustain the original product's differential clinical value against generics/biosimilars using accumulated real-world evidence", "Start aggressive price negotiations", "Shift the entire budget to Commercial"], "correct": 1, "explain": "Medical Affairs should reinforce the accumulated differential clinical value (long-term safety, subpopulations, RWE) against cheaper alternatives."}, {"q": "A Director of Medical Affairs wants to demonstrate the scientific ROI of their team to senior leadership. Which combination of KPIs is most appropriate?", "options": ["Only the number of visits made", "Only quarterly sales growth", "Actionable insights generated, evidence gaps closed, quality of KOL relationships, and studies/publications supported", "Only commercial team satisfaction"], "correct": 2, "explain": "The value of Medical Affairs is demonstrated with scientific and relationship metrics, not direct commercial ones."}, {"q": "Which principle best summarizes 'patient centricity' as applied by Medical Affairs?", "options": ["Always prioritizing the lowest price for the patient", "Translating clinical results into real, measurable impact for the patient and the healthcare system, beyond the product's attributes", "Focusing exclusively on prescriber satisfaction", "Avoiding any discussion of adverse events with patients"], "correct": 1, "explain": "Patient centricity means connecting evidence to outcomes that genuinely matter to the patient and the system, not just to the product."}]}, {"num": 2, "title": "The Modern MSL Role", "objective": "Master the responsibilities, competencies and mindset of the modern MSL as a strategic medical partner in their territory.", "lessons": [{"title": "What a Medical Science Liaison actually does", "text": "A Medical Science Liaison is the field-facing scientific expert of a Medical Affairs organisation — the person who leaves the office to build peer-to-peer relationships with physicians, researchers and other healthcare experts, translating the company's clinical evidence into scientifically rigorous, non-promotional conversation. The MSL Society's own definition captures the core of the role well: MSLs serve as the primary link between a pharmaceutical or biotech company and the wider medical community, and their value comes specifically from scientific credibility, not from selling.\n\nDay to day, an MSL's work sits on four pillars. The first is scientific exchange: structured, often one-on-one conversations with Key Opinion Leaders (KOLs) and treating physicians about disease state, mechanism of action, clinical trial data and its practical implications — always initiated for genuine scientific purposes, never as a disguised sales call. The second is insight generation: capturing what those experts say — unmet needs, emerging practice patterns, concerns about a therapy, gaps between guidelines and real-world care — and feeding it back into the organisation in a structured, usable way (the subject of Module 5). The third is support for evidence generation: identifying investigators interested in running an investigator-sponsored study, supporting registries, and helping the organisation understand where real-world evidence gaps exist. The fourth is internal support: answering complex medical questions from internal colleagues, contributing scientific expertise to advisory boards, and reviewing materials for scientific accuracy.\n\nWhat distinguishes an MSL from almost every other pharma-facing role is the specific combination of deep scientific expertise (most MSLs hold a PharmD, PhD, MD or equivalent advanced life-science degree) with field-based, relationship-driven work. Unlike a sales representative, an MSL has no volume or revenue target and is trained to respond to unsolicited questions with balanced, complete answers — including limitations and unfavourable data — because the entire credibility of the role depends on that balance. Unlike a Medical Advisor or Medical Information specialist, who typically work from a fixed office location, the MSL's \"office\" is their territory: hospitals, academic medical centers, clinics and, increasingly, virtual meeting rooms.\n\nFor someone new to the role, the most common misconception is that an MSL is simply \"a more scientific sales rep.\" That framing gets the role backwards. An MSL's job is to be a trustworthy scientific resource first, and any commercial benefit that follows — physician confidence in engaging with the company, willingness to participate in future research, appropriate and informed prescribing — is a downstream consequence of that credibility, never the stated objective of the interaction itself. Everything else in this course — how to map the right people to talk to, how to run a genuinely valuable scientific conversation, how to capture what you hear, how to manage a territory — builds on that single foundational distinction.", "sources": [{"label": "MSL Society — What is a Medical Science Liaison (MSL)?", "url": "https://themsls.org/what-is-an-msl/"}, {"label": "PharmiWeb — What is the Difference Between Working as an MSL and a Medical Advisor?", "url": "https://www.pharmiweb.jobs/article/what-is-the-difference-between-working-as-an-msl-and-a-medical-advisor-"}]}, {"title": "Difference between MSL, Medical Advisor and Medical Manager", "text": "These three titles are frequently confused, including inside pharma companies, because the boundaries can vary by organisation — but the underlying distinction is consistent enough to be worth learning precisely, because it shapes both your day-to-day work and your career planning.\n\nThe Medical Science Liaison is externally oriented and field-based. An MSL's primary working relationships are with people outside the company — KOLs, investigators, treating physicians — and the role is built around direct, in-person or virtual scientific dialogue across a defined geographic territory. Success in the MSL role depends heavily on relationship-building skill, scientific communication ability, and disciplined territory management, because an MSL typically operates with significant autonomy and limited direct oversight.\n\nThe Medical Advisor is internally oriented and typically office- or hub-based. Rather than spending most of their time in the field, a Medical Advisor works strategically within the organisation: reviewing promotional and medical materials for scientific accuracy, supporting internal cross-functional teams (Commercial, Market Access, Regulatory) with medical expertise, contributing to the Medical Plan, and often coordinating the scientific agenda that MSLs then execute in the field. Where an MSL asks \"what does this KOL need to know, and what can I learn from them,\" a Medical Advisor asks \"what does the organisation need to get right, scientifically, across every function that touches this product.\"\n\nThe Medical Manager (sometimes called Field Medical Manager or MSL Manager) is a people-leadership role: managing a team of MSLs, setting therapeutic-area engagement strategy across a region, ensuring consistent territory planning and quality standards, and acting as the link between field intelligence and the broader Medical Affairs leadership team. Becoming a Medical Manager is one of the most common next steps for a senior MSL and represents a shift from being an excellent individual scientific communicator to being responsible for the performance and development of an entire field team.\n\nThese roles are not strictly hierarchical in seniority — a highly experienced MSL and a Medical Advisor may sit at a comparable level — but they represent genuinely different skill emphases: field relationship-building and territory autonomy for the MSL; internal strategic and cross-functional influence for the Medical Advisor; people leadership and team-level strategy for the Medical Manager. Understanding which combination of skills each role rewards helps an MSL plan a deliberate career path rather than simply waiting for the next available promotion, a topic this course returns to directly in Module 12.", "sources": [{"label": "PharmiWeb — What is the Difference Between Working as an MSL and a Medical Advisor?", "url": "https://www.pharmiweb.jobs/article/what-is-the-difference-between-working-as-an-msl-and-a-medical-advisor-"}, {"label": "The MSL Academy — Medical Science Liaison Career Path: Roles & Growth", "url": "https://www.themslacademy.com/blog/medical-science-liaison-career-path"}]}, {"title": "Field medical excellence", "text": "Field medical excellence is the set of standards and disciplines that separate an MSL who is simply busy from an MSL who is genuinely effective. The phrase is used deliberately across the industry to signal that quality, not activity volume, is the real measure of field performance — a distinction that matters enormously because MSLs typically only get a handful of substantive meetings per year with their most important KOLs, and every one of them has to count.\n\nThree disciplines make up field medical excellence in practice. The first is preparation: arriving at every scientific interaction with a clear, specific objective — not \"check in with Dr. X\" but \"understand Dr. X's perspective on the new subgroup data and what evidence would change their prescribing in early-line patients.\" Undirected visits waste both the MSL's time and the expert's, and experienced KOLs notice quickly when a visit has no real purpose.\n\nThe second is genuine two-way scientific exchange rather than one-directional information delivery. A field-medical-excellence mindset treats every interaction as an opportunity to learn something as valuable as what is communicated — the insight-generation dimension of the role covered in depth in Module 5. An MSL who only \"presents data\" is functioning as a walking slide deck, not a scientific peer.\n\nThe third is rigorous follow-through: logging the interaction accurately and promptly, following up on any commitments made (sending a requested paper, connecting the physician with a colleague, escalating an unanswered question), and ensuring the insight actually reaches the people inside the company who can act on it. Excellence that stops at the meeting itself, without follow-through, has only half done the job.\n\nField medical excellence functions also typically define competency frameworks — explicit descriptions of what \"good\" looks like at each stage of interaction (planning, execution, insight capture, follow-up) — and use them for training, calibration and performance review, so that quality is defined consistently across a team rather than being purely a matter of individual style. A common failure mode the industry has identified is over-indexing on visit volume or on access to famous, high-profile KOLs: a well-known expert can absorb enormous MSL time while contributing comparatively little, if the actual scientific dialogue stays superficial. Field medical excellence corrects for that by asking not \"how many visits, and with whom\" but \"how much genuine scientific value moved in both directions.\"\n\nFor a new MSL, adopting field-medical-excellence habits early — clear objectives, real two-way dialogue, disciplined follow-through — builds a reputation for reliability with KOLs and colleagues alike far faster than simply maximising the number of visits logged each month.", "sources": [{"label": "Umbrex — Field Medical and MSL Deployment (Medical Affairs Excellence Playbook)", "url": "https://umbrex.com/resources/life-science-industry-playbooks/the-medical-affairs-excellence-playbook/field-medical-and-msl-deployment/"}, {"label": "Umbrex — Build an MSL Territory and Engagement Plan That Works", "url": "https://umbrex.com/resources/medical-science-liaison-playbook/building-a-territory-and-engagement-plan/"}]}, {"title": "Territory ownership", "text": "Territory ownership is the principle that an MSL treats their assigned geographic and institutional territory as a business they are responsible for running strategically — deciding, with real intentionality, which institutions and experts deserve sustained attention, which interactions genuinely need to happen in person, and, just as importantly, where time should deliberately not be spent. It is the opposite of a reactive calendar that simply fills up with whichever meeting request comes in first.\n\nEffective territory ownership starts with mapping: understanding the full landscape of institutions, investigators, treating physicians and emerging experts across the territory — not just the handful of names already familiar from previous roles or handover notes. This connects directly to the KOL segmentation and mapping techniques covered in Module 3, because a territory plan is only as good as the underlying map of who actually matters and why.\n\nFrom that map, an MSL builds a prioritised engagement plan: which relationships require quarterly in-person contact, which can be maintained through lighter-touch virtual engagement, and which represent emerging opportunities — rising researchers, new institutions building a relevant program — worth investing early relationship capital into before they become widely recognised experts. A well-built territory plan also explicitly identifies where the MSL's evidence-generation priorities and their institutional map intersect: which sites are realistic candidates for investigator-sponsored studies, registry participation, or advisory input.\n\nTerritory ownership also means managing the practical logistics that make field work sustainable: travel planning, congress calendars, balancing time between institutions to avoid neglecting a whole region for months at a time, and protecting enough unscheduled time to actually process and write up insights properly rather than moving straight from one meeting to the next. Industry guidance on field medical deployment is explicit that this translates segmentation strategy into a concrete field plan specifically to ensure MSL time goes to the highest-value scientific work — deployment decisions are strategic, not just logistical.\n\nA useful discipline is to review the territory plan on a fixed cadence — quarterly is common — against what actually happened: Did engagement match the plan? Did new priorities emerge from insights gathered that should reshape next quarter's plan? Owning a territory is not a one-time exercise done during onboarding; it is a continuously updated strategic view that a mature MSL revisits deliberately, rather than letting the territory plan quietly go stale while day-to-day scheduling takes over.", "sources": [{"label": "Definitive Healthcare — 3 Tips to Enhance Your Territory Management Skills", "url": "https://www.definitivehc.com/blog/tips-effective-territory-management"}, {"label": "H1 — From Academia to Patients: The Evolution of MSL Territories", "url": "https://h1.co/blog/from-academia-to-patients-the-evolution-of-msl-territories/"}]}, {"title": "Scientific exchange", "text": "Scientific exchange is the formal term for the core activity of the MSL role: a genuine, balanced, non-promotional dialogue about science between the MSL and a healthcare professional or researcher. It is worth defining precisely, because regulators, compliance functions and codes of practice across the industry treat scientific exchange as a specific, protected category of communication — distinct from promotion — and that distinction only holds if the conversation actually meets certain conditions.\n\nFor an interaction to count as legitimate scientific exchange, several things need to be true. It must be scientifically balanced — presenting both favourable and unfavourable data, and acknowledging the real limitations of the evidence, not just the parts that support the product. It must be responsive to genuine scientific interest, whether initiated by the physician's question or by the MSL identifying a legitimate scientific reason to reach out (a new publication, updated guideline, or relevant safety information) — not driven by a commercial calendar or sales target. It must stay within what is scientifically defensible, including appropriate off-label discussion handled according to the specific legal framework that applies (which varies significantly by country and must always follow local regulatory and company policy). And it must be documented accurately, both for compliance and so the insight generated is not lost.\n\nScientific exchange is fundamentally a two-way process, not a one-way data delivery. The MSL brings clinical trial data, mechanism-of-action science and disease-state expertise; the physician brings real-world clinical experience, questions the trial data did not anticipate, and observations from their own patient population. A conversation where only the MSL talks is not scientific exchange in the full sense — it is a presentation. The best MSLs treat every exchange as an opportunity to ask a genuinely useful question, not just to deliver a rehearsed set of talking points.\n\nThe specific techniques for running high-quality scientific exchange — the types of questions that open genuine dialogue, how to handle scientific objections, how to close a conversation productively — are covered in detail in Module 4 of this course. What matters at this foundational stage is understanding that scientific exchange is not simply \"talking about the science casually.\" It is a structured, principled form of communication with real boundaries, and staying inside those boundaries — balance, genuine scientific purpose, accurate documentation — is what keeps the entire Medical Affairs function credible and compliant.", "sources": [{"label": "MSL Society — What is a Medical Science Liaison (MSL)?", "url": "https://themsls.org/what-is-an-msl/"}]}, {"title": "Internal cross-functional collaboration", "text": "An MSL spends most of their visible time in the field, but a large part of their actual value depends on how well they collaborate internally — with Medical Advisors, Market Access, Commercial (within firewall boundaries), Clinical Development, Regulatory and Medical Excellence. Field insight that never reaches the right internal audience, in a form that audience can use, has effectively not been generated at all.\n\nThe most important internal relationship for most MSLs is with the Medical Advisor and the broader Medical Affairs strategy team, because this is where field insight is meant to flow into the Medical Plan, evidence-generation priorities and publication strategy. This relationship works best when it runs in both directions: the MSL brings field intelligence upward, and the Medical Advisor brings strategic context — what evidence gaps the organisation is actively trying to fill, what questions are currently priorities — back down to the field, so MSLs know what to listen for.\n\nCollaboration with Market Access matters because real-world
